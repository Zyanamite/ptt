<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ပန်းသတင်း Landscape – Premium Shop & Estimator</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --g900: #0a1a12; --g800: #132a1e; --g700: #1e4a2e; --g500: #2e6b40;
            --g300: #6ba57a; --g100: #e1f0e5; --g50: #f5faf6;
            --gold: #c78d20; --gold2: #e8b830; --gold-light: #fffdf5;
            --brown: #8B4513; --cream: #fef9f0; --white: #ffffff;
            --gray-100: #f5f6f4; --gray-200: #e8ebe7; --gray-600: #6b7280; --gray-800: #1e2e21;
            --radius-sm: 10px; --radius: 18px; --radius-lg: 28px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.08); --shadow-xl: 0 20px 48px rgba(0,0,0,0.12);
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{
            font-family:'Inter','Noto Sans Myanmar',system-ui,sans-serif;
            background: linear-gradient(180deg, #fef9f0 0%, #f5f0e6 100%);
            background-attachment: fixed;
            color:var(--gray-800);line-height:1.5;min-height:100vh;
        }

        /* ── Top Bar ── */
        .topbar{
            background:rgba(10,26,18,0.95);backdrop-filter:blur(24px);
            color:white;padding:12px 32px;position:sticky;top:0;z-index:100;
            display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
            border-bottom:1px solid rgba(255,255,255,0.06);
        }
        .brand{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:10px;letter-spacing:-0.4px}
        .brand span{font-size:0.55rem;opacity:0.5;text-transform:uppercase;letter-spacing:2.5px;font-weight:500}
        .top-actions{display:flex;align-items:center;gap:12px}
        .lang-switch{display:flex;background:rgba(255,255,255,0.08);border-radius:22px;padding:2px}
        .lang-btn{padding:7px 16px;border:none;cursor:pointer;font-weight:600;font-size:0.8rem;background:transparent;color:rgba(255,255,255,0.65);border-radius:20px;transition:var(--transition);font-family:inherit}
        .lang-btn.active{background:white;color:var(--g900)}
        .cart-btn{
            background:var(--gold);color:#3d2a00;border:none;padding:10px 22px;border-radius:24px;
            cursor:pointer;font-weight:700;font-size:0.9rem;position:relative;transition:var(--transition);
            font-family:inherit;box-shadow:0 2px 12px rgba(199,141,32,0.3);
            display:flex;align-items:center;gap:6px;
        }
        .cart-btn:hover{background:#e8b830;transform:translateY(-1px);box-shadow:0 4px 16px rgba(199,141,32,0.4)}
        .cart-count{
            background:var(--g900);color:white;width:24px;height:24px;border-radius:50%;font-size:0.65rem;
            display:flex;align-items:center;justify-content:center;font-weight:700;display:none;border:2px solid white;
        }
        .cart-btn .cart-count{position:static;margin-left:4px;width:22px;height:22px;font-size:0.7rem;}

        /* ── Hero ── */
        .hero{
            background:linear-gradient(160deg,#05100a 0%,#0e2017 35%,var(--g800) 70%,#1a3524 100%);
            color:white;text-align:center;padding:80px 20px 70px;position:relative;overflow:hidden;
        }
        .hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 50%,rgba(46,107,64,0.25) 0%,transparent 60%);}
        .hero h1{
            font-size:3rem;font-weight:900;margin-bottom:12px;position:relative;z-index:1;
            letter-spacing:-1.5px;line-height:1.1;
            background: linear-gradient(to right, #f0e68c, #daa520);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p{opacity:0.8;position:relative;z-index:1;font-size:1.15rem;font-weight:400;max-width:650px;margin:0 auto}

        /* ── Tabs ── */
        .tab-bar{
            display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:18px 20px 0;
            position:sticky;top:70px;z-index:99;background:rgba(254,249,240,0.9);backdrop-filter:blur(8px);
        }
        .tab-btn{
            padding:9px 18px;border-radius:22px;border:none;cursor:pointer;font-weight:600;
            font-size:0.82rem;transition:var(--transition);font-family:inherit;
            background:white;color:var(--gray-600);border:1px solid var(--gray-200);
            box-shadow:var(--shadow-sm);
        }
        .tab-btn:hover{border-color:var(--g300);color:var(--g700)}
        .tab-btn.active{background:var(--g700);color:white;border-color:var(--g700);box-shadow:var(--shadow)}
        .tab-btn.popular{background:var(--gold-light);color:#5c3d0a;border-color:var(--gold);font-weight:700}
        .tab-btn.popular.active{background:var(--gold);color:#3d2a00;border-color:var(--gold)}

        .container{max-width:1360px;margin:0 auto;padding:0 24px 80px}
        .section-title{font-size:1.6rem;font-weight:800;color:var(--g900);margin:36px 0 18px;padding-left:18px;border-left:5px solid var(--gold);letter-spacing:-0.4px}

        /* ── Plant Grid ── */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-bottom:32px}
        .card{background:white;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:var(--transition);display:flex;flex-direction:column;position:relative;border:1px solid transparent}
        .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--g100)}
        .card-img-wrap{position:relative;overflow:hidden;height:220px;background:linear-gradient(135deg, #eef3ed, #f5faf6)}
        .card-img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s}
        .card:hover .card-img{transform:scale(1.06)}
        .card-badges{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
        .badge-pop{background:var(--gold);color:#3d2a00;font-size:0.65rem;padding:4px 12px;border-radius:12px;font-weight:700}
        .badge-stock{font-size:0.65rem;padding:4px 12px;border-radius:12px;font-weight:700;text-transform:uppercase}
        .badge-stock.instock{background:#c8e6c9;color:#2e7d32}
        .badge-stock.lowstock{background:#fff3e0;color:#e65100}
        .badge-stock.soldout{background:#ffebee;color:#c62828}
        .card-body{padding:18px;flex:1;display:flex;flex-direction:column}
        .card-body h3{font-size:1rem;font-weight:700;color:var(--g900);margin-bottom:4px;line-height:1.3}
        .card-mm{font-weight:600;color:var(--g700);font-size:0.85rem;margin-bottom:8px}
        .card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
        .card-tags span{background:var(--g100);color:var(--g700);font-size:0.65rem;padding:3px 10px;border-radius:10px;font-weight:500}
        .card-price{font-weight:700;color:#9e5e00;background:var(--gold-light);display:inline-block;padding:6px 16px;border-radius:14px;font-size:0.9rem;margin-top:auto}
        .card-qty{display:flex;align-items:center;gap:8px;margin-top:10px}
        .card-qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--g300);background:white;font-weight:700;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--g700)}
        .card-qty button:hover{background:var(--g100);border-color:var(--g500)}
        .card-qty span{font-weight:600;min-width:24px;text-align:center;font-size:0.9rem}
        .btn-add-cart{background:var(--g700);color:white;border:none;padding:10px 0;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;margin-top:10px;width:100%;transition:var(--transition);font-family:inherit;letter-spacing:-0.2px}
        .btn-add-cart:hover{background:var(--g500);box-shadow:0 4px 14px rgba(46,107,64,0.3)}
        .btn-add-cart.added{background:var(--gold);color:#3d2a00}
        .soldout .card-img-wrap::after{content:'SOLD OUT';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:white;padding:10px 24px;border-radius:10px;font-weight:800;font-size:1rem}
        .soldout .card-img{opacity:0.5}

        /* ── Services Grid ── */
        .service-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:24px}
        .s-card{background:white;border:2px solid var(--gray-200);border-radius:var(--radius);padding:22px 18px;text-align:center;cursor:pointer;transition:var(--transition)}
        .s-card:hover{border-color:var(--g300);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
        .s-card .s-icon{font-size:2.2rem;margin-bottom:10px}
        .s-card h3{font-size:0.95rem;font-weight:700;color:var(--g900);margin-bottom:6px}
        .s-card .s-price{font-weight:700;color:var(--brown);font-size:0.9rem;margin-bottom:8px}
        .s-card .s-features{font-size:0.75rem;color:var(--gray-600);margin-bottom:10px;line-height:1.5}
        .s-card .btn-add-cart{width:auto;padding:9px 24px;display:inline-block;margin-top:auto}

        /* ── Checkout Modal ── */
        .checkout-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
        .checkout-overlay.open{display:flex}
        .checkout-modal{background:white;border-radius:var(--radius-lg);width:100%;max-width:900px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);animation:modalIn 0.4s ease}
        @keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
        .checkout-header{background:linear-gradient(135deg,var(--g900),var(--g700));color:white;padding:26px 32px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;justify-content:space-between;align-items:center}
        .checkout-header h2{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px}
        .checkout-close{background:rgba(255,255,255,0.2);border:none;color:white;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.3rem;transition:var(--transition)}
        .checkout-close:hover{background:rgba(255,255,255,0.35)}
        .checkout-body{padding:32px}
        .checkout-section{margin-bottom:28px}
        .checkout-section h3{font-size:1rem;font-weight:700;color:var(--g900);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--g100);display:flex;align-items:center;gap:8px}
        .checkout-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray-100);gap:14px}
        .checkout-item:last-child{border-bottom:none}
        .checkout-item-img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#eef3ed}
        .checkout-item-info{flex:1}
        .checkout-item-name{font-weight:600;font-size:0.95rem;color:var(--g900)}
        .checkout-item-meta{font-size:0.78rem;color:var(--gray-600)}
        .checkout-item-price{font-weight:700;color:var(--g900);white-space:nowrap;font-size:0.95rem}

        .township-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:8px 0;margin-top:8px}
        .township-header h3{margin:0;border-bottom:none;padding-bottom:0}
        .township-arrow{font-size:1.2rem;transition:transform 0.3s}
        .township-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0;overflow:hidden;transition:max-height 0.4s ease}
        .township-grid.collapsed{max-height:0;margin:0}
        .township-card{background:white;border:2px solid var(--gray-200);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:var(--transition)}
        .township-card:hover,.township-card.selected{border-color:var(--gold);background:var(--gold-light);box-shadow:var(--shadow)}
        .township-card .t-icon{font-size:1.6rem;margin-bottom:6px}
        .township-card strong{display:block;font-size:0.82rem;color:var(--g900)}
        .township-card .t-fee{font-weight:700;color:var(--gold);font-size:0.82rem}
        .township-card .t-desc{font-size:0.68rem;color:var(--gray-600)}
        .township-card.selected{background:var(--g700);color:white;border-color:var(--g700)}
        .township-card.selected strong,.township-card.selected .t-fee,.township-card.selected .t-desc{color:white}

        .checkout-summary{background:var(--g50);border-radius:var(--radius);padding:22px;margin:20px 0}
        .checkout-line{display:flex;justify-content:space-between;padding:6px 0;font-size:0.92rem}
        .checkout-line.grand{font-size:1.3rem;font-weight:800;border-top:2px solid var(--g300);padding-top:14px;margin-top:10px;color:var(--g900)}
        .checkout-discount{color:var(--gold);font-weight:600;font-size:0.82rem;text-align:right}

        .contact-grid{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
        .contact-card{flex:1;min-width:120px;background:white;border:2px solid var(--gray-200);border-radius:var(--radius);padding:16px;text-align:center;text-decoration:none;color:inherit;transition:var(--transition)}
        .contact-card:hover{border-color:var(--g300);box-shadow:var(--shadow)}
        .contact-card .cc-icon{font-size:1.8rem;margin-bottom:6px}
        .contact-card strong{display:block;font-size:0.82rem;color:var(--g900)}

        .action-grid{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
        .btn-act{padding:13px 18px;border-radius:12px;font-weight:700;text-align:center;cursor:pointer;font-size:0.88rem;border:none;font-family:inherit;transition:var(--transition);flex:1;min-width:100px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
        .btn-act.primary{background:var(--g700);color:white}
        .btn-act.primary:hover{background:var(--g500)}
        .btn-act.gold{background:var(--gold);color:#3d2a00}
        .btn-act.gold:hover{background:#e8b830}
        .btn-act.white{background:white;color:var(--g700);border:2px solid var(--g700)}
        .btn-act.white:hover{background:var(--g50)}
        .btn-act.whatsapp{background:#25D366;color:white}
        .btn-act.whatsapp:hover{background:#1fb855}
        .btn-act.danger{background:#ffebee;color:#c62828;border:2px solid #ffcdd2}
        .btn-act.danger:hover{background:#ffcdd2}

        .back-top{position:fixed;bottom:30px;right:30px;width:52px;height:52px;background:var(--g700);color:white;border:none;border-radius:50%;font-size:1.4rem;cursor:pointer;z-index:150;box-shadow:var(--shadow-lg);transition:var(--transition);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateY(20px)}
        .back-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
        .back-top:hover{background:var(--g500);transform:translateY(-4px)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--g900);color:white;padding:12px 28px;border-radius:28px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;font-size:0.88rem;box-shadow:var(--shadow-lg)}
        .toast.show{opacity:1}

        @media(max-width:768px){.hero h1{font-size:2rem}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.card-img-wrap{height:170px}.checkout-modal{border-radius:var(--radius)}.checkout-header{border-radius:var(--radius) var(--radius) 0 0}.tab-btn{font-size:0.72rem;padding:7px 12px}.township-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand">🌿 ပန်းသတင်း <span>LANDSCAPE</span></div>
    <div class="top-actions">
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="mm">မြန်မာ</button>
        </div>
        <button class="cart-btn" id="btnCartOpen">
            🛒 <span id="cartLabel">Cart</span><span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</div>

<header class="hero">
    <h1>🌿 Plant Shop & Estimator</h1>
    <p data-en="Curated plants, elegant pots & professional services – delivered to your door" data-mm="ရွေးချယ်ထားသောအပင်များ၊ လှပသောအိုးများနှင့် ကျွမ်းကျင်ဝန်ဆောင်မှုများ – အိမ်အရောက်ပို့ဆောင်ပေးသည်">Curated plants, elegant pots & professional services – delivered to your door</p>
</header>

<div class="tab-bar" id="tabBar">
    <button class="tab-btn popular active" data-tab="popular">🔥 Popular</button>
    <button class="tab-btn" data-tab="all">🌿 All Plants</button>
    <button class="tab-btn" data-tab="fruits">🍋 Fruits</button>
    <button class="tab-btn" data-tab="orchids">🌸 Orchids</button>
    <button class="tab-btn" data-tab="pots">🪴 Pots</button>
    <button class="tab-btn" data-tab="shrubs">🌺 Shrubs</button>
    <button class="tab-btn" data-tab="trees">🌳 Trees</button>
    <button class="tab-btn" data-tab="indoor">🏠 Indoor</button>
    <button class="tab-btn" data-tab="perennials">🌸 Perennials</button>
    <button class="tab-btn" data-tab="fence">🌿 Fence</button>
    <button class="tab-btn" data-tab="services">🛠️ Services</button>
</div>

<div class="container" id="contentContainer">
    <p style="text-align:center;color:#999;padding:60px 0">Loading premium catalog...</p>
</div>

<button class="back-top" id="backTop" title="Back to top">↑</button>

<!-- CHECKOUT MODAL -->
<div class="checkout-overlay" id="checkoutOverlay">
    <div class="checkout-modal">
        <div class="checkout-header">
            <h2 data-en="Your Project Estimate" data-mm="သင့်ပရောဂျက်ခန့်မှန်းခြေ">Your Project Estimate</h2>
            <button class="checkout-close" id="btnCheckoutClose">×</button>
        </div>
        <div class="checkout-body" id="checkoutBody"></div>
    </div>
</div>

<script>
(function(){
var currentLang='en';
var cart=JSON.parse(localStorage.getItem('ptt_cart')||'[]');
var plantCatalogData=[],serviceCatalogData=[],currentTab='popular';
var PLANTS_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR22WF-9wb_hxPWqloOoUYxRgbcWi46lbDIw65JtHLMtMMETMzChz1pcRieoJR_nBHb210NxJzmOqDT/pub?gid=616508581&single=true&output=csv';
var SERVICES_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR22WF-9wb_hxPWqloOoUYxRgbcWi46lbDIw65JtHLMtMMETMzChz1pcRieoJR_nBHb210NxJzmOqDT/pub?gid=237556812&single=true&output=csv';
 
var townships = [
    {nameEN:"Self Pickup", nameMM:"ကိုယ်တိုင်လာယူ", fee:0, icon:"🚶"},
    {nameEN:"Hlaing", nameMM:"လှိုင်", fee:3000, icon:"🏘️"},
    {nameEN:"Kamayut", nameMM:"ကမာရွတ်", fee:3000, icon:"🏫"},
    {nameEN:"Sanchaung", nameMM:"စမ်းချောင်း", fee:3000, icon:"🏠"},
    {nameEN:"Dagon", nameMM:"ဒဂုံ", fee:4000, icon:"🏢"},
    {nameEN:"Bahan", nameMM:"ဗဟန်း", fee:4000, icon:"🏛️"},
    {nameEN:"Mayangone", nameMM:"မရမ်းကုန်း", fee:5000, icon:"🏡"},
    {nameEN:"Insein", nameMM:"အင်းစိန်", fee:5000, icon:"🏭"},
    {nameEN:"Mingaladon", nameMM:"မင်္ဂလာဒုံ", fee:7000, icon:"✈️"},
    {nameEN:"North Okkalapa", nameMM:"မြောက်ဥက္ကလာပ", fee:6000, icon:"🌳"},
    {nameEN:"South Okkalapa", nameMM:"တောင်ဥက္ကလာပ", fee:6000, icon:"🌇"},
    {nameEN:"Thingangyun", nameMM:"သင်္ဃန်းကျွန်း", fee:5000, icon:"🕌"},
    {nameEN:"Tamwe", nameMM:"တာမွေ", fee:4000, icon:"🏬"},
    {nameEN:"Thanlyin", nameMM:"သန်လျင်", fee:10000, icon:"🌉"}
];

function parseCSV(t){var r=[],c='',q=false;for(var i=0;i<t.length;i++){var ch=t.charAt(i);if(ch=='"')q=!q;else if(ch===','&&!q){r.push(c.trim());c='';}else c+=ch;}r.push(c.trim());return r;}
function fetchCSV(u){return fetch(u).then(r=>r.text()).then(t=>t.trim().split('\n').map(parseCSV));}

function buildCatalog(d){plantCatalogData=[];for(var i=1;i<d.length;i++){var r=d[i];if(r.length<2)continue;plantCatalogData.push({type:r[0]||'Plant',file:r[1],nameEN:r[2]||'',nameMM:r[3]||r[2],catEN:r[4]||'',catMM:r[5]||r[4],priceLow:parseInt((r[6]||'0').replace(/,/g,''))||0,priceHigh:parseInt((r[7]||'0').replace(/,/g,''))||0,status:(r[8]||'instock').toLowerCase(),badge:r[9]||'',badgeClass:r[10]||'',sci:r[11]||'',descEN:r[12]||'',descMM:r[13]||'',tags:(r[14]||'').split('|').map(t=>t.trim()).filter(Boolean)});}renderContent();}
function buildServices(d){serviceCatalogData=[];for(var i=1;i<d.length;i++){var r=d[i];if(r.length<5)continue;serviceCatalogData.push({cat:r[0]||'',nameEN:r[1]||'',nameMM:r[2]||r[1],priceLow:parseInt((r[3]||'0').replace(/,/g,''))||0,priceHigh:parseInt((r[4]||'0').replace(/,/g,''))||0,isRange:(parseInt((r[3]||'0').replace(/,/g,''))||0)!==(parseInt((r[4]||'0').replace(/,/g,''))||0),features:(r[5]||'').split('|').map(f=>f.trim()).filter(Boolean)});}renderContent();}

function getPopular(){return plantCatalogData.filter(p=>p.badge&&/popular|bestseller|trending|premium/i.test(p.badge));}
function getByCat(tab){var m={fruits:'fruit',orchids:'orchid',shrubs:'shrub',trees:'tree',indoor:'indoor',perennials:'perennial',fence:'fence'};if(tab==='pots')return plantCatalogData.filter(p=>p.type==='Pot'||/pot/i.test(p.catEN));var k=m[tab];return k?plantCatalogData.filter(p=>new RegExp(k,'i').test(p.catEN)):plantCatalogData;}

function renderCard(p){
    var dn=currentLang==='mm'?p.nameMM:p.nameEN;
    var price=p.priceLow===p.priceHigh?p.priceLow.toLocaleString()+' Ks':p.priceLow.toLocaleString()+' – '+p.priceHigh.toLocaleString()+' Ks';
    var sold=p.status==='soldout';
    var h='<div class="card'+(sold?' soldout':'')+'">';
    h+='<div class="card-img-wrap"><img class="card-img" src="images/'+p.file+'" alt="'+dn+'" loading="lazy" onerror="this.style.display=\'none\'">';
    h+='<div class="card-badges">';
    if(p.badge&&/popular|bestseller/i.test(p.badge))h+='<span class="badge-pop">🔥 '+p.badge+'</span>';else h+='<span></span>';
    if(p.status!=='instock')h+='<span class="badge-stock '+p.status+'">'+p.status+'</span>';else h+='<span></span>';
    h+='</div></div><div class="card-body"><h3>'+dn+'</h3>';
    if(p.nameMM!==p.nameEN)h+='<div class="card-mm">'+p.nameMM+'</div>';
    if(p.tags.length)h+='<div class="card-tags">'+p.tags.map(t=>'<span>'+t+'</span>').join('')+'</div>';
    h+='<span class="card-price">'+price+'</span>';
    if(!sold){
        h+='<div class="card-qty"><button class="qty-minus">−</button><span class="qty-num">1</span><button class="qty-plus">+</button></div>';
        h+='<button class="btn-add-cart" data-file="'+p.file+'" data-en="'+p.nameEN+'" data-mm="'+p.nameMM+'" data-lo="'+p.priceLow+'" data-hi="'+p.priceHigh+'">🛒 '+(currentLang==='mm'?'ထည့်မည်':'Add to Cart')+'</button>';
    }
    h+='</div></div>';return h;
}

function renderContent(){
    var html='';
    if(currentTab==='services'){renderServices();return;}
    var items=currentTab==='popular'?getPopular():currentTab==='all'?plantCatalogData:getByCat(currentTab);
    if(currentTab==='all'||currentTab==='popular'){
        html+='<div class="grid">'+items.map(renderCard).join('')+'</div>';
    }else{
        var g={};items.forEach(p=>{var c=currentLang==='mm'?p.catMM:p.catEN;if(!g[c])g[c]=[];g[c].push(p);});
        for(var c in g){html+='<h2 class="section-title">'+c+'</h2><div class="grid">'+g[c].map(renderCard).join('')+'</div>';}
    }
    document.getElementById('contentContainer').innerHTML=html||'<p class="empty-text">No items found</p>';
    bindButtons();window.scrollTo({top:0,behavior:'smooth'});
}

function renderServices(){
    var g={};serviceCatalogData.forEach(s=>{var c=s.cat||'Other';if(!g[c])g[c]=[];g[c].push(s);});
    var h='<h2 class="section-title">🛠️ '+(currentLang==='mm'?'ဝန်ဆောင်မှုများ':'Services')+'</h2>';
    for(var c in g){h+='<h3 style="margin:22px 0 12px;color:var(--g900);font-weight:700;font-size:1.1rem">'+c+'</h3><div class="service-grid">';
        g[c].forEach(s=>{var n=currentLang==='mm'?s.nameMM:s.nameEN;var p=s.isRange?s.priceLow.toLocaleString()+' – '+s.priceHigh.toLocaleString()+' Ks':s.priceLow.toLocaleString()+' Ks';
            h+='<div class="s-card"><div class="s-icon">🛠️</div><h3>'+n+'</h3><div class="s-price">'+p+'</div>';
            if(s.features.length)h+='<div class="s-features">'+s.features.map(f=>'🌿 '+f).join('<br>')+'</div>';
            h+='<button class="btn-add-cart" data-svc="'+s.nameEN+'" data-mm="'+s.nameMM+'" data-price="'+Math.round((s.priceLow+s.priceHigh)/2)+'">'+(currentLang==='mm'?'+ ထည့်မည်':'+ Add to Cart')+'</button></div>';});
        h+='</div>';}
    document.getElementById('contentContainer').innerHTML=h;bindButtons();window.scrollTo({top:0,behavior:'smooth'});
}

function bindButtons(){
    document.querySelectorAll('.qty-minus').forEach(b=>b.addEventListener('click',function(e){e.preventDefault();var n=this.parentElement.querySelector('.qty-num');var v=parseInt(n.textContent)||1;if(v>1)n.textContent=v-1;}));
    document.querySelectorAll('.qty-plus').forEach(b=>b.addEventListener('click',function(e){e.preventDefault();var n=this.parentElement.querySelector('.qty-num');var v=parseInt(n.textContent)||1;if(v<99)n.textContent=v+1;}));
    document.querySelectorAll('.btn-add-cart[data-file]').forEach(b=>b.addEventListener('click',function(){
        var f=this.dataset.file,en=this.dataset.en,mm=this.dataset.mm,lo=parseInt(this.dataset.lo),hi=parseInt(this.dataset.hi);
        var qty=parseInt(this.parentElement.querySelector('.qty-num').textContent)||1;
        var unit=Math.round((lo+hi)/2);
        var ex=cart.find(c=>c.file===f);if(ex)ex.qty+=qty;else cart.push({file:f,nameEN:en,nameMM:mm,unitPrice:unit,qty:qty,size:'medium',type:'plant'});
        saveCart();updateCartBadge();showToast(currentLang==='mm'?'✅ ထည့်ပြီးပါပြီ':'✅ Added!');
        this.classList.add('added');this.textContent='✅';var self=this;
        setTimeout(()=>{self.classList.remove('added');self.textContent='🛒 '+(currentLang==='mm'?'ထည့်မည်':'Add to Cart');},1200);
        this.parentElement.querySelector('.qty-num').textContent='1';
    }));
    document.querySelectorAll('.btn-add-cart[data-svc]').forEach(b=>b.addEventListener('click',function(){
        var n=this.dataset.svc,mm=this.dataset.mm||n,pr=parseInt(this.dataset.price);
        var ex=cart.find(c=>c.service===n);if(ex)ex.qty++;else cart.push({service:n,nameEN:n,nameMM:mm,unitPrice:pr,qty:1,isService:true,type:'service'});
        saveCart();updateCartBadge();showToast(currentLang==='mm'?'✅ ထည့်ပြီးပါပြီ':'✅ Added!');
    }));
}

function saveCart(){localStorage.setItem('ptt_cart',JSON.stringify(cart));}
function updateCartBadge(){
    var count=cart.reduce((s,i)=>s+(i.qty||1),0);
    var ce=document.getElementById('cartCount'),le=document.getElementById('cartLabel');
    ce.style.display=count?'flex':'none';ce.textContent=count;
    le.textContent=(currentLang==='mm'?'ဈေးခြင်း':'Cart')+(count?' ('+count+')':'');
}

function openCheckout(){
    if(!cart.length){showToast(currentLang==='mm'?'ဈေးခြင်းဗလာဖြစ်နေသည်':'Cart is empty');return;}
    var plants=cart.filter(i=>i.type==='plant'), services=cart.filter(i=>i.type==='service');
    var plantSub=plants.reduce((s,i)=>s+(i.unitPrice||0)*(i.qty||1),0);
    var serviceSub=services.reduce((s,i)=>s+(i.unitPrice||0)*(i.qty||1),0);
    var subtotal=plantSub+serviceSub;
    var deliveryFee=0, selectedTownship=townships[0];

    var html='';
    if(plants.length){
        html+='<div class="checkout-section"><h3>🌱 '+(currentLang==='mm'?'အပင်နှင့်အိုး':'Plants & Pots')+'</h3>';
        plants.forEach(item=>{
            var name=currentLang==='mm'?(item.nameMM||item.nameEN):item.nameEN;
            var lt=(item.unitPrice||0)*(item.qty||1);
            var imgSrc = item.file ? 'images/'+item.file : 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44"%3E%3Crect fill="%23e8f5e9" width="44" height="44"/%3E%3Ctext x="50%25" y="55%25" text-anchor="middle" fill="%232d5a3f" font-size="16" font-family="sans-serif"%3E🌱%3C/text%3E%3C/svg%3E';
            html+='<div class="checkout-item"><img class="checkout-item-img" src="'+imgSrc+'" alt=""><div class="checkout-item-info"><div class="checkout-item-name">'+name+'</div><div class="checkout-item-meta">Qty: '+item.qty+' | '+item.unitPrice.toLocaleString()+' Ks</div></div><div class="checkout-item-price">'+lt.toLocaleString()+' Ks</div></div>';
        });
        html+='</div>';
    }
    if(services.length){
        html+='<div class="checkout-section"><h3>🛠️ '+(currentLang==='mm'?'ဝန်ဆောင်မှု':'Services')+'</h3>';
        services.forEach(item=>{
            var name=currentLang==='mm'?(item.nameMM||item.nameEN):item.nameEN;
            var lt=(item.unitPrice||0)*(item.qty||1);
            html+='<div class="checkout-item"><div class="checkout-item-img" style="background:#fef7e8;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">🛠️</div><div class="checkout-item-info"><div class="checkout-item-name">'+name+'</div><div class="checkout-item-meta">Qty: '+item.qty+' | '+item.unitPrice.toLocaleString()+' Ks</div></div><div class="checkout-item-price">'+lt.toLocaleString()+' Ks</div></div>';
        });
        html+='</div>';
    }
    html+='<div class="township-header" id="townshipHeader"><h3>📍 '+(currentLang==='mm'?'ပို့ဆောင်မည့်မြို့နယ်':'Delivery Township')+'</h3><span class="township-arrow">▼</span></div>';
    html+='<div class="township-grid" id="townshipGrid">';
    townships.forEach((t,i)=>{
        html+='<div class="township-card'+(i===0?' selected':'')+'" data-index="'+i+'" data-fee="'+t.fee+'"><div class="t-icon">'+t.icon+'</div><strong>'+(currentLang==='mm'?t.nameMM:t.nameEN)+'</strong><div class="t-fee">'+(t.fee===0?(currentLang==='mm'?'အခမဲ့':'Free'):t.fee.toLocaleString()+' Ks')+'</div><div class="t-desc">'+(currentLang==='mm'?'ပို့ဆောင်ခ':'Delivery fee')+'</div></div>';
    });
    html+='</div>';
    html+='<div class="checkout-summary" id="chkSummary"><div class="checkout-line"><span>'+(currentLang==='mm'?'စုစုပေါင်း':'Subtotal')+'</span><span>'+subtotal.toLocaleString()+' Ks</span></div><div class="checkout-line"><span>'+(currentLang==='mm'?'ပို့ဆောင်ခ':'Delivery')+'</span><span id="chkDeliveryFee">0 Ks</span></div><div class="checkout-discount" id="chkDiscount"></div><div class="checkout-line grand"><span>💰 '+(currentLang==='mm'?'စုစုပေါင်း':'Grand Total')+'</span><span id="chkGrand">'+subtotal.toLocaleString()+' Ks</span></div></div>';
    html+='<div class="contact-grid"><a href="tel:+959123456789" class="contact-card"><div class="cc-icon">📞</div><strong>'+(currentLang==='mm'?'ဖုန်း':'Call')+'</strong></a><a href="https://m.me/yourpage" target="_blank" class="contact-card"><div class="cc-icon">💬</div><strong>Messenger</strong></a></div>';
    html+='<div class="action-grid">';
    html+='<button class="btn-act primary" id="btnEmailEst">📧 '+(currentLang==='mm'?'အီးမေးလ်':'Email')+'</button>';
    html+='<button class="btn-act whatsapp" id="btnWA">📱 WhatsApp</button>';
    html+='<button class="btn-act white" id="btnGenerateCard">📸 '+(currentLang==='mm'?'ကဒ်ထုတ်မည်':'Card')+'</button>';
    html+='<button class="btn-act white" id="btnPrint">🖨 '+(currentLang==='mm'?'ပရင့်':'Print')+'</button>';
    html+='<button class="btn-act white" id="btnCopyText">📋 '+(currentLang==='mm'?'ကူးယူ':'Copy')+'</button>';
    html+='<button class="btn-act danger" id="btnClearCart">🗑 '+(currentLang==='mm'?'ဖျက်မည်':'Clear Cart')+'</button>';
    html+='</div>';

    document.getElementById('checkoutBody').innerHTML=html;
    document.getElementById('checkoutOverlay').classList.add('open');

    var townshipGrid=document.getElementById('townshipGrid');
    var arrow=document.querySelector('.township-arrow');
    document.getElementById('townshipHeader').addEventListener('click',function(){townshipGrid.classList.toggle('collapsed');arrow.textContent=townshipGrid.classList.contains('collapsed')?'▶':'▼';});
    var updateSummary=function(){
        var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da;
        document.getElementById('chkDeliveryFee').textContent=deliveryFee?deliveryFee.toLocaleString()+' Ks':(currentLang==='mm'?'အခမဲ့':'Free');
        document.getElementById('chkDiscount').textContent=disc?(currentLang==='mm'?'🎉 '+disc*100+'% လျှော့စျေး (-'+da.toLocaleString()+' Ks)':'🎉 '+disc*100+'% discount (-'+da.toLocaleString()+' Ks)'):'';
        document.getElementById('chkGrand').textContent=gt.toLocaleString()+' Ks';
    };
    document.querySelectorAll('.township-card').forEach(card=>{card.addEventListener('click',function(){document.querySelectorAll('.township-card').forEach(c=>c.classList.remove('selected'));this.classList.add('selected');deliveryFee=parseInt(this.dataset.fee);selectedTownship=townships[parseInt(this.dataset.index)];updateSummary();});});

    // Receipt generator (FULLY WORKING)
    document.getElementById('btnGenerateCard').addEventListener('click',function(){
        var cardDiv=document.createElement('div');
        cardDiv.style.cssText='position:fixed;top:0;left:0;width:420px;background:white;padding:28px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,0.25);z-index:9999;font-family:Inter,sans-serif';
        var itemsHtml='';
        cart.forEach(i=>{var n=currentLang==='mm'?(i.nameMM||i.nameEN||i.service):(i.nameEN||i.service);itemsHtml+='<div style="display:flex;justify-content:space-between;font-size:0.9rem;padding:6px 0;border-bottom:1px solid #f0f0f0"><span>'+n+' ×'+i.qty+'</span><span>'+(i.unitPrice*i.qty).toLocaleString()+' Ks</span></div>';});
        var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da;
        cardDiv.innerHTML='<div style="font-weight:800;font-size:1.4rem;color:#1a3b2b;margin-bottom:4px">🌿 ပန်းသတင်း LANDSCAPE</div><div style="font-weight:700;color:#2d5a3f;border-bottom:2px dashed #8ab89a;padding-bottom:10px;margin-bottom:14px">Estimate / ခန့်မှန်းခြေ</div>'+itemsHtml+'<div style="border-top:2px solid #8ab89a;margin-top:10px;padding-top:10px"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>'+subtotal.toLocaleString()+' Ks</span></div><div style="display:flex;justify-content:space-between"><span>Delivery ('+(currentLang==='mm'?selectedTownship.nameMM:selectedTownship.nameEN)+')</span><span>'+(deliveryFee?deliveryFee.toLocaleString()+' Ks':'Free')+'</span></div>'+(disc?'<div style="display:flex;justify-content:space-between"><span>Discount</span><span>-'+da.toLocaleString()+' Ks</span></div>':'')+'<div style="display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;margin-top:6px"><span>GRAND TOTAL</span><span>'+gt.toLocaleString()+' Ks</span></div></div><div style="font-size:0.75rem;color:#6b7280;text-align:center;margin-top:14px">📞 09-123-456-789 | pttlandscapeservices@gmail.com</div>';
        document.body.appendChild(cardDiv);
        html2canvas(cardDiv,{backgroundColor:'white',scale:2}).then(canvas=>{
            document.body.removeChild(cardDiv);
            var a=document.createElement('a');
            a.download='estimate-'+new Date().toISOString().slice(0,10)+'.png';
            a.href=canvas.toDataURL('image/png');
            a.click();
            showToast('📸 Card downloaded!');
        }).catch(()=>{document.body.removeChild(cardDiv);showToast('⚠️ Failed');});
    });

    document.getElementById('btnEmailEst').addEventListener('click',function(){ var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da; var t=buildCartText(deliveryFee,disc,da,gt,selectedTownship); window.location.href='mailto:pttlandscapeservices@gmail.com?subject='+encodeURIComponent('Landscape Estimate')+'&body='+encodeURIComponent(t); });
    document.getElementById('btnWA').addEventListener('click',function(){ var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da; window.open('https://wa.me/959123456789?text='+encodeURIComponent(buildCartText(deliveryFee,disc,da,gt,selectedTownship))); });
    document.getElementById('btnPrint').addEventListener('click',()=>window.print());
    document.getElementById('btnCopyText').addEventListener('click',function(){ var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da; navigator.clipboard.writeText(buildCartText(deliveryFee,disc,da,gt,selectedTownship)).then(()=>showToast('📋 Copied!')); });
    document.getElementById('btnClearCart').addEventListener('click',function(){ if(confirm(currentLang==='mm'?'ဖျက်မှာသေချာလား။':'Clear all items?')){cart=[];saveCart();updateCartBadge();document.getElementById('checkoutOverlay').classList.remove('open');} });
}

function buildCartText(deliveryFee,disc,da,gt,township){
    var t='🌿 ပန်းသတင်း LANDSCAPE ESTIMATE\n'+'='.repeat(35)+'\n\n';
    cart.forEach(i=>{var n=currentLang==='mm'?(i.nameMM||i.nameEN||i.service):(i.nameEN||i.service);t+='• '+n+' ×'+i.qty+' = '+(i.unitPrice*i.qty).toLocaleString()+' Ks\n';});
    t+='\nSubtotal: '+cart.reduce((s,i)=>s+(i.unitPrice||0)*(i.qty||1),0).toLocaleString()+' Ks';
    t+='\nDelivery ('+(currentLang==='mm'?township.nameMM:township.nameEN)+'): '+(deliveryFee?deliveryFee.toLocaleString()+' Ks':'Free');
    if(disc)t+='\nDiscount: -'+da.toLocaleString()+' Ks';
    t+='\n💰 GRAND TOTAL: '+gt.toLocaleString()+' Ks';
    t+='\n\n📞 09-123-456-789 | pttlandscapeservices@gmail.com';
    return t;
}

document.getElementById('btnCartOpen').addEventListener('click',openCheckout);
document.getElementById('btnCheckoutClose').addEventListener('click',function(){document.getElementById('checkoutOverlay').classList.remove('open');});
document.getElementById('checkoutOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');currentTab=this.dataset.tab;renderContent();}));
var backTop=document.getElementById('backTop');window.addEventListener('scroll',function(){backTop.classList.toggle('visible',window.scrollY>500);});backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
function setLang(lang){currentLang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.querySelectorAll('[data-en][data-mm]').forEach(el=>{var t=el.dataset[lang];if(!t)return;if(el.tagName==='OPTION')el.textContent=t;else el.childNodes.forEach(n=>{if(n.nodeType===3)n.textContent=t;});});renderContent();updateCartBadge();}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',function(){setLang(this.dataset.lang);}));
function showToast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),100);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2500);}
Promise.all([fetchCSV(PLANTS_CSV_URL),fetchCSV(SERVICES_CSV_URL)]).then(([p,s])=>{buildCatalog(p);buildServices(s);updateCartBadge();}).catch(()=>{document.getElementById('contentContainer').innerHTML='<p style="text-align:center;color:#c62828;padding:60px">⚠️ Unable to load catalog.</p>';});
})();
</script>
</body>
</html>
