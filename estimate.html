<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ပန်းသတင်း Landscape – Shop & Estimate</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --g900: #0a1a12; --g800: #12261c; --g700: #1e4a30; --g500: #3a7a50; --g300: #7ab890; --g100: #e0f0e4; --g50: #f2f8f4;
            --gold: #d4a017; --gold2: #e8c840; --gold-light: #fffdf0; --gold-pale: #fff8e0;
            --brown: #7a3e10; --cream: #fdf8f0; --white: #ffffff;
            --gray-50: #fafbf9; --gray-100: #f4f5f3; --gray-200: #e6e9e5; --gray-400: #a0a8a0; --gray-600: #6b7280; --gray-800: #1a1f1c;
            --red-100: #fee2e2; --red-500: #dc2626;
            --radius-xs: 8px; --radius-sm: 12px; --radius: 18px; --radius-lg: 28px; --radius-xl: 36px;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.03); --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow: 0 4px 20px rgba(0,0,0,0.06); --shadow-lg: 0 12px 36px rgba(0,0,0,0.08);
            --shadow-xl: 0 20px 50px rgba(0,0,0,0.12); --shadow-2xl: 0 30px 60px rgba(0,0,0,0.15);
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{
            font-family:'Inter','Noto Sans Myanmar',system-ui,sans-serif;
            background:linear-gradient(180deg, #fdf8f0 0%, #f4f8f2 30%, #f8faf7 60%, #fdf8f0 100%);
            background-attachment:fixed;color:var(--gray-800);line-height:1.6;min-height:100vh;
        }

        /* ── Decorative Background ── */
        body::before{
            content:'';position:fixed;top:-200px;right:-200px;width:600px;height:600px;
            background:radial-gradient(circle,rgba(122,184,144,0.08) 0%,transparent 70%);
            border-radius:50%;pointer-events:none;z-index:0;
        }
        body::after{
            content:'';position:fixed;bottom:-150px;left:-150px;width:500px;height:500px;
            background:radial-gradient(circle,rgba(212,160,23,0.06) 0%,transparent 70%);
            border-radius:50%;pointer-events:none;z-index:0;
        }

        .topbar{
            background:rgba(10,26,18,0.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            color:white;padding:14px 32px;position:sticky;top:0;z-index:100;
            display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
            border-bottom:1px solid rgba(255,255,255,0.06);box-shadow:0 2px 20px rgba(0,0,0,0.15);
        }
        .brand{
            font-weight:900;font-size:1.25rem;display:flex;align-items:center;gap:10px;
            letter-spacing:-0.5px;background:linear-gradient(135deg,#fff,#d4e8c0);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .brand .logo-icon{font-size:1.6rem;-webkit-text-fill-color:initial}
        .brand span{font-size:0.5rem;opacity:0.55;text-transform:uppercase;letter-spacing:2.5px;font-weight:500;-webkit-text-fill-color:rgba(255,255,255,0.6)}
        .top-actions{display:flex;align-items:center;gap:12px}
        .lang-switch{display:flex;background:rgba(255,255,255,0.06);border-radius:26px;padding:3px;border:1px solid rgba(255,255,255,0.08)}
        .lang-btn{
            padding:8px 18px;border:none;cursor:pointer;font-weight:600;font-size:0.78rem;
            background:transparent;color:rgba(255,255,255,0.65);border-radius:24px;
            transition:var(--transition);font-family:inherit;letter-spacing:-0.2px;
        }
        .lang-btn.active{background:white;color:var(--g900);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .cart-btn{
            background:linear-gradient(135deg,var(--gold),#c8880a);color:#3d2a00;
            border:none;padding:10px 22px;border-radius:26px;cursor:pointer;
            font-weight:700;font-size:0.85rem;position:relative;transition:var(--transition);
            font-family:inherit;box-shadow:0 4px 16px rgba(212,160,23,0.35);
            letter-spacing:-0.2px;
        }
        .cart-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,160,23,0.45)}
        .cart-count{
            position:absolute;top:-8px;right:-8px;background:var(--g900);color:white;
            width:26px;height:26px;border-radius:50%;font-size:0.65rem;display:flex;
            align-items:center;justify-content:center;font-weight:700;display:none;
            border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }

        .hero{
            background:linear-gradient(165deg,#060e0a 0%,#0f1f17 30%,#152e20 60%,#1a3b28 100%);
            color:white;text-align:center;padding:70px 24px 60px;position:relative;overflow:hidden;
        }
        .hero::before{
            content:'';position:absolute;top:-30%;left:-20%;width:80%;height:160%;
            background:radial-gradient(ellipse at 30% 40%,rgba(58,122,80,0.25) 0%,transparent 60%);
        }
        .hero::after{
            content:'';position:absolute;bottom:-30%;right:-15%;width:70%;height:140%;
            background:radial-gradient(ellipse at 70% 60%,rgba(212,160,23,0.12) 0%,transparent 60%);
        }
        .hero h1{
            font-size:2.8rem;font-weight:900;margin-bottom:10px;position:relative;z-index:1;
            letter-spacing:-1.5px;line-height:1.2;
        }
        .hero p{opacity:0.78;position:relative;z-index:1;font-size:1.05rem;font-weight:400;max-width:650px;margin:0 auto;line-height:1.5}

        .tab-bar{
            display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:22px 20px 0;
            position:sticky;top:72px;z-index:99;background:rgba(253,248,240,0.9);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        }
        .tab-btn{
            padding:10px 20px;border-radius:26px;border:none;cursor:pointer;font-weight:600;
            font-size:0.82rem;transition:var(--transition);font-family:inherit;
            background:white;color:var(--gray-600);border:1.5px solid var(--gray-200);
            box-shadow:var(--shadow-xs);letter-spacing:-0.2px;
        }
        .tab-btn:hover{border-color:var(--g300);color:var(--g700);transform:translateY(-1px)}
        .tab-btn.active{
            background:var(--g700);color:white;border-color:var(--g700);
            box-shadow:0 4px 16px rgba(30,74,48,0.3);
        }
        .tab-btn.popular{background:var(--gold-pale);color:#6b4c10;border-color:var(--gold);font-weight:700}
        .tab-btn.popular.active{background:linear-gradient(135deg,var(--gold),#c8880a);color:#3d2a00;border-color:var(--gold)}

        .container{max-width:1340px;margin:0 auto;padding:0 24px 70px}
        .section-title{
            font-size:1.5rem;font-weight:800;color:var(--g900);margin:36px 0 18px;
            padding-left:18px;border-left:4px solid var(--gold);letter-spacing:-0.4px;
            display:flex;align-items:center;gap:10px;
        }
        .section-title .count{font-size:0.75rem;background:var(--g100);color:var(--g700);padding:3px 12px;border-radius:14px;font-weight:600}

        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-bottom:32px}
        .card{
            background:white;border-radius:var(--radius);overflow:hidden;
            box-shadow:var(--shadow-sm);transition:var(--transition);display:flex;
            flex-direction:column;position:relative;border:1px solid var(--gray-200);
        }
        .card:hover{
            transform:translateY(-6px);box-shadow:var(--shadow-lg);
            border-color:var(--g300);
        }
        .card-img-wrap{position:relative;overflow:hidden;height:210px;background:linear-gradient(135deg,#eef5ef,#e8f0e8)}
        .card-img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s}
        .card:hover .card-img{transform:scale(1.06)}
        .card-badges{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
        .badge-pop{
            background:linear-gradient(135deg,var(--gold),#e8c840);color:#3d2a00;
            font-size:0.6rem;padding:5px 12px;border-radius:14px;font-weight:700;
            box-shadow:0 2px 8px rgba(212,160,23,0.3);
        }
        .badge-stock{font-size:0.6rem;padding:5px 12px;border-radius:14px;font-weight:700;text-transform:uppercase}
        .badge-stock.instock{background:#c8e6c9;color:#2e7d32}
        .badge-stock.lowstock{background:#fff3e0;color:#e65100}
        .badge-stock.soldout{background:#ffebee;color:#c62828}
        .card-body{padding:18px;flex:1;display:flex;flex-direction:column}
        .card-body h3{font-size:0.95rem;font-weight:700;color:var(--g900);margin-bottom:3px;line-height:1.3}
        .card-mm{font-weight:600;color:var(--g500);font-size:0.8rem;margin-bottom:6px}
        .card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
        .card-tags span{background:var(--g100);color:var(--g700);font-size:0.6rem;padding:3px 9px;border-radius:10px;font-weight:500}
        .card-price{
            font-weight:700;color:#8a5a00;background:var(--gold-pale);
            display:inline-block;padding:7px 16px;border-radius:16px;
            font-size:0.85rem;margin-top:auto;border:1px solid rgba(212,160,23,0.2);
        }
        .card-qty{display:flex;align-items:center;gap:8px;margin-top:10px}
        .card-qty button{
            width:30px;height:30px;border-radius:50%;border:2px solid var(--g300);
            background:white;font-weight:700;cursor:pointer;font-size:0.9rem;
            display:flex;align-items:center;justify-content:center;
            transition:var(--transition);color:var(--g700);
        }
        .card-qty button:hover{background:var(--g100);border-color:var(--g500)}
        .card-qty span{font-weight:600;min-width:22px;text-align:center;font-size:0.85rem}
        .btn-add-cart{
            background:var(--g700);color:white;border:none;padding:10px 0;border-radius:12px;
            font-weight:600;cursor:pointer;font-size:0.82rem;margin-top:10px;width:100%;
            transition:var(--transition);font-family:inherit;letter-spacing:-0.2px;
        }
        .btn-add-cart:hover{background:var(--g900);box-shadow:0 6px 18px rgba(10,26,18,0.3)}
        .btn-add-cart.added{background:linear-gradient(135deg,var(--gold),#c8880a);color:#3d2a00}
        .soldout .card-img-wrap::after{
            content:'SOLD OUT';position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);
            color:white;padding:10px 24px;border-radius:10px;
            font-weight:800;font-size:0.9rem;letter-spacing:1px;
        }
        .soldout .card-img{opacity:0.45}

        .service-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:24px}
        .s-card{
            background:white;border:2px solid var(--gray-200);border-radius:var(--radius);
            padding:22px;text-align:center;cursor:pointer;transition:var(--transition);
        }
        .s-card:hover{border-color:var(--g300);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
        .s-card .s-icon{font-size:2.2rem;margin-bottom:10px}
        .s-card h3{font-size:0.9rem;font-weight:700;color:var(--g900);margin-bottom:4px}
        .s-card .s-price{font-weight:700;color:var(--brown);font-size:0.85rem;margin-bottom:8px}
        .s-card .s-features{font-size:0.7rem;color:var(--gray-600);margin-bottom:10px;line-height:1.5}
        .s-card .btn-add-cart{width:auto;padding:9px 22px;display:inline-block;margin-top:0}

        /* ── CHECKOUT ── */
        .checkout-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
        .checkout-overlay.open{display:flex}
        .checkout-modal{
            background:white;border-radius:var(--radius-lg);width:100%;max-width:880px;
            max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-2xl);
            animation:modalIn 0.45s cubic-bezier(0.2,0.8,0.2,1);
        }
        @keyframes modalIn{from{opacity:0;transform:translateY(40px) scale(0.94)}to{opacity:1;transform:translateY(0) scale(1)}}
        .checkout-header{
            background:linear-gradient(135deg,var(--g900),#143020,var(--g700));
            color:white;padding:28px 32px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;
            display:flex;justify-content:space-between;align-items:center;
        }
        .checkout-header h2{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px}
        .checkout-close{
            background:rgba(255,255,255,0.15);border:none;color:white;
            width:38px;height:38px;border-radius:50%;cursor:pointer;
            font-size:1.3rem;transition:var(--transition);display:flex;align-items:center;justify-content:center;
        }
        .checkout-close:hover{background:rgba(255,255,255,0.25)}
        .checkout-body{padding:32px}
        .checkout-body h3{
            font-size:0.95rem;font-weight:700;color:var(--g900);margin:24px 0 14px;
            padding-bottom:10px;border-bottom:2px solid var(--g100);display:flex;align-items:center;gap:8px;
        }
        .checkout-body h3:first-child{margin-top:0}
        .checkout-body h3 .section-icon{font-size:1.2rem}
        .checkout-item{
            display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray-100);gap:14px;
            transition:var(--transition);
        }
        .checkout-item:hover{background:var(--g50);margin:0 -8px;padding:12px 8px;border-radius:8px}
        .checkout-item-img{
            width:48px;height:48px;border-radius:var(--radius-xs);object-fit:cover;
            flex-shrink:0;background:linear-gradient(135deg,#eef5ef,#e8f0e8);
            border:1px solid var(--gray-200);
        }
        .checkout-item-info{flex:1;min-width:0}
        .checkout-item-name{font-weight:600;font-size:0.9rem;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .checkout-item-meta{font-size:0.75rem;color:var(--gray-600)}
        .checkout-item-price{font-weight:700;color:var(--g900);white-space:nowrap;font-size:0.9rem}

        .township-header{
            display:flex;justify-content:space-between;align-items:center;cursor:pointer;
            user-select:none;padding:10px 0;
        }
        .township-header h3{margin:0;border-bottom:none;padding-bottom:0}
        .township-arrow{font-size:1.2rem;transition:transform 0.3s}
        .township-grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
            gap:10px;margin:12px 0;overflow:hidden;transition:all 0.4s ease;
        }
        .township-grid.collapsed{max-height:0;margin:0;opacity:0}
        .township-card{
            background:white;border:2px solid var(--gray-200);border-radius:var(--radius-sm);
            padding:14px 10px;text-align:center;cursor:pointer;transition:var(--transition);
        }
        .township-card:hover{border-color:var(--gold);background:var(--gold-pale);box-shadow:var(--shadow)}
        .township-card .t-icon{font-size:1.6rem;margin-bottom:5px}
        .township-card strong{display:block;font-size:0.8rem;color:var(--g900)}
        .township-card .t-fee{font-weight:700;color:var(--gold);font-size:0.8rem;margin-top:2px}
        .township-card .t-desc{font-size:0.6rem;color:var(--gray-600)}
        .township-card.selected{
            background:var(--g700);color:white;border-color:var(--g700);
            box-shadow:0 4px 16px rgba(30,74,48,0.3);
        }
        .township-card.selected strong,.township-card.selected .t-fee,.township-card.selected .t-desc{color:white}

        .checkout-summary{
            background:linear-gradient(135deg,var(--g50),#eef5ef);
            border-radius:var(--radius);padding:22px;margin:18px 0;
            border:1px solid var(--g100);
        }
        .checkout-line{display:flex;justify-content:space-between;padding:5px 0;font-size:0.9rem}
        .checkout-line.grand{
            font-size:1.25rem;font-weight:800;border-top:2px solid var(--g300);
            padding-top:14px;margin-top:10px;color:var(--g900);
        }
        .checkout-discount{color:var(--gold);font-weight:600;font-size:0.8rem;text-align:right;margin-top:2px}

        .contact-grid{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
        .contact-card{
            flex:1;min-width:100px;background:white;border:2px solid var(--gray-200);
            border-radius:var(--radius-sm);padding:14px 10px;text-align:center;
            text-decoration:none;color:inherit;transition:var(--transition);
        }
        .contact-card:hover{border-color:var(--g300);box-shadow:var(--shadow);transform:translateY(-2px)}
        .contact-card .cc-icon{font-size:1.6rem;margin-bottom:5px}
        .contact-card strong{display:block;font-size:0.8rem;color:var(--g900)}

        .action-grid{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
        .btn-act{
            padding:13px 18px;border-radius:var(--radius-sm);font-weight:700;text-align:center;
            cursor:pointer;font-size:0.85rem;border:none;font-family:inherit;
            transition:var(--transition);flex:1;min-width:110px;white-space:nowrap;
            letter-spacing:-0.2px;display:flex;align-items:center;justify-content:center;gap:6px;
        }
        .btn-act.primary{background:var(--g700);color:white}
        .btn-act.primary:hover{background:var(--g900);box-shadow:0 6px 18px rgba(10,26,18,0.3)}
        .btn-act.gold{background:linear-gradient(135deg,var(--gold),#c8880a);color:#3d2a00}
        .btn-act.gold:hover{box-shadow:0 6px 18px rgba(212,160,23,0.4)}
        .btn-act.white{background:white;color:var(--g700);border:2px solid var(--g700)}
        .btn-act.white:hover{background:var(--g50);box-shadow:var(--shadow)}
        .btn-act.whatsapp{background:#25D366;color:white}
        .btn-act.whatsapp:hover{background:#1fb855;box-shadow:0 6px 18px rgba(37,211,102,0.4)}

        .back-top{
            position:fixed;bottom:32px;right:32px;width:52px;height:52px;
            background:var(--g700);color:white;border:none;border-radius:50%;
            font-size:1.4rem;cursor:pointer;z-index:150;box-shadow:var(--shadow-lg);
            transition:var(--transition);display:flex;align-items:center;justify-content:center;
            opacity:0;visibility:hidden;transform:translateY(20px);
        }
        .back-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
        .back-top:hover{background:var(--g900);transform:translateY(-5px);box-shadow:var(--shadow-xl)}

        .toast{
            position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
            background:var(--g900);color:white;padding:12px 28px;border-radius:28px;
            z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;
            font-size:0.85rem;box-shadow:var(--shadow-lg);font-weight:500;
        }
        .toast.show{opacity:1}
        .empty-text{text-align:center;color:#aaa;padding:30px;font-size:0.9rem}

        @media(max-width:768px){
            .hero h1{font-size:1.8rem}
            .hero{padding:50px 20px 40px}
            .grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
            .card-img-wrap{height:155px}
            .checkout-modal{border-radius:var(--radius)}
            .checkout-header{border-radius:var(--radius) var(--radius) 0 0;padding:20px 24px}
            .checkout-body{padding:20px}
            .tab-btn{font-size:0.7rem;padding:8px 13px}
            .township-grid{grid-template-columns:repeat(2,1fr)}
            .action-grid .btn-act{min-width:80px;font-size:0.78rem;padding:11px 10px}
            .back-top{bottom:20px;right:20px;width:44px;height:44px}
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand"><span class="logo-icon">🌿</span> ပန်းသတင်း <span>LANDSCAPE</span></div>
    <div class="top-actions">
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="mm">မြန်မာ</button>
        </div>
        <button class="cart-btn" id="btnCartOpen">🛒 <span id="cartLabel">Cart</span><span class="cart-count" id="cartCount">0</span></button>
    </div>
</div>

<header class="hero">
    <h1 data-en="🌿 Plant Shop & Estimator" data-mm="🌿 အပင်ဆိုင်နှင့်ခန့်မှန်းတွက်ချက်မှု">🌿 Plant Shop & Estimator</h1>
    <p data-en="Browse our catalog, add to cart, and get an instant estimate with delivery" data-mm="ကျွန်ုပ်တို့၏စာရင်းကိုကြည့်ရှုပါ၊ ဈေးခြင်းထဲထည့်ပါ၊ ပို့ဆောင်ခနှင့်အတူ ခန့်မှန်းခြေချက်ချင်းရယူပါ">Browse our catalog, add to cart, and get an instant estimate with delivery</p>
</header>

<div class="tab-bar" id="tabBar">
    <button class="tab-btn popular active" data-tab="popular">🔥 Popular</button>
    <button class="tab-btn" data-tab="all">🌿 All Plants</button>
    <button class="tab-btn" data-tab="fruits">🍋 Fruits</button>
    <button class="tab-btn" data-tab="orchids">🌸 Orchids</button>
    <button class="tab-btn" data-tab="pots">🪴 Pots</button>
    <button class="tab-btn" data-tab="shrubs">🌺 Shrubs</button>
    <button class="tab-btn" data-tab="trees">🌳 Trees</button>
    <button class="tab-btn" data-tab="indoor">🏠 Indoor</button>
    <button class="tab-btn" data-tab="perennials">🌸 Perennials</button>

<div class="container" id="contentContainer">
    <p style="text-align:center;color:#999;padding:60px">Loading catalog from Google Sheets...</p>
</div>

<button class="back-top" id="backTop" title="Back to top">↑</button>

<!-- CHECKOUT MODAL -->
<div class="checkout-overlay" id="checkoutOverlay">
    <div class="checkout-modal">
        <div class="checkout-header">
            <h2 data-en="🛒 Your Estimate" data-mm="🛒 သင့်ခန့်မှန်းခြေ">🛒 Your Estimate</h2>
            <button class="checkout-close" id="btnCheckoutClose">×</button>
        </div>
        <div class="checkout-body" id="checkoutBody">
            <p class="empty-text" data-en="Your cart is empty" data-mm="ဈေးခြင်းဗလာဖြစ်နေသည်">Your cart is empty</p>
        </div>
    </div>
</div>

<script>
(function(){
var currentLang='en';
var cart=JSON.parse(localStorage.getItem('ptt_cart')||'[]');
var plantCatalogData=[],serviceCatalogData=[],currentTab='popular';

var PLANTS_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR22WF-9wb_hxPWqloOoUYxRgbcWi46lbDIw65JtHLMtMMETMzChz1pcRieoJR_nBHb210NxJzmOqDT/pub?gid=616508581&single=true&output=csv';
var SERVICES_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR22WF-9wb_hxPWqloOoUYxRgbcWi46lbDIw65JtHLMtMMETMzChz1pcRieoJR_nBHb210NxJzmOqDT/pub?gid=237556812&single=true&output=csv';
 
var townships = [
    {nameEN:"Self Pickup", nameMM:"ကိုယ်တိုင်လာယူ", fee:0, icon:"🚶"},
    {nameEN:"Hlaing", nameMM:"လှိုင်", fee:3000, icon:"🏘️"},
    {nameEN:"Kamayut", nameMM:"ကမာရွတ်", fee:3000, icon:"🏫"},
    {nameEN:"Sanchaung", nameMM:"စမ်းချောင်း", fee:3000, icon:"🏠"},
    {nameEN:"Dagon", nameMM:"ဒဂုံ", fee:4000, icon:"🏢"},
    {nameEN:"Bahan", nameMM:"ဗဟန်း", fee:4000, icon:"🏛️"},
    {nameEN:"Mayangone", nameMM:"မရမ်းကုန်း", fee:5000, icon:"🏡"},
    {nameEN:"Insein", nameMM:"အင်းစိန်", fee:5000, icon:"🏭"},
    {nameEN:"Mingaladon", nameMM:"မင်္ဂလာဒုံ", fee:7000, icon:"✈️"},
    {nameEN:"North Okkalapa", nameMM:"မြောက်ဥက္ကလာပ", fee:6000, icon:"🌳"},
    {nameEN:"South Okkalapa", nameMM:"တောင်ဥက္ကလာပ", fee:6000, icon:"🌇"},
    {nameEN:"Thingangyun", nameMM:"သင်္ဃန်းကျွန်း", fee:5000, icon:"🕌"},
    {nameEN:"Tamwe", nameMM:"တာမွေ", fee:4000, icon:"🏬"},
    {nameEN:"Thanlyin", nameMM:"သန်လျင်", fee:10000, icon:"🌉"}
];

function parseCSV(t){var r=[],c='',q=false;for(var i=0;i<t.length;i++){var ch=t.charAt(i);if(ch=='"')q=!q;else if(ch===','&&!q){r.push(c.trim());c='';}else c+=ch;}r.push(c.trim());return r;}
function fetchCSV(u){return fetch(u).then(r=>r.text()).then(t=>t.trim().split('\n').map(parseCSV));}

function buildCatalog(d){plantCatalogData=[];for(var i=1;i<d.length;i++){var r=d[i];if(r.length<2)continue;plantCatalogData.push({type:r[0]||'Plant',file:r[1],nameEN:r[2]||'',nameMM:r[3]||r[2],catEN:r[4]||'',catMM:r[5]||r[4],priceLow:parseInt((r[6]||'0').replace(/,/g,''))||0,priceHigh:parseInt((r[7]||'0').replace(/,/g,''))||0,status:(r[8]||'instock').toLowerCase(),badge:r[9]||'',badgeClass:r[10]||'',sci:r[11]||'',descEN:r[12]||'',descMM:r[13]||'',tags:(r[14]||'').split('|').map(t=>t.trim()).filter(Boolean)});}renderContent();}
function buildServices(d){serviceCatalogData=[];for(var i=1;i<d.length;i++){var r=d[i];if(r.length<5)continue;serviceCatalogData.push({cat:r[0]||'',nameEN:r[1]||'',nameMM:r[2]||r[1],priceLow:parseInt((r[3]||'0').replace(/,/g,''))||0,priceHigh:parseInt((r[4]||'0').replace(/,/g,''))||0,isRange:(parseInt((r[3]||'0').replace(/,/g,''))||0)!==(parseInt((r[4]||'0').replace(/,/g,''))||0),features:(r[5]||'').split('|').map(f=>f.trim()).filter(Boolean)});}renderContent();}

function getPopular(){return plantCatalogData.filter(p=>p.badge&&/popular|bestseller|trending|premium/i.test(p.badge));}
function getByCat(tab){var m={fruits:'fruit',orchids:'orchid',shrubs:'shrub',trees:'tree',indoor:'indoor',perennials:'perennial',fence:'fence'};if(tab==='pots')return plantCatalogData.filter(p=>p.type==='Pot'||/pot/i.test(p.catEN));var k=m[tab];return k?plantCatalogData.filter(p=>new RegExp(k,'i').test(p.catEN)):plantCatalogData;}

function renderCard(p){
    var dn=currentLang==='mm'?p.nameMM:p.nameEN;
    var price=p.priceLow===p.priceHigh?p.priceLow.toLocaleString()+' Ks':p.priceLow.toLocaleString()+' – '+p.priceHigh.toLocaleString()+' Ks';
    var sold=p.status==='soldout';
    var h='<div class="card'+(sold?' soldout':'')+'">';
    h+='<div class="card-img-wrap"><img class="card-img" src="images/'+p.file+'" alt="'+dn+'" loading="lazy" onerror="this.style.display=\'none\'">';
    h+='<div class="card-badges">';
    if(p.badge&&/popular|bestseller/i.test(p.badge))h+='<span class="badge-pop">🔥 '+p.badge+'</span>';else h+='<span></span>';
    if(p.status!=='instock')h+='<span class="badge-stock '+p.status+'">'+p.status+'</span>';else h+='<span></span>';
    h+='</div></div><div class="card-body"><h3>'+dn+'</h3>';
    if(p.nameMM!==p.nameEN)h+='<div class="card-mm">'+p.nameMM+'</div>';
    if(p.tags.length)h+='<div class="card-tags">'+p.tags.map(t=>'<span>'+t+'</span>').join('')+'</div>';
    h+='<span class="card-price">'+price+'</span>';
    if(!sold){
        h+='<div class="card-qty"><button class="qty-minus">−</button><span class="qty-num">1</span><button class="qty-plus">+</button></div>';
        h+='<button class="btn-add-cart" data-file="'+p.file+'" data-en="'+p.nameEN+'" data-mm="'+p.nameMM+'" data-lo="'+p.priceLow+'" data-hi="'+p.priceHigh+'">🛒 '+(currentLang==='mm'?'ထည့်မည်':'Add to Cart')+'</button>';
    }
    h+='</div></div>';return h;
}

function renderContent(){
    var items;var html='';
    if(currentTab==='popular'){items=getPopular();if(items.length)html+='<h2 class="section-title">🔥 '+(currentLang==='mm'?'လူကြိုက်များသော':'Popular Picks')+'<span class="count">'+items.length+'</span></h2>';}
    else if(currentTab==='all')items=plantCatalogData;
    else if(currentTab==='services'){renderServices();return;}
    else items=getByCat(currentTab);
    if(currentTab==='all'||currentTab==='popular'){html+='<div class="grid">'+items.map(renderCard).join('')+'</div>';}
    else{var g={};items.forEach(p=>{var c=currentLang==='mm'?p.catMM:p.catEN;if(!g[c])g[c]=[];g[c].push(p);});for(var c in g){html+='<h2 class="section-title">'+c+'<span class="count">'+g[c].length+'</span></h2><div class="grid">'+g[c].map(renderCard).join('')+'</div>';}}
    document.getElementById('contentContainer').innerHTML=html||'<p class="empty-text">No items found</p>';
    bindButtons();window.scrollTo({top:0,behavior:'smooth'});
}

function renderServices(){
    var g={};serviceCatalogData.forEach(s=>{var c=s.cat||'Other';if(!g[c])g[c]=[];g[c].push(s);});
    var h='<h2 class="section-title">🛠️ '+(currentLang==='mm'?'ဝန်ဆောင်မှုများ':'Services')+'</h2>';
    for(var c in g){h+='<h3 style="margin:20px 0 10px;color:var(--g900);font-weight:700">'+c+'</h3><div class="service-grid">';
        g[c].forEach(s=>{var n=currentLang==='mm'?s.nameMM:s.nameEN;var p=s.isRange?s.priceLow.toLocaleString()+' – '+s.priceHigh.toLocaleString()+' Ks':s.priceLow.toLocaleString()+' Ks';
            h+='<div class="s-card"><div class="s-icon">🛠️</div><h3>'+n+'</h3><div class="s-price">'+p+'</div>';
            if(s.features.length)h+='<div class="s-features">'+s.features.map(f=>'🌿 '+f).join('<br>')+'</div>';
            h+='<button class="btn-add-cart" data-svc="'+s.nameEN+'" data-mm="'+s.nameMM+'" data-price="'+Math.round((s.priceLow+s.priceHigh)/2)+'">'+(currentLang==='mm'?'+ ထည့်မည်':'+ Add to Cart')+'</button></div>';});
        h+='</div>';}
    document.getElementById('contentContainer').innerHTML=h;bindButtons();window.scrollTo({top:0,behavior:'smooth'});
}

function bindButtons(){
    document.querySelectorAll('.qty-minus').forEach(b=>b.addEventListener('click',function(e){e.preventDefault();var n=this.parentElement.querySelector('.qty-num');var v=parseInt(n.textContent)||1;if(v>1)n.textContent=v-1;}));
    document.querySelectorAll('.qty-plus').forEach(b=>b.addEventListener('click',function(e){e.preventDefault();var n=this.parentElement.querySelector('.qty-num');var v=parseInt(n.textContent)||1;if(v<99)n.textContent=v+1;}));
    document.querySelectorAll('.btn-add-cart[data-file]').forEach(b=>b.addEventListener('click',function(){
        var f=this.dataset.file,en=this.dataset.en,mm=this.dataset.mm,lo=parseInt(this.dataset.lo),hi=parseInt(this.dataset.hi);
        var qty=parseInt(this.parentElement.querySelector('.qty-num').textContent)||1;
        var unit=Math.round((lo+hi)/2);
        var ex=cart.find(c=>c.file===f);if(ex)ex.qty+=qty;else cart.push({file:f,nameEN:en,nameMM:mm,unitPrice:unit,qty:qty,size:'medium',isPlant:true});
        saveCart();updateCartBadge();showToast(currentLang==='mm'?'✅ ထည့်ပြီးပါပြီ':'✅ Added!');
        this.classList.add('added');this.textContent='✅';var self=this;
        setTimeout(()=>{self.classList.remove('added');self.textContent='🛒 '+(currentLang==='mm'?'ထည့်မည်':'Add to Cart');},1200);
        this.parentElement.querySelector('.qty-num').textContent='1';
    }));
    document.querySelectorAll('.btn-add-cart[data-svc]').forEach(b=>b.addEventListener('click',function(){
        var n=this.dataset.svc,mm=this.dataset.mm||n,pr=parseInt(this.dataset.price);
        var ex=cart.find(c=>c.service===n);if(ex)ex.qty++;else cart.push({service:n,nameEN:n,nameMM:mm,unitPrice:pr,qty:1,isService:true});
        saveCart();updateCartBadge();showToast(currentLang==='mm'?'✅ ထည့်ပြီးပါပြီ':'✅ Added!');
    }));
}

function saveCart(){localStorage.setItem('ptt_cart',JSON.stringify(cart));}
function updateCartBadge(){
    var count=cart.reduce((s,i)=>s+(i.qty||1),0);
    var ce=document.getElementById('cartCount'),le=document.getElementById('cartLabel');
    ce.style.display=count?'flex':'none';ce.textContent=count;
    le.textContent=(currentLang==='mm'?'ဈေးခြင်း':'Cart')+(count?' ('+count+')':'');
}

function openCheckout(){
    if(!cart.length){showToast(currentLang==='mm'?'ဈေးခြင်းဗလာဖြစ်နေသည်':'Cart is empty');return;}
    var plantItems=cart.filter(c=>c.isPlant);
    var serviceItems=cart.filter(c=>c.isService);
    var subtotal=cart.reduce((s,i)=>s+(i.unitPrice||0)*(i.qty||1),0);
    var deliveryFee=0, selectedTownship=townships[0];

    var html='';
    // Plant section
    if(plantItems.length){
        html+='<h3><span class="section-icon">🌱</span> '+(currentLang==='mm'?'အပင်များ':'Plants')+'</h3>';
        plantItems.forEach(item=>{
            var name=currentLang==='mm'?(item.nameMM||item.nameEN):(item.nameEN);
            var lt=(item.unitPrice||0)*(item.qty||1);
            var imgSrc=item.file?'images/'+item.file:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"%3E%3Crect fill="%23e8f5e9" width="48" height="48"/%3E%3Ctext x="50%25" y="55%25" text-anchor="middle" fill="%232d5a3f" font-size="16"%3E🌱%3C/text%3E%3C/svg%3E';
            html+='<div class="checkout-item"><img class="checkout-item-img" src="'+imgSrc+'" alt="" onerror="this.style.display=\'none\'"><div class="checkout-item-info"><div class="checkout-item-name">'+name+'</div><div class="checkout-item-meta">Qty: '+item.qty+' | '+item.unitPrice.toLocaleString()+' Ks</div></div><div class="checkout-item-price">'+lt.toLocaleString()+' Ks</div></div>';
        });
    }
    // Service section
    if(serviceItems.length){
        html+='<h3><span class="section-icon">🛠️</span> '+(currentLang==='mm'?'ဝန်ဆောင်မှုများ':'Services')+'</h3>';
        serviceItems.forEach(item=>{
            var name=currentLang==='mm'?(item.nameMM||item.service):(item.service||item.nameEN);
            var lt=(item.unitPrice||0)*(item.qty||1);
            html+='<div class="checkout-item"><img class="checkout-item-img" src="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 48 48\'%3E%3Crect fill=\'%23fff8e1\' width=\'48\' height=\'48\'/%3E%3Ctext x=\'50%25\' y=\'55%25\' text-anchor=\'middle\' fill=\'%238B4513\' font-size=\'16\'%3E🛠️%3C/text%3E%3C/svg%3E" alt=""><div class="checkout-item-info"><div class="checkout-item-name">'+name+'</div><div class="checkout-item-meta">Qty: '+item.qty+' | '+item.unitPrice.toLocaleString()+' Ks</div></div><div class="checkout-item-price">'+lt.toLocaleString()+' Ks</div></div>';
        });
    }

    html+='<div class="township-header" id="townshipHeader"><h3><span class="section-icon">📍</span> '+(currentLang==='mm'?'ပို့ဆောင်မည့်မြို့နယ်':'Delivery Township')+'</h3><span class="township-arrow">▼</span></div>';
    html+='<div class="township-grid" id="townshipGrid">';
    townships.forEach((t,i)=>{
        html+='<div class="township-card'+(i===0?' selected':'')+'" data-index="'+i+'" data-fee="'+t.fee+'"><div class="t-icon">'+t.icon+'</div><strong>'+(currentLang==='mm'?t.nameMM:t.nameEN)+'</strong><div class="t-fee">'+(t.fee===0?(currentLang==='mm'?'အခမဲ့':'Free'):t.fee.toLocaleString()+' Ks')+'</div><div class="t-desc">'+(currentLang==='mm'?'ပို့ဆောင်ခ':'Delivery fee')+'</div></div>';
    });
    html+='</div>';

    html+='<div class="checkout-summary" id="chkSummary"><div class="checkout-line"><span>'+(currentLang==='mm'?'စုစုပေါင်း':'Subtotal')+'</span><span>'+subtotal.toLocaleString()+' Ks</span></div><div class="checkout-line"><span>'+(currentLang==='mm'?'ပို့ဆောင်ခ':'Delivery')+'</span><span id="chkDeliveryFee">0 Ks</span></div><div class="checkout-discount" id="chkDiscount"></div><div class="checkout-line grand"><span>💰 '+(currentLang==='mm'?'စုစုပေါင်း':'Grand Total')+'</span><span id="chkGrand">'+subtotal.toLocaleString()+' Ks</span></div></div>';

    html+='<h3><span class="section-icon">📞</span> '+(currentLang==='mm'?'ဆက်သွယ်ရန်':'Contact')+'</h3>';
   html+='<div class="contact-grid">';
html+='<a href="tel:+959123456789" class="contact-card"><div class="cc-icon">📞</div><strong>'+(currentLang==='mm'?'ဖုန်း':'Call')+'</strong></a>';
html+='<a href="https://m.me/yourpage" target="_blank" class="contact-card"><div class="cc-icon">💬</div><strong>Messenger</strong></a>';
html+='
    html+='<button class="btn-act white" id="btnClearCart">🗑 '+(currentLang==='mm'?'ဖျက်မည်':'Clear Cart')+'</button>';</div>';

    html+='<div class="action-grid">';
    html+='<button class="btn-act primary" id="btnEmailEst">📧 '+(currentLang==='mm'?'အီးမေးလ်':'Email')+'</button>';
    html+='<button class="btn-act whatsapp" id="btnWA">📱 WhatsApp</button>';
    html+='<button class="btn-act white" id="btnGenerateCard">📸 '+(currentLang==='mm'?'ကဒ်ထုတ်မည်':'Card')+'</button>';
    html+='<button class="btn-act white" id="btnPrint">🖨 '+(currentLang==='mm'?'ပရင့်':'Print')+'</button>';
    html+='<button class="btn-act white" id="btnCopyText">📋 '+(currentLang==='mm'?'ကူးယူ':'Copy')+'</button>';
    html+='</div>';

    document.getElementById('checkoutBody').innerHTML=html;

    var townshipGrid=document.getElementById('townshipGrid');
    var arrow=document.querySelector('.township-arrow');
    document.getElementById('townshipHeader').addEventListener('click',function(){
        townshipGrid.classList.toggle('collapsed');
        arrow.textContent=townshipGrid.classList.contains('collapsed')?'▶':'▼';
    });

    var updateSummary=function(){
        var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da;
        document.getElementById('chkDeliveryFee').textContent=deliveryFee?deliveryFee.toLocaleString()+' Ks':(currentLang==='mm'?'အခမဲ့':'Free');
        document.getElementById('chkDiscount').textContent=disc?(currentLang==='mm'?'🎉 '+disc*100+'% လျှော့စျေး (-'+da.toLocaleString()+' Ks)':'🎉 '+disc*100+'% discount (-'+da.toLocaleString()+' Ks)'):'';
        document.getElementById('chkGrand').textContent=gt.toLocaleString()+' Ks';
    };
    document.querySelectorAll('.township-card').forEach(card=>{
        card.addEventListener('click',function(){
            document.querySelectorAll('.township-card').forEach(c=>c.classList.remove('selected'));
            this.classList.add('selected');
            deliveryFee=parseInt(this.dataset.fee);
            selectedTownship=townships[parseInt(this.dataset.index)];
            updateSummary();
        });
    });
    document.getElementById('btnClearCart').addEventListener('click',function(){
    if(confirm(currentLang==='mm'?'ဖျက်မှာသေချာလား။':'Clear all items?')){
        cart=[];
        saveCart();
        updateCartBadge();
        document.getElementById('checkoutOverlay').classList.remove('open');
    }
});

    // Generate Card with 2 sections
    document.getElementById('btnGenerateCard').addEventListener('click',function(){
        var plantItems=cart.filter(c=>c.isPlant);
        var serviceItems=cart.filter(c=>c.isService);
        var cardDiv=document.createElement('div');
        cardDiv.style.cssText='position:fixed;top:0;left:0;width:420px;background:white;padding:28px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.4);z-index:9999;font-family:Inter,sans-serif';

        var itemsHtml='';
        // Plants section
        if(plantItems.length){
            itemsHtml+='<div style="margin-bottom:16px"><div style="font-weight:700;color:#1e4a30;font-size:0.9rem;border-bottom:1px solid #e0f0e4;padding-bottom:6px;margin-bottom:8px">🌱 '+(currentLang==='mm'?'အပင်များ':'Plants')+'</div>';
            plantItems.forEach(i=>{var n=currentLang==='mm'?(i.nameMM||i.nameEN):(i.nameEN);itemsHtml+='<div style="display:flex;justify-content:space-between;font-size:0.82rem;padding:3px 0"><span>'+n+' ×'+i.qty+'</span><span>'+(i.unitPrice*i.qty).toLocaleString()+' Ks</span></div>';});
            itemsHtml+='</div>';
        }
        // Services section
        if(serviceItems.length){
            itemsHtml+='<div style="margin-bottom:16px"><div style="font-weight:700;color:#7a3e10;font-size:0.9rem;border-bottom:1px solid #fff8e0;padding-bottom:6px;margin-bottom:8px">🛠️ '+(currentLang==='mm'?'ဝန်ဆောင်မှုများ':'Services')+'</div>';
            serviceItems.forEach(i=>{var n=currentLang==='mm'?(i.nameMM||i.service):(i.service||i.nameEN);itemsHtml+='<div style="display:flex;justify-content:space-between;font-size:0.82rem;padding:3px 0"><span>'+n+' ×'+i.qty+'</span><span>'+(i.unitPrice*i.qty).toLocaleString()+' Ks</span></div>';});
            itemsHtml+='</div>';
        }

        var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da;
        cardDiv.innerHTML='<div style="text-align:center;margin-bottom:16px"><div style="font-weight:900;font-size:1.3rem;color:#0a1a12">🌿 ပန်းသတင်း LANDSCAPE</div><div style="font-weight:700;color:#2d5a3f;font-size:0.85rem">Estimate / ခန့်မှန်းခြေ</div></div><div style="border-top:2px dashed #c0d8c8;border-bottom:2px dashed #c0d8c8;padding:16px 0;margin-bottom:14px">'+itemsHtml+'</div><div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:2px 0"><span>Subtotal</span><span>'+subtotal.toLocaleString()+' Ks</span></div><div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:2px 0"><span>Delivery ('+(currentLang==='mm'?selectedTownship.nameMM:selectedTownship.nameEN)+')</span><span>'+(deliveryFee?deliveryFee.toLocaleString()+' Ks':'Free')+'</span></div>'+(disc?'<div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:2px 0;color:#c8880a"><span>Discount</span><span>-'+da.toLocaleString()+' Ks</span></div>':'')+'</div><div style="background:#f2f8f4;border-radius:12px;padding:14px;text-align:center"><div style="font-size:0.8rem;color:#6b7280;margin-bottom:4px">💰 '+(currentLang==='mm'?'စုစုပေါင်း':'GRAND TOTAL')+'</div><div style="font-weight:900;font-size:1.4rem;color:#0a1a12">'+gt.toLocaleString()+' Ks</div></div><div style="font-size:0.7rem;color:#a0a8a0;text-align:center;margin-top:14px">📞 09-123-456-789 | pttlandscapeservices@gmail.com</div>';
        document.body.appendChild(cardDiv);
        html2canvas(cardDiv,{backgroundColor:'white',scale:2}).then(canvas=>{
            document.body.removeChild(cardDiv);
            var a=document.createElement('a');
            a.download='estimate-'+new Date().toISOString().slice(0,10)+'.png';
            a.href=canvas.toDataURL('image/png');
            a.click();
            showToast('📸 Card downloaded!');
        }).catch(()=>{document.body.removeChild(cardDiv);showToast('⚠️ Failed');});
    });

    document.getElementById('btnEmailEst').addEventListener('click',function(){
        var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da;
        var t=buildCartText(deliveryFee,disc,da,gt,selectedTownship);
        window.location.href='mailto:pttlandscapeservices@gmail.com?subject='+encodeURIComponent('Landscape Estimate')+'&body='+encodeURIComponent(t);
    });
    document.getElementById('btnWA').addEventListener('click',function(){
        var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da;
        window.open('https://wa.me/959123456789?text='+encodeURIComponent(buildCartText(deliveryFee,disc,da,gt,selectedTownship)));
    });
    document.getElementById('btnPrint').addEventListener('click',()=>window.print());
    document.getElementById('btnCopyText').addEventListener('click',function(){
        var tot=subtotal+deliveryFee,disc=tot>500000?0.10:tot>200000?0.05:0,da=Math.round(tot*disc),gt=tot-da;
        navigator.clipboard.writeText(buildCartText(deliveryFee,disc,da,gt,selectedTownship)).then(()=>showToast('📋 Copied!'));
    });

    document.getElementById('checkoutOverlay').classList.add('open');
}

function buildCartText(deliveryFee,disc,da,gt,township){
    var plantItems=cart.filter(c=>c.isPlant);
    var serviceItems=cart.filter(c=>c.isService);
    var t='🌿 ပန်းသတင်း LANDSCAPE ESTIMATE\n'+'='.repeat(35)+'\n\n';
    if(plantItems.length){t+='🌱 '+(currentLang==='mm'?'အပင်များ':'PLANTS')+':\n';plantItems.forEach(i=>{var n=currentLang==='mm'?(i.nameMM||i.nameEN):(i.nameEN);t+='  • '+n+' ×'+i.qty+' = '+(i.unitPrice*i.qty).toLocaleString()+' Ks\n';});t+='\n';}
    if(serviceItems.length){t+='🛠️ '+(currentLang==='mm'?'ဝန်ဆောင်မှုများ':'SERVICES')+':\n';serviceItems.forEach(i=>{var n=currentLang==='mm'?(i.nameMM||i.service):(i.service||i.nameEN);t+='  • '+n+' ×'+i.qty+' = '+(i.unitPrice*i.qty).toLocaleString()+' Ks\n';});t+='\n';}
    t+='Subtotal: '+cart.reduce((s,i)=>s+(i.unitPrice||0)*(i.qty||1),0).toLocaleString()+' Ks';
    t+='\nDelivery ('+(currentLang==='mm'?township.nameMM:township.nameEN)+'): '+(deliveryFee?deliveryFee.toLocaleString()+' Ks':'Free');
    if(disc)t+='\nDiscount: -'+da.toLocaleString()+' Ks';
    t+='\n💰 GRAND TOTAL: '+gt.toLocaleString()+' Ks';
    t+='\n\n📞 09-123-456-789 | pttlandscapeservices@gmail.com';
    return t;
}

document.getElementById('btnCartOpen').addEventListener('click',openCheckout);
document.getElementById('btnCheckoutClose').addEventListener('click',function(){document.getElementById('checkoutOverlay').classList.remove('open');});
document.getElementById('checkoutOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});

document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');currentTab=this.dataset.tab;renderContent();}));

var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){backTop.classList.toggle('visible',window.scrollY>500);});
backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

function setLang(lang){currentLang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.querySelectorAll('[data-en][data-mm]').forEach(el=>{var t=el.dataset[lang];if(!t)return;if(el.tagName==='OPTION')el.textContent=t;else el.childNodes.forEach(n=>{if(n.nodeType===3)n.textContent=t;});});renderContent();updateCartBadge();}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',function(){setLang(this.dataset.lang);}));

function showToast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),100);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2500);}

Promise.all([fetchCSV(PLANTS_CSV_URL),fetchCSV(SERVICES_CSV_URL)]).then(([p,s])=>{buildCatalog(p);buildServices(s);updateCartBadge();}).catch(()=>{document.getElementById('contentContainer').innerHTML='<p style="text-align:center;color:red;padding:50px">⚠️ Could not load from Google Sheets.</p>';});
})();
</script>
</body>
</html>
