<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ပန်းအိုးဆိုင် POS | Dual Pricing</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pot Shop">

  <script>
    const m={name:"ပန်းအိုးဆိုင် POS",short_name:"Pot Shop",start_url:"./",display:"standalone",background_color:"#FAF7F2",theme_color:"#8D6E63",icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%238D6E63'/%3E%3Ctext x='256' y='360' font-size='300' text-anchor='middle' fill='white' font-family='sans-serif'%3E🏺%3C/text%3E%3C/svg%3E",sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
    const b=new Blob([JSON.stringify(m)],{type:'application/json'});

  </script>
 <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <style>
    :root{--clay:#8D6E63;--clay-dark:#5D4037;--terracotta:#E2725B;--cream:#FAF7F2;--card:#FFF;--text:#3E2723;--text-light:#6D4C41;--border:#D7CCC8;--shadow:0 2px 12px rgba(62,39,35,0.08);--radius:14px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI','Noto Sans Myanmar',sans-serif;background:var(--cream);color:var(--text);line-height:1.5}
    .app{max-width:1200px;margin:0 auto;padding:.8rem}
    .header{background:linear-gradient(135deg,var(--clay-dark),var(--clay));color:#fff;border-radius:var(--radius);padding:1rem 1.5rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;box-shadow:0 4px 16px rgba(93,64,55,.3)}
    .header .brand{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:.5rem}
    .header .brand span{font-size:2rem}
    .header .stats{display:flex;gap:1.5rem;flex-wrap:wrap}
    .header .stats .s-item{text-align:center}
    .header .stats .s-val{font-weight:800;font-size:1.2rem}
    .header .stats .s-lbl{font-size:.7rem;opacity:.9}
    .nav{display:flex;gap:.3rem;background:var(--card);border-radius:var(--radius);padding:.3rem;margin-bottom:1rem;box-shadow:var(--shadow);overflow-x:auto}
    .nav-btn{padding:.6rem 1.2rem;border-radius:20px;border:none;background:0 0;font-weight:600;cursor:pointer;white-space:nowrap;font-size:.85rem;color:var(--text-light);transition:all .2s}
    .nav-btn.active{background:var(--clay);color:#fff}
    .main-grid{display:grid;grid-template-columns:1fr 380px;gap:1rem}
    @media(max-width:900px){.main-grid{grid-template-columns:1fr}}
    .card{background:var(--card);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow);border:1px solid var(--border)}
    .card-header{font-weight:700;font-size:1rem;margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem;max-height:55vh;overflow-y:auto}
    .product-card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:.8rem;cursor:pointer;transition:all .2s;text-align:center;position:relative}
    .product-card:hover{border-color:var(--clay);transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
    .product-card img{width:100%;height:100px;object-fit:cover;border-radius:8px;background:#F5F0EB;margin-bottom:.4rem}
    .product-card .name{font-weight:700;font-size:.9rem}
    .product-card .info{font-size:.7rem;color:var(--text-light)}
    .product-card .prices{margin-top:.3rem}
    .product-card .price-retail{font-weight:700;color:var(--terracotta);font-size:.9rem}
    .product-card .price-wholesale{font-weight:600;color:var(--clay-dark);font-size:.75rem}
    .product-card .badge{position:absolute;top:8px;right:8px;padding:.2rem .5rem;border-radius:10px;font-size:.6rem;font-weight:700}
    .badge-low{background:#FFEBEE;color:#C62828}.badge-out{background:#FFF3E0;color:#E65100}.badge-ok{background:#E8F5E9;color:#2E7D32}
    .cart-item{display:flex;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--border);align-items:center}
    .cart-item img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#F5F0EB}
    .cart-item .info{flex:1}.cart-item .info .name{font-weight:600;font-size:.85rem}
    .cart-item .info .detail{font-size:.7rem;color:var(--text-light)}
    .qty-control{display:flex;align-items:center;gap:.3rem}
    .qty-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
    .qty-btn:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
    .btn{padding:.6rem 1.4rem;border-radius:24px;border:none;font-weight:700;cursor:pointer;font-size:.85rem;transition:.2s;text-align:center}
    .btn-primary{background:var(--clay);color:#fff}.btn-primary:hover{background:var(--clay-dark)}
    .btn-accent{background:var(--terracotta);color:#fff}.btn-accent:hover{background:#D84315}
    .btn-outline{background:#fff;border:1.5px solid var(--clay);color:var(--clay)}
    .btn-sm{padding:.3rem .8rem;font-size:.7rem}.btn-block{width:100%}.btn-danger{background:#C62828;color:#fff}
    input,select,textarea{width:100%;padding:.6rem;border:1.5px solid var(--border);border-radius:10px;font-size:.85rem;background:#FEFDFB;font-family:inherit;transition:.2s}
    input:focus,select:focus{border-color:var(--clay);outline:0;box-shadow:0 0 0 3px rgba(141,110,99,.1)}
    label{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--text-light);display:block;margin-bottom:.2rem}
    .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1rem}
    .dash-card{background:var(--card);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);text-align:center}
    .dash-card .icon{font-size:2rem}.dash-card .value{font-size:1.5rem;font-weight:800;color:var(--clay-dark)}
    .dash-card .label{font-size:.7rem;color:var(--text-light);text-transform:uppercase}
    .dash-card.warn{border-left:4px solid var(--terracotta)}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:200}
    .modal.active{display:flex}
    .modal-content{background:#fff;border-radius:var(--radius);padding:1.5rem;width:90%;max-width:520px;max-height:85vh;overflow-y:auto}
    .receipt{background:#FFFEF9;border:2px solid var(--clay);border-radius:8px;padding:1.5rem;font-size:.8rem}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--clay-dark);color:#fff;padding:.7rem 1.8rem;border-radius:30px;z-index:300;opacity:0;transition:.3s;pointer-events:none;font-weight:600}
    .toast.show{opacity:1}
    .hidden{display:none!important}.text-center{text-align:center}.mt-1{margin-top:.5rem}.mb-1{margin-bottom:.5rem}
    .flex-between{display:flex;justify-content:space-between;align-items:center}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th{background:#EFEBE9;padding:.5rem;text-align:left;font-weight:700}
    td{padding:.4rem .5rem;border-bottom:1px solid var(--border)}
    .sale-type-toggle{display:flex;gap:.5rem;margin-bottom:.8rem}
    .sale-type-btn{flex:1;padding:.5rem;border-radius:20px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:.8rem;text-align:center;transition:.2s}
    .sale-type-btn.active{background:var(--clay);color:#fff;border-color:var(--clay)}
    .sale-type-btn.wholesale.active{background:var(--clay-dark)}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><span>🏺</span> ပန်းအိုးဆိုင်</div>
    <div class="stats">
      <div class="s-item"><div class="s-val" id="hdrRevenue">0</div><div class="s-lbl">ယနေ့ရောင်းရငွေ</div></div>
      <div class="s-item"><div class="s-val" id="hdrProfit">0</div><div class="s-lbl">ယနေ့အမြတ်</div></div>
      <div class="s-item"><div class="s-val" id="hdrStock">0</div><div class="s-lbl">စတော့တန်ဖိုး</div></div>
      <div class="s-item"><div class="s-val" id="hdrItems">0</div><div class="s-lbl">ပစ္စည်းမျိုး</div></div>
    </div>
  </header>

  <nav class="nav" id="mainNav">
    <button class="nav-btn active" data-view="sell">🛒 ရောင်းမယ်</button>
    <button class="nav-btn" data-view="inventory">📋 အိုးစာရင်း</button>
    <button class="nav-btn" data-view="stockin">📥 ဝယ်ယူ</button>
    <button class="nav-btn" data-view="dashboard">📊 Dashboard</button>
  </nav>

  <!-- SELL -->
  <div id="viewSell" class="main-grid">
    <div>
      <div class="card">
        <div class="card-header"><span>ပန်းအိုးများ</span>
          <div style="display:flex;gap:.5rem;"><input type="text" id="potSearch" placeholder="🔍 ရှာရန်..." style="max-width:200px;"><button class="btn btn-outline btn-sm" onclick="scanBarcode()">📷</button></div>
        </div>
        <div style="display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem;" id="categoryFilters"></div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>
    <div>
      <div class="card" style="position:sticky;top:.8rem;">
        <div class="card-header">🛒 ဈေးခြင်း <button class="btn-sm btn-outline" onclick="clearCart()">ရှင်း</button></div>
        <div class="sale-type-toggle" id="saleTypeToggle">
          <button class="sale-type-btn active" onclick="setSaleType('retail',this)">လက်လီ (Retail)</button>
          <button class="sale-type-btn wholesale" onclick="setSaleType('wholesale',this)">လက်ကား (Wholesale)</button>
        </div>
        <div id="cartItems" style="max-height:30vh;overflow-y:auto;margin-bottom:.8rem;"><p style="color:var(--text-light);text-align:center;">ပစ္စည်းမထည့်ရသေး</p></div>
        <div class="flex-between" style="font-weight:700;font-size:1.1rem;margin-bottom:.8rem;"><span>စုစုပေါင်း</span><span id="cartTotal" style="color:var(--terracotta);">0 ကျပ်</span></div>
        <input type="text" id="customerName" placeholder="ဝယ်သူအမည်" class="mb-1">
        <input type="text" id="customerPhone" placeholder="ဖုန်းနံပါတ် (optional)" class="mb-1">
        <button class="btn btn-accent btn-block" onclick="checkout()">💳 ရောင်းမယ်</button>
      </div>
    </div>
  </div>

  <!-- INVENTORY -->
  <div id="viewInventory" class="hidden">
    <div class="card"><div class="card-header"><span>ပန်းအိုးစာရင်း</span><button class="btn btn-primary btn-sm" onclick="openPotForm()">+ အိုးအသစ်</button></div><div id="inventoryTable" style="overflow-x:auto;"></div></div>
  </div>

  <!-- STOCK IN -->
  <div id="viewStockin" class="hidden">
    <div class="card" style="max-width:500px;"><h3 class="mb-1">ပစ္စည်းအသစ်ဝယ်ယူ</h3>
      <label>အိုးရွေးပါ</label><select id="stockinPot" class="mb-1"></select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;"><div><label>အရေအတွက်</label><input type="number" id="stockinQty" value="1" min="1"></div><div><label>ဝယ်စျေး (တစ်လုံး)</label><input type="number" id="stockinCost"></div></div>
      <label>ပေးသွင်းသူ</label><input type="text" id="stockinSupplier" placeholder="ဆိုင်အမည်" class="mb-1">
      <button class="btn btn-accent btn-block" onclick="recordStockIn()">📥 ဝယ်ယူမှတ်တမ်းတင်</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="viewDashboard" class="hidden">
    <div class="dash-grid" id="dashStats"></div>
    <div class="card"><div class="card-header"><span>လစဉ်အစီရင်ခံစာ</span>
      <div style="display:flex;gap:.5rem;"><select id="reportMonth"><option value="1">ဇန်</option><option value="2">ဖေ</option><option value="3">မတ်</option><option value="4">ဧပြီ</option><option value="5">မေ</option><option value="6">ဇွန်</option><option value="7">ဇူ</option><option value="8">ဩ</option><option value="9">စက်</option><option value="10">အောက်</option><option value="11">နို</option><option value="12">ဒီ</option></select>
      <input type="number" id="reportYear" value="2025" style="width:80px;"><button class="btn btn-primary btn-sm" onclick="loadReport()">ကြည့်</button></div>
    </div><div id="reportContent"></div></div>
    <div class="card mt-1"><h3>စတော့နည်းနေသောပစ္စည်းများ</h3><div id="lowStockList"></div></div>
  </div>
</div>

<!-- POT MODAL -->
<div class="modal" id="potModal"><div class="modal-content">
  <h3 id="potModalTitle">အိုးအသစ်</h3>
  <div style="display:grid;gap:.5rem;">
    <div><label>အိုးအမည် *</label><input type="text" id="pName" placeholder="ဥပမာ - မြေအိုးအကြီး"></div>
    <div><label>အမျိုးအစား</label><select id="pCategory"><option>မြေအိုး</option><option>စဉ့်အိုး</option><option>ပလပ်စတစ်</option><option>ဘိလပ်မြေ</option><option>သစ်သား</option><option>အခြား</option></select></div>
    <div><label>အရွယ်အစား</label><input type="text" id="pSize" placeholder="ဥပမာ - ၁၂လက်မ"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;"><div><label>ဝယ်စျေး</label><input type="number" id="pCost"></div><div><label>လက်လီစျေး</label><input type="number" id="pRetail"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;"><div><label>လက်ကားစျေး</label><input type="number" id="pWholesale"></div><div><label>လက်ကျန်</label><input type="number" id="pQty"></div></div>
    <div><label>အနည်းဆုံး</label><input type="number" id="pMin" value="5"></div>
    <div><label>ပုံ URL</label><input type="text" id="pImage" placeholder="https://..."></div>
    <input type="hidden" id="pEditId">
  </div>
  <div style="display:flex;gap:.5rem;margin-top:1rem;"><button class="btn btn-primary" onclick="savePot()" style="flex:1;">သိမ်းမယ်</button><button class="btn btn-outline" onclick="closeModal('potModal')" style="flex:1;">မလုပ်တော့</button></div>
</div></div>

<!-- RECEIPT MODAL -->
<div class="modal" id="receiptModal"><div class="modal-content" id="receiptContent"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx1Dv_k6LdFY_SmakWnVaD5H17lZXfLxB86VyFmGiCXfd2Q7WB1tZecGyRCHzKK9Tsl/exec';
let inventory=[],cart=[],activeCategory='all',saleType='retail';

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500)}
function closeModal(id){$('#'+id).classList.remove('active')}

async function apiCall(action,params={},method='GET'){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);
  let url=API;const opts={method,signal:ctrl.signal,headers:method==='POST'?{'Content-Type':'application/json'}:{}};
  if(method==='GET'){url+='?action='+encodeURIComponent(action);if(Object.keys(params).length)url+='&'+new URLSearchParams(params)}
  else opts.body=JSON.stringify({action,...params});
  try{const r=await fetch(url,opts);clearTimeout(timer);if(!r.ok)throw new Error('Status '+r.status);return await r.json()}
  catch(e){clearTimeout(timer);console.error(e);return null}
}

async function loadInventory(){const d=await apiCall('getInventory');if(d)inventory=d}
async function refreshAll(){await loadInventory();renderProducts();renderInvTable();renderCats();updateStockinSel();updateHeader()}

async function updateHeader(){const d=await apiCall('getDashboard');if(!d)return;$('#hdrRevenue').textContent=(d.todayRevenue||0).toLocaleString('my-MM')+' ကျပ်';$('#hdrProfit').textContent=(d.todayProfit||0).toLocaleString('my-MM')+' ကျပ်';$('#hdrStock').textContent=(d.totalStockValue||0).toLocaleString('my-MM')+' ကျပ်';$('#hdrItems').textContent=d.totalItems||inventory.length}

function renderCats(){const c=['all',...new Set(inventory.map(i=>i.category).filter(Boolean))];$('#categoryFilters').innerHTML=c.map(c=>`<button class="btn-sm ${c===activeCategory?'btn-primary':'btn-outline'}" onclick="filterCat('${c}')">${c==='all'?'အားလုံး':c}</button>`).join('')}
function filterCat(c){activeCategory=c;renderCats();renderProducts()}

function getBadge(i){if(i.quantity<=0)return{cls:'badge-out',text:'ကုန်'};if(i.quantity<=i.minStock)return{cls:'badge-low',text:'နည်း'};return{cls:'badge-ok',text:'ရှိ'}}

function renderProducts(){
  const s=($('#potSearch')?.value||'').toLowerCase();
  let f=inventory.filter(i=>i.name.toLowerCase().includes(s));
  if(activeCategory!=='all')f=f.filter(i=>i.category===activeCategory);
  const g=$('#productGrid');
  if(!f.length){g.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:2rem;">အိုးမရှိပါ</p>';return}
  g.innerHTML=f.map(i=>{const b=getBadge(i);return`<div class="product-card" onclick="addToCart('${i.id}')"><div class="badge ${b.cls}">${b.text}</div><img src="${i.imageUrl||'https://placehold.co/200x150/F5F0EB/8D6E63?text=🏺'}" alt="${i.name}" loading="lazy" onerror="this.src='https://placehold.co/200x150/F5F0EB/8D6E63?text=🏺'"><div class="name">${i.name}</div><div class="info">${i.category||''} | လက်ကျန်: ${i.quantity}</div><div class="prices"><div class="price-retail">လက်လီ: ${(i.retailPrice||0).toLocaleString('my-MM')} ကျပ်</div><div class="price-wholesale">လက်ကား: ${(i.wholesalePrice||0).toLocaleString('my-MM')} ကျပ်</div></div></div>`}).join('')
}

function setSaleType(type,btn){saleType=type;$$('.sale-type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCart()}

function addToCart(id){const i=inventory.find(p=>p.id===id);if(!i||i.quantity<1)return toast('စတော့မရှိပါ');const e=cart.find(c=>c.id===id);if(e){if(e.qty>=i.quantity)return toast('စတော့မလုံလောက်ပါ');e.qty++}else cart.push({...i,qty:1});renderCart()}
function removeFromCart(id){cart=cart.filter(c=>c.id!==id);renderCart()}
function changeQty(id,d){const c=cart.find(c=>c.id===id);if(!c)return;const i=inventory.find(p=>p.id===id);const n=c.qty+d;if(n<1)return removeFromCart(id);if(n>i.quantity)return toast('စတော့မလုံလောက်ပါ');c.qty=n;renderCart()}
function clearCart(){cart=[];renderCart()}

function getItemPrice(item){return saleType==='wholesale'?Number(item.wholesalePrice||item.retailPrice||0):Number(item.retailPrice||0)}

function renderCart(){
  const c=$('#cartItems');
  if(!cart.length){c.innerHTML='<p style="color:var(--text-light);text-align:center;padding:1rem;">ပစ္စည်းမထည့်ရသေး</p>'}
  else c.innerHTML=cart.map(i=>{const p=getItemPrice(i);return`<div class="cart-item"><img src="${i.imageUrl||'https://placehold.co/44/F5F0EB/8D6E63?text=🏺'}" alt="${i.name}" onerror="this.style.display='none'"><div class="info"><div class="name">${i.name}</div><div class="detail">${p.toLocaleString('my-MM')} × ${i.qty} = ${(p*i.qty).toLocaleString('my-MM')} ကျပ် (${saleType==='wholesale'?'လက်ကား':'လက်လီ'})</div></div><div class="qty-control"><button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button><span>${i.qty}</span><button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button><button class="qty-btn" onclick="removeFromCart('${i.id}')" style="color:red;">✕</button></div></div>`}).join('')
  const t=cart.reduce((s,i)=>s+getItemPrice(i)*i.qty,0);
  $('#cartTotal').textContent=t.toLocaleString('my-MM')+' ကျပ်'
}

async function checkout(){
  if(!cart.length)return toast('ပစ္စည်းထည့်ပါ');
  const cust=$('#customerName').value.trim()||'Walk-in',ph=$('#customerPhone').value.trim(),date=new Date().toISOString().split('T')[0],snap=[...cart];
  for(const c of snap){const p=getItemPrice(c);await apiCall('addSale',{sale:{id:Date.now().toString(36)+Math.random().toString(36).substr(2,5),itemId:c.id,itemName:c.name,quantity:c.qty,unitPrice:p,customer:`${cust}${ph?' | '+ph:''}`,date,saleType}},'POST')}
  showReceipt(snap,cust,ph,date);cart=[];renderCart();await refreshAll();toast('✅ ရောင်းပြီး')
}

function showReceipt(snap,cust,ph,date){
  const t=snap.reduce((s,i)=>s+getItemPrice(i)*i.qty,0);
  $('#receiptContent').innerHTML=`<div class="receipt"><h2 style="text-align:center;">🏺 ပန်းအိုးဆိုင်</h2><p style="text-align:center;">ဖုန်း: 09-000000000</p><p><small>ရက်စွဲ: ${date} | ဝယ်သူ: ${cust}${ph?' | '+ph:''}</small></p><p><small>အမျိုးအစား: ${saleType==='wholesale'?'လက်ကား':'လက်လီ'}</small></p><hr><table><tr><th>အိုး</th><th>အရေအတွက်</th><th>စျေး</th><th>စုစုပေါင်း</th></tr>${snap.map(c=>`<tr><td>${c.name}</td><td>${c.qty}</td><td>${getItemPrice(c).toLocaleString('my-MM')}</td><td>${(getItemPrice(c)*c.qty).toLocaleString('my-MM')}</td></tr>`).join('')}</table><hr><p style="text-align:right;font-size:1.2rem;font-weight:bold;">စုစုပေါင်း: ${t.toLocaleString('my-MM')} ကျပ်</p><p style="text-align:center;color:var(--clay);">🏺 ကျေးဇူးတင်ပါတယ်</p></div><button class="btn btn-accent btn-block mt-1" onclick="printReceipt()">🖨️ ပရင့်ထုတ်</button><button class="btn btn-outline btn-block mt-1" onclick="closeModal('receiptModal')">ပိတ်</button>`;
  $('#receiptModal').classList.add('active')
}
function printReceipt(){html2canvas($('#receiptContent .receipt')).then(c=>{const w=window.open('');w.document.write(`<img src="${c.toDataURL()}" onload="window.print();">`)})}

function renderInvTable(){
  const c=$('#inventoryTable');
  if(!inventory.length){c.innerHTML='<p>မရှိသေး</p>';return}
  c.innerHTML=`<table><thead><tr><th>ပုံ</th><th>အမည်</th><th>အမျိုးအစား</th><th>ဝယ်စျေး</th><th>လက်လီ</th><th>လက်ကား</th><th>လက်ကျန်</th><th></th></tr></thead><tbody>${inventory.map(i=>`<tr><td><img src="${i.imageUrl||''}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'" loading="lazy"></td><td>${i.name}</td><td>${i.category||'-'}</td><td>${(i.costPrice||0).toLocaleString('my-MM')}</td><td>${(i.retailPrice||0).toLocaleString('my-MM')}</td><td>${(i.wholesalePrice||0).toLocaleString('my-MM')}</td><td style="color:${i.quantity<=i.minStock?'#C62828':'inherit'};">${i.quantity}</td><td><button class="btn-sm btn-outline" onclick="editPot('${i.id}')">ပြင်</button> <button class="btn-sm btn-danger" onclick="deletePot('${i.id}')">ဖျက်</button></td></tr>`).join('')}</tbody></table>`
}

function openPotForm(){$('#potModalTitle').textContent='အိုးအသစ်';$('#pEditId').value='';['pName','pSize','pCost','pRetail','pWholesale','pQty','pMin','pImage'].forEach(id=>$('#'+id).value='');$('#pCategory').value='မြေအိုး';$('#potModal').classList.add('active')}
function editPot(id){const p=inventory.find(i=>i.id===id);if(!p)return;$('#pEditId').value=p.id;$('#potModalTitle').textContent='ပြင်ဆင်ရန်';$('#pName').value=p.name;$('#pCategory').value=p.category||'မြေအိုး';$('#pSize').value=p.description||'';$('#pCost').value=p.costPrice;$('#pRetail').value=p.retailPrice;$('#pWholesale').value=p.wholesalePrice;$('#pQty').value=p.quantity;$('#pMin').value=p.minStock;$('#pImage').value=p.imageUrl||'';$('#potModal').classList.add('active')}
async function savePot(){const id=$('#pEditId').value;const pot={id:id||(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)),name:$('#pName').value.trim(),category:$('#pCategory').value,description:$('#pSize').value.trim(),costPrice:+$('#pCost').value,retailPrice:+$('#pRetail').value,wholesalePrice:+$('#pWholesale').value,quantity:+$('#pQty').value,minStock:+$('#pMin').value,imageUrl:$('#pImage').value.trim()};if(!pot.name)return toast('အမည်ထည့်ပါ');const act=id?'updateInventoryItem':'addInventoryItem';await apiCall(act,{item:pot},'POST');closeModal('potModal');await refreshAll();toast('သိမ်းပြီး')}
async function deletePot(id){if(!confirm('ဖျက်မှာလား'))return;await apiCall('deleteInventoryItem',{id},'POST');await refreshAll()}

function updateStockinSel(){$('#stockinPot').innerHTML=inventory.map(i=>`<option value="${i.id}">${i.name} (လက်ကျန် ${i.quantity})</option>`).join('')}
async function recordStockIn(){const id=$('#stockinPot').value,q=+$('#stockinQty').value,c=+$('#stockinCost').value;if(!q||q<1)return toast('အရေအတွက်ထည့်ပါ');if(!c)return toast('ဝယ်စျေးထည့်ပါ');const i=inventory.find(p=>p.id===id);if(!i)return;await apiCall('addPurchase',{purchase:{id:Date.now().toString(36),date:new Date().toISOString().split('T')[0],itemId:id,itemName:i.name,quantity:q,unitCost:c,supplier:$('#stockinSupplier').value.trim()}},'POST');toast('ဝယ်ယူပြီး');await refreshAll();$('#stockinQty').value=1;$('#stockinCost').value='';$('#stockinSupplier').value=''}

async function loadDashboard(){const d=await apiCall('getDashboard');if(!d)return;$('#dashStats').innerHTML=`<div class="dash-card"><div class="icon">💰</div><div class="value">${(d.todayRevenue||0).toLocaleString('my-MM')}</div><div class="label">ယနေ့ရောင်းရငွေ</div></div><div class="dash-card"><div class="icon">📈</div><div class="value">${(d.todayProfit||0).toLocaleString('my-MM')}</div><div class="label">ယနေ့အမြတ်</div></div><div class="dash-card"><div class="icon">📦</div><div class="value">${(d.totalStockValue||0).toLocaleString('my-MM')}</div><div class="label">စတော့တန်ဖိုး</div></div><div class="dash-card"><div class="icon">🏺</div><div class="value">${d.totalItems}</div><div class="label">အိုးအမျိုး</div></div><div class="dash-card warn"><div class="icon">⚠️</div><div class="value">${d.lowStockItems?.length||0}</div><div class="label">စတော့နည်း</div></div>`;const l=$('#lowStockList');l.innerHTML=d.lowStockItems?.length?d.lowStockItems.map(i=>`<p>⚠️ ${i.name} — ${i.quantity} လုံး (အနည်းဆုံး ${i.minStock})</p>`).join(''):'<p>အားလုံးလုံလောက်ပါသည်</p>'}
async function loadReport(){const m=+$('#reportMonth').value,y=+$('#reportYear').value;const s=await apiCall('getMonthlySummary',{year:y,month:m});if(!s)return;$('#reportContent').innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;"><div class="card text-center"><div style="color:var(--text-light);">အရောင်း</div><div style="font-size:1.8rem;font-weight:800;color:var(--clay-dark);">${s.totalSales.toLocaleString('my-MM')}</div></div><div class="card text-center"><div style="color:var(--text-light);">အဝယ်</div><div style="font-size:1.8rem;font-weight:800;color:#E65100;">${s.totalPurchases.toLocaleString('my-MM')}</div></div><div class="card text-center"><div style="color:var(--text-light);">အမြတ်</div><div style="font-size:1.8rem;font-weight:800;color:#2E7D32;">${s.netProfit.toLocaleString('my-MM')}</div></div></div>`}

let cr=null;
async function scanBarcode(){if(!cr)cr=new ZXing.BrowserMultiFormatReader();try{const r=await cr.decodeFromVideoDevice(null,document.createElement('video'));if(r?.text){const i=inventory.find(p=>p.id===r.text);if(!i)return toast('မတွေ့ပါ');addToCart(i.id)}}catch(e){toast('စကင်ဖတ်၍မရပါ')}finally{try{cr.reset()}catch(e){}}}

function switchView(v){$$('#mainNav ~ div[id^="view"]').forEach(e=>e.classList.add('hidden'));$(`#view${v.charAt(0).toUpperCase()+v.slice(1)}`).classList.remove('hidden');$$('.nav-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.nav-btn[data-view="${v}"]`)?.classList.add('active');if(v==='sell')renderProducts();else if(v==='inventory')renderInvTable();else if(v==='stockin')updateStockinSel();else if(v==='dashboard')loadDashboard()}

document.addEventListener('DOMContentLoaded',()=>{$$('.nav-btn').forEach(b=>b.addEventListener('click',function(){switchView(this.dataset.view)}));$('#potSearch').addEventListener('input',debounce(renderProducts,200));$$('.modal').forEach(m=>m.addEventListener('click',function(e){if(e.target===this)closeModal(this.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.modal.active').forEach(m=>closeModal(m.id))})});
function debounce(fn,ms=250){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

(async function(){await loadInventory();renderProducts();renderInvTable();renderCats();updateStockinSel();updateHeader();$('#reportYear').value=new Date().getFullYear();$('#reportMonth').value=new Date().getMonth()+1})();
</script>
</body>
</html>
