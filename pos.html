<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ပန်းအိုးဆိုင် POS | Pot Shop Pro</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pot Shop POS">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%238D6E63'/%3E%3Ctext x='256' y='360' font-size='300' text-anchor='middle' fill='white' font-family='sans-serif'%3E🏺%3C/text%3E%3C/svg%3E">

  <script>
    const manifest = {
      name: "ပန်းအိုးဆိုင် POS",
      short_name: "Pot Shop",
      start_url: ".",
      display: "standalone",
      background_color: "#faf7f2",
      theme_color: "#8D6E63",
      icons: [{
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%238D6E63'/%3E%3Ctext x='256' y='360' font-size='300' text-anchor='middle' fill='white' font-family='sans-serif'%3E🏺%3C/text%3E%3C/svg%3E",
        sizes: "512x512", type: "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)],{type:'application/json'});
    document.head.insertAdjacentHTML('beforeend',`<link rel="manifest" href="${URL.createObjectURL(blob)}">`);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js" crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" defer></script>

  <style>
    :root {
      --clay: #8D6E63; --clay-light: #BCAAA4; --clay-dark: #5D4037;
      --terracotta: #E2725B; --sand: #F5DEB3; --cream: #FAF7F2;
      --text: #3E2723; --text-light: #6D4C41; --border: #D7CCC8;
      --card: #FFFFFF; --bg: #FAF7F2;
      --shadow: 0 2px 12px rgba(62,39,35,0.08);
      --radius: 14px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', 'Noto Sans Myanmar', system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    .app { max-width: 1200px; margin: 0 auto; padding: 0.8rem; }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--clay-dark), var(--clay));
      color: white; border-radius: var(--radius); padding: 1rem 1.5rem;
      margin-bottom: 1rem; box-shadow: 0 4px 16px rgba(93,64,55,0.3);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem;
    }
    .header .brand { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    .header .brand span { font-size: 2rem; }
    .header .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .header .stats .stat-item { text-align: center; }
    .header .stats .stat-val { font-weight: 800; font-size: 1.2rem; }
    .header .stats .stat-lbl { font-size: 0.7rem; opacity: 0.9; }

    /* Navigation */
    .nav {
      display: flex; gap: 0.3rem; background: var(--card); border-radius: var(--radius);
      padding: 0.3rem; margin-bottom: 1rem; box-shadow: var(--shadow); overflow-x: auto;
    }
    .nav-btn {
      padding: 0.6rem 1.2rem; border-radius: 20px; border: none; background: transparent;
      font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 0.85rem;
      color: var(--text-light); transition: all 0.2s;
    }
    .nav-btn.active { background: var(--clay); color: white; }
    .nav-btn:hover:not(.active) { background: #EFEBE9; }

    /* Main Layout */
    .main-grid { display: grid; grid-template-columns: 1fr 370px; gap: 1rem; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    /* Cards */
    .card {
      background: var(--card); border-radius: var(--radius); padding: 1.2rem;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .card-header {
      font-weight: 700; font-size: 1rem; margin-bottom: 0.8rem;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* Product Grid */
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.8rem; max-height: 55vh; overflow-y: auto;
    }
    .product-card {
      background: white; border-radius: var(--radius); border: 1px solid var(--border);
      padding: 0.8rem; cursor: pointer; transition: all 0.2s; text-align: center;
      position: relative;
    }
    .product-card:hover { border-color: var(--clay); transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
    .product-card img {
      width: 100%; height: 110px; object-fit: cover; border-radius: 8px;
      background: #F5F0EB; margin-bottom: 0.4rem;
    }
    .product-card .name { font-weight: 700; font-size: 0.9rem; }
    .product-card .info { font-size: 0.7rem; color: var(--text-light); }
    .product-card .price { font-weight: 700; color: var(--terracotta); font-size: 1rem; margin-top: 0.2rem; }
    .product-card .badge {
      position: absolute; top: 8px; right: 8px;
      padding: 0.2rem 0.5rem; border-radius: 10px; font-size: 0.6rem; font-weight: 700;
    }
    .badge-low { background: #FFEBEE; color: #C62828; }
    .badge-out { background: #FFF3E0; color: #E65100; }
    .badge-ok { background: #E8F5E9; color: #2E7D32; }

    /* Cart */
    .cart-item {
      display: flex; gap: 0.6rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .cart-item img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #F5F0EB; }
    .cart-item .info { flex: 1; }
    .cart-item .info .name { font-weight: 600; font-size: 0.85rem; }
    .cart-item .info .detail { font-size: 0.7rem; color: var(--text-light); }
    .qty-control { display: flex; align-items: center; gap: 0.3rem; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
      background: white; cursor: pointer; font-size: 1rem; display: flex;
      align-items: center; justify-content: center; transition: 0.2s;
    }
    .qty-btn:hover { background: var(--clay); color: white; border-color: var(--clay); }

    /* Buttons */
    .btn {
      padding: 0.6rem 1.4rem; border-radius: 24px; border: none; font-weight: 700;
      cursor: pointer; font-size: 0.85rem; transition: 0.2s; text-align: center;
    }
    .btn-primary { background: var(--clay); color: white; }
    .btn-primary:hover { background: var(--clay-dark); }
    .btn-accent { background: var(--terracotta); color: white; }
    .btn-accent:hover { background: #D84315; }
    .btn-outline { background: white; border: 1.5px solid var(--clay); color: var(--clay); }
    .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.7rem; }
    .btn-block { width: 100%; }
    .btn-danger { background: #C62828; color: white; }

    /* Inputs */
    input, select, textarea {
      width: 100%; padding: 0.6rem; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 0.85rem; background: #FEFDFB;
      font-family: inherit; transition: 0.2s;
    }
    input:focus, select:focus { border-color: var(--clay); outline: none; box-shadow: 0 0 0 3px rgba(141,110,99,0.1); }
    label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); display: block; margin-bottom: 0.2rem; }

    /* Dashboard Stats */
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-bottom: 1rem; }
    .dash-card {
      background: var(--card); border-radius: var(--radius); padding: 1rem;
      box-shadow: var(--shadow); text-align: center;
    }
    .dash-card .icon { font-size: 2rem; }
    .dash-card .value { font-size: 1.5rem; font-weight: 800; color: var(--clay-dark); }
    .dash-card .label { font-size: 0.7rem; color: var(--text-light); text-transform: uppercase; }
    .dash-card.warn { border-left: 4px solid var(--terracotta); }

    /* Modal */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center; z-index: 200;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white; border-radius: var(--radius); padding: 1.5rem;
      width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto;
    }

    /* Receipt */
    .receipt {
      background: #FFFEF9; border: 2px solid var(--clay); border-radius: 8px;
      padding: 1.5rem; font-size: 0.8rem;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--clay-dark); color: white; padding: 0.7rem 1.8rem;
      border-radius: 30px; z-index: 300; opacity: 0; transition: 0.3s;
      pointer-events: none; font-weight: 600;
    }
    .toast.show { opacity: 1; }

    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-1 { margin-top: 0.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #EFEBE9; padding: 0.5rem; text-align: left; font-weight: 700; }
    td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
<div class="app">
  
  <!-- HEADER -->
  <header class="header">
    <div class="brand"><span>🏺</span> ပန်းအိုးဆိုင်</div>
    <div class="stats">
      <div class="stat-item"><div class="stat-val" id="hdrRevenue">0</div><div class="stat-lbl">ယနေ့ရောင်းရငွေ</div></div>
      <div class="stat-item"><div class="stat-val" id="hdrProfit">0</div><div class="stat-lbl">ယနေ့အမြတ်</div></div>
      <div class="stat-item"><div class="stat-val" id="hdrStockVal">0</div><div class="stat-lbl">စတော့တန်ဖိုး</div></div>
      <div class="stat-item"><div class="stat-val" id="hdrItems">0</div><div class="stat-lbl">ပစ္စည်းမျိုးစုံ</div></div>

  <!-- NAVIGATION -->

    <button class="nav-btn" data-view="inventory">📋 အိုးစာရင်း</button>
    <button class="nav-btn" data-view="stockin">📥 ပစ္စည်းဝယ်ယူ</button>
    <button class="nav-btn" data-view="dashboard">📊 Dashboard</button>
  </nav>

  <!-- SELL VIEW -->
  <div id="viewSell" class="main-grid">
    <div>
      <div class="card">
        <div class="card-header">
          <span>ပန်းအိုးများ</span>
          <div style="display:flex; gap:0.5rem;">
            <input type="text" id="potSearch" placeholder="🔍 ရှာရန်..." style="max-width:200px;">
            <button class="btn btn-outline btn-sm" onclick="scanBarcode()">📷</button>

    <div>

        <div class="card-header">🛒 ဈေးခြင်း <button class="btn-sm btn-outline" onclick="clearCart()">ရှင်းမယ်</button></div>
        <div id="cartItems" style="max-height:35vh; overflow-y:auto; margin-bottom:0.8rem;">

  <!-- INVENTORY VIEW -->

<!-- RECEIPT MODAL -->
<div class="modal" id="receiptModal">
  <div class="modal-content" id="receiptContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════ CONFIG ═══════════════
const API = 'https://script.google.com/macros/s/AKfycbyGL39Lw5StXYo3uRPD1AWviJnYp1krTATBp9k1TO_Klr7dyQpphfc9XafRoKWrhZ0B/exec'; // ← Replace with your Apps Script Web App URL

// ═══════════════ STATE ═══════════════
let inventory = [];
let cart = [];
let activeCategory = 'all';

// ═══════════════ HELPERS ═══════════════
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2500);
}
function closeModal(id) { $('#'+id).classList.remove('active'); }

async function apiCall(action, params = {}, method = 'GET') {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  let url = API + '?action=' + action;
  if (method === 'GET' && Object.keys(params).length) url += '&' + new URLSearchParams(params);
  try {
    const res = await fetch(url, {
      method, signal: ctrl.signal,
      headers: method === 'POST' ? { 'Content-Type': 'application/json' } : {},
      body: method === 'POST' ? JSON.stringify({ action, ...params }) : undefined
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('Status ' + res.status);
    return await res.json();
  } catch (e) { clearTimeout(timer); console.error(e); return null; }
}

// ═══════════════ DATA ═══════════════
async function loadInventory() {
  const data = await apiCall('getInventory');
  if (data) inventory = data;
}

async function refreshAll() {
  await loadInventory();
  renderProducts();
  renderInventoryTable();
  renderCategories();
  updateStockinSelect();
  updateHeaderStats();
  if (!document.getElementById('viewDashboard').classList.contains('hidden')) loadDashboard();
}

// ═══════════════ HEADER STATS ═══════════════
async function updateHeaderStats() {
  const dash = await apiCall('getDashboard');
  if (!dash) return;
  $('#hdrRevenue').textContent = dash.todayRevenue.toLocaleString('my-MM') + ' ကျပ်';
  $('#hdrProfit').textContent = dash.todayProfit.toLocaleString('my-MM') + ' ကျပ်';
  $('#hdrStockVal').textContent = dash.totalStockValue.toLocaleString('my-MM') + ' ကျပ်';
  $('#hdrItems').textContent = dash.totalItems || inventory.length;
}

// ═══════════════ CATEGORIES ═══════════════
function renderCategories() {
  const cats = ['all', ...new Set(inventory.map(p => p.category).filter(Boolean))];
  $('#categoryFilters').innerHTML = cats.map(c => 
    `<button class="btn-sm ${c === activeCategory ? 'btn-primary' : 'btn-outline'}" onclick="filterCategory('${c}')">${c === 'all' ? 'အားလုံး' : c}</button>`
  ).join('');
}

function filterCategory(cat) { activeCategory = cat; renderCategories(); renderProducts(); }

// ═══════════════ PRODUCT GRID ═══════════════
function getBadge(item) {
  if (item.quantity <= 0) return { cls: 'badge-out', text: 'ကုန်' };
  if (item.quantity <= item.minStock) return { cls: 'badge-low', text: 'နည်း' };
  return { cls: 'badge-ok', text: 'ရှိ' };
}

function renderProducts() {
  const search = ($('#potSearch')?.value || '').toLowerCase();
  let filtered = inventory.filter(p => p.name.toLowerCase().includes(search));
  if (activeCategory !== 'all') filtered = filtered.filter(p => p.category === activeCategory);

  const grid = $('#productGrid');
  if (!filtered.length) {
    grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-light); padding:2rem;">အိုးမရှိပါ</p>';
    return;
  }
  grid.innerHTML = filtered.map(p => {
    const badge = getBadge(p);
    return `
    <div class="product-card" onclick="addToCart('${p.id}')">
      <div class="badge ${badge.cls}">${badge.text}</div>
      <img src="${p.imageUrl || 'https://placehold.co/200x150/F5F0EB/8D6E63?text=🏺'}" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/200x150/F5F0EB/8D6E63?text=🏺'">
      <div class="name">${p.name}</div>
      <div class="info">${p.category || ''}${p.description ? ' | '+p.description : ''}</div>
      <div class="info">လက်ကျန်: ${p.quantity} လုံး</div>
      <div class="price">${Number(p.sellingPrice).toLocaleString('my-MM')} ကျပ်</div>
    </div>`;
  }).join('');
}

// ═══════════════ CART ═══════════════
function addToCart(id) {
  const item = inventory.find(p => p.id === id);
  if (!item || item.quantity < 1) return toast('စတော့မရှိပါ');
  const existing = cart.find(c => c.id === id);
  if (existing) {
    if (existing.qty >= item.quantity) return toast('စတော့မလုံလောက်ပါ');
    existing.qty++;
  } else {
    cart.push({ ...item, qty: 1 });
  }
  renderCart();
}

function removeFromCart(id) { cart = cart.filter(c => c.id !== id); renderCart(); }
function changeCartQty(id, delta) {
  const c = cart.find(c => c.id === id); if (!c) return;
  const item = inventory.find(p => p.id === id);
  const newQty = c.qty + delta;
  if (newQty < 1) return removeFromCart(id);
  if (newQty > item.quantity) return toast('စတော့မလုံလောက်ပါ');
  c.qty = newQty;
  renderCart();
}
function clearCart() { cart = []; renderCart(); }

function renderCart() {
  const container = $('#cartItems');
  if (!cart.length) {
    container.innerHTML = '<p style="color:var(--text-light); text-align:center; padding:1rem;">ပစ္စည်းမထည့်ရသေး</p>';
  } else {
    container.innerHTML = cart.map(c => `
      <div class="cart-item">
        <img src="${c.imageUrl || 'https://placehold.co/44/F5F0EB/8D6E63?text=🏺'}" alt="${c.name}" onerror="this.style.display='none'">
        <div class="info">
          <div class="name">${c.name}</div>
          <div class="detail">${Number(c.sellingPrice).toLocaleString('my-MM')} × ${c.qty} = ${(c.qty*c.sellingPrice).toLocaleString('my-MM')} ကျပ်</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeCartQty('${c.id}',-1)">−</button>
          <span>${c.qty}</span>
          <button class="qty-btn" onclick="changeCartQty('${c.id}',1)">+</button>
          <button class="qty-btn" onclick="removeFromCart('${c.id}')" style="color:red;">✕</button>
        </div>
      </div>
    `).join('');
  }
  const total = cart.reduce((s, c) => s + c.qty * c.sellingPrice, 0);
  $('#cartTotal').textContent = total.toLocaleString('my-MM') + ' ကျပ်';
}

// ═══════════════ CHECKOUT ═══════════════
async function checkout() {
  if (!cart.length) return toast('ပစ္စည်းထည့်ပါ');
  const customer = $('#customerName').value.trim() || 'Walk-in Customer';
  const phone = $('#customerPhone').value.trim();
  const note = $('#saleNote').value.trim();
  const date = new Date().toISOString().split('T')[0];
  const snapshot = [...cart];
  for (const c of snapshot) {
    await apiCall('addSale', { sale: {
      id: Date.now().toString(36)+Math.random().toString(36).substr(2,5),
      itemId: c.id, itemName: c.name, quantity: c.qty,
      unitPrice: c.sellingPrice, customer: `${customer}${phone?' | '+phone:''}`, date
    }}, 'POST');
  }
  showReceipt(snapshot, customer, phone, note, date);
  cart = []; renderCart();
  await refreshAll();
  toast('✅ ရောင်းပြီး');
}

function showReceipt(snapshot, customer, phone, note, date) {
  const total = snapshot.reduce((s, c) => s + c.qty * c.sellingPrice, 0);
  $('#receiptContent').innerHTML = `
    <div class="receipt">
      <h2 style="text-align:center;">🏺 ပန်းအိုးဆိုင်</h2>
      <p style="text-align:center;">ဖုန်း: 09-000000000</p>
      <p><small>ရက်စွဲ: ${date} | ဝယ်သူ: ${customer} ${phone?'| '+phone:''}</small></p>
      ${note ? `<p><small>မှတ်စု: ${note}</small></p>` : ''}
      <hr>
      <table><tr><th>အိုးအမျိုးအစား</th><th>အရေအတွက်</th><th>စျေး</th><th>စုစုပေါင်း</th></tr>
      ${snapshot.map(c => `<tr><td>${c.name}</td><td>${c.qty}</td><td>${c.sellingPrice}</td><td>${(c.qty*c.sellingPrice).toLocaleString('my-MM')}</td></tr>`).join('')}</table>
      <hr>
      <p style="text-align:right; font-size:1.2rem; font-weight:bold;">စုစုပေါင်း: ${total.toLocaleString('my-MM')} ကျပ်</p>
      <p style="text-align:center; color:var(--clay);">🏺 ကျေးဇူးတင်ပါတယ် — ပန်းအိုးဆိုင်</p>
    </div>
    <button class="btn btn-accent btn-block mt-1" onclick="printReceipt()">🖨️ ပရင့်ထုတ်မယ်</button>
    <button class="btn btn-outline btn-block mt-1" onclick="closeModal('receiptModal')">ပိတ်မယ်</button>
  `;
  $('#receiptModal').classList.add('active');
}

function printReceipt() {
  html2canvas($('#receiptContent .receipt')).then(c => {
    const w = window.open(''); w.document.write(`<img src="${c.toDataURL()}" onload="window.print();">`);
  });
}

// ═══════════════ INVENTORY TABLE ═══════════════
function renderInventoryTable() {
  const container = $('#inventoryTable');
  if (!inventory.length) { container.innerHTML = '<p>အိုးမရှိသေး</p>'; return; }
  container.innerHTML = `
    <table>
      <thead><tr><th>ပုံ</th><th>အမည်</th><th>အမျိုးအစား</th><th>အရွယ်</th><th>ဝယ်စျေး</th><th>ရောင်းစျေး</th><th>လက်ကျန်</th><th></th></tr></thead>
      <tbody>${inventory.map(p => `<tr>
        <td><img src="${p.imageUrl||''}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'" loading="lazy"></td>
        <td>${p.name}</td><td>${p.category||'-'}</td><td>${p.description||'-'}</td>
        <td>${Number(p.costPrice).toLocaleString('my-MM')}</td><td>${Number(p.sellingPrice).toLocaleString('my-MM')}</td>
        <td style="color:${p.quantity<=p.minStock?'#C62828':'inherit'}; font-weight:${p.quantity<=p.minStock?'700':'400'};">${p.quantity}</td>
        <td><button class="btn-sm btn-outline" onclick="editPot('${p.id}')">ပြင်</button> <button class="btn-sm btn-danger" onclick="deletePot('${p.id}')">ဖျက်</button></td>
      </tr>`).join('')}</tbody></table>`;
}

function openPotForm() {
  $('#potModalTitle').textContent = 'အိုးအသစ်ထည့်ရန်';
  $('#pEditId').value = '';
  ['pName','pSize','pCost','pPrice','pQty','pMin','pImage','pNote'].forEach(id => $('#'+id).value = '');
  $('#pCategory').value = 'မြေအိုး';
  $('#potModal').classList.add('active');
}

function editPot(id) {
  const p = inventory.find(p => p.id === id); if (!p) return;
  $('#pEditId').value = p.id;
  $('#potModalTitle').textContent = 'အိုးပြင်ဆင်ရန်';
  $('#pName').value = p.name; $('#pCategory').value = p.category || 'မြေအိုး';
  $('#pSize').value = p.description || '';
  $('#pCost').value = p.costPrice; $('#pPrice').value = p.sellingPrice;
  $('#pQty').value = p.quantity; $('#pMin').value = p.minStock || 5;
  $('#pImage').value = p.imageUrl || ''; $('#pNote').value = '';
  $('#potModal').classList.add('active');
}

async function savePot() {
  const id = $('#pEditId').value;
  const pot = {
    id: id || (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)),
    name: $('#pName').value.trim(),
    category: $('#pCategory').value,
    description: $('#pSize').value.trim(),
    costPrice: +$('#pCost').value,
    sellingPrice: +$('#pPrice').value,
    quantity: +$('#pQty').value,
    minStock: +$('#pMin').value,
    imageUrl: $('#pImage').value.trim()
  };
  if (!pot.name) return toast('အိုးအမည်ထည့်ပါ');
  const act = id ? 'updateInventoryItem' : 'addInventoryItem';
  await apiCall(act, { item: pot }, 'POST');
  closeModal('potModal');
  await refreshAll();
  toast('သိမ်းပြီး');
}

async function deletePot(id) {
  if (!confirm('ဖျက်မှာသေချာလား')) return;
  await apiCall('deleteInventoryItem', { id }, 'POST');
  await refreshAll();
}

// ═══════════════ STOCK IN ═══════════════
function updateStockinSelect() {
  $('#stockinPot').innerHTML = inventory.map(p => `<option value="${p.id}">${p.name} (လက်ကျန် ${p.quantity})</option>`).join('');
}

async function recordStockIn() {
  const itemId = $('#stockinPot').value;
  const qty = +$('#stockinQty').value;
  const cost = +$('#stockinCost').value;
  if (!qty || qty < 1) return toast('အရေအတွက်ထည့်ပါ');
  if (!cost) return toast('ဝယ်စျေးထည့်ပါ');
  const item = inventory.find(p => p.id === itemId);
  if (!item) return;
  await apiCall('addPurchase', { purchase: {
    id: Date.now().toString(36), date: new Date().toISOString().split('T')[0],
    itemId, itemName: item.name, quantity: qty, unitCost: cost,
    supplier: $('#stockinSupplier').value.trim()
  }}, 'POST');
  toast('ဝယ်ယူမှတ်တမ်းတင်ပြီး');
  await refreshAll();
  $('#stockinQty').value = 1; $('#stockinCost').value = ''; $('#stockinSupplier').value = '';
}

// ═══════════════ DASHBOARD ═══════════════
async function loadDashboard() {
  const dash = await apiCall('getDashboard');
  if (!dash) return;
  $('#dashStats').innerHTML = `
    <div class="dash-card"><div class="icon">💰</div><div class="value">${dash.todayRevenue.toLocaleString('my-MM')}</div><div class="label">ယနေ့ရောင်းရငွေ</div></div>
    <div class="dash-card"><div class="icon">📈</div><div class="value">${dash.todayProfit.toLocaleString('my-MM')}</div><div class="label">ယနေ့အမြတ်</div></div>
    <div class="dash-card"><div class="icon">📦</div><div class="value">${dash.totalStockValue.toLocaleString('my-MM')}</div><div class="label">စတော့တန်ဖိုး</div></div>
    <div class="dash-card"><div class="icon">🏺</div><div class="value">${dash.totalItems}</div><div class="label">အိုးအမျိုးအစား</div></div>
    <div class="dash-card warn"><div class="icon">⚠️</div><div class="value">${dash.lowStockItems?.length||0}</div><div class="label">စတော့နည်းနေ</div></div>
  `;
  const lowDiv = $('#lowStockList');
  if (!dash.lowStockItems?.length) lowDiv.innerHTML = '<p>အားလုံးလုံလောက်ပါသည်</p>';
  else lowDiv.innerHTML = dash.lowStockItems.map(p => `<p>⚠️ ${p.name} — လက်ကျန် ${p.quantity} လုံး (အနည်းဆုံး ${p.minStock})</p>`).join('');
}

async function loadReport() {
  const m = +$('#reportMonth').value;
  const y = +$('#reportYear').value;
  const s = await apiCall('getMonthlySummary', { year: y, month: m });
  if (!s) return;
  $('#reportContent').innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:1rem;">
      <div class="card text-center"><div style="color:var(--text-light);">အရောင်း</div><div style="font-size:1.8rem; font-weight:800; color:var(--clay-dark);">${s.totalSales.toLocaleString('my-MM')}</div></div>
      <div class="card text-center"><div style="color:var(--text-light);">အဝယ်</div><div style="font-size:1.8rem; font-weight:800; color:#E65100;">${s.totalPurchases.toLocaleString('my-MM')}</div></div>
      <div class="card text-center"><div style="color:var(--text-light);">အမြတ်</div><div style="font-size:1.8rem; font-weight:800; color:#2E7D32;">${s.netProfit.toLocaleString('my-MM')}</div></div>
    </div>`;
}

// ═══════════════ SCANNER ═══════════════
let codeReader = null;
async function scanBarcode() {
  if (!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();
  try {
    const result = await codeReader.decodeFromVideoDevice(null, document.createElement('video'));
    if (result?.text) {
      const item = inventory.find(p => p.id === result.text);
      if (!item) return toast('ပစ္စည်းမတွေ့ပါ');
      addToCart(item.id);
    }
  } catch (e) { toast('စကင်ဖတ်၍မရပါ'); }
  finally { try { codeReader.reset(); } catch(e) {} }
}

// ═══════════════ NAVIGATION ═══════════════
function switchView(view) {
  $$('#mainNav ~ div[id^="view"]').forEach(el => el.classList.add('hidden'));
  $(`#view${view.charAt(0).toUpperCase()+view.slice(1)}`).classList.remove('hidden');
  $$('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.nav-btn[data-view="${view}"]`)?.classList.add('active');
  if (view === 'sell') renderProducts();
  else if (view === 'inventory') renderInventoryTable();
  else if (view === 'stockin') updateStockinSelect();
  else if (view === 'dashboard') loadDashboard();
}

// ═══════════════ EVENTS ═══════════════
document.addEventListener('DOMContentLoaded', () => {
  $$('.nav-btn').forEach(btn => btn.addEventListener('click', function() { switchView(this.dataset.view); }));
  $('#potSearch').addEventListener('input', debounce(renderProducts, 200));
  $$('.modal').forEach(m => m.addEventListener('click', function(e) { if (e.target === this) closeModal(this.id); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.modal.active').forEach(m => closeModal(m.id)); });
});

function debounce(fn, ms = 250) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

// ═══════════════ INIT ═══════════════
(async function init() {
  await loadInventory();
  renderProducts();
  renderInventoryTable();
  renderCategories();
  updateStockinSelect();
  updateHeaderStats();
  $('#reportYear').value = new Date().getFullYear();
  $('#reportMonth').value = new Date().getMonth() + 1;
})();
</script>
</body>
