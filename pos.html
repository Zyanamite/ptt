<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ပန်းအိုးဆိုင် POS Pro – Dual Price</title>
  
  <!-- PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%232d5a27'/%3E%3Ctext x='256' y='380' font-size='320' text-anchor='middle' fill='white' font-family='sans-serif'%3Eပ%3C/text%3E%3C/svg%3E">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- html2canvas for receipt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --green: #2d5a27; --green-light: #e8f5e9; --green-dark: #1a3a18;
      --gold: #f59e0b; --red: #ef4444; --blue: #3b82f6; --bg: #f8faf8;
      --card: #ffffff; --text: #1e2b1c; --sub: #6b7b64; --border: #e5e7eb;
      --radius: 16px; --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', 'Noto Sans Myanmar', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
    .app { max-width: 1400px; margin: auto; padding: 1rem; padding-bottom: 90px; }
    
    .header { background: var(--card); border-radius: var(--radius); padding: 1rem 1.5rem; box-shadow: var(--shadow); margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .header .brand { font-size: 1.3rem; font-weight: 800; color: var(--green); }
    .connection { font-size: 0.7rem; padding: 0.3rem 0.8rem; border-radius: 12px; font-weight: 600; }
    .connection.online { background: #e8f5e9; color: #2d5a27; }
    .connection.offline { background: #ffebee; color: #c62828; }
    
    .bottom-nav { position: fixed; bottom:0; left:0; right:0; background:var(--card); display:flex; justify-content:space-around; padding:0.5rem 0 0.7rem; box-shadow:0 -4px 20px rgba(0,0,0,0.08); z-index:50; }
    .nav-item { display:flex; flex-direction:column; align-items:center; font-size:0.65rem; color:var(--sub); cursor:pointer; gap:0.2rem; }
    .nav-item.active { color:var(--green); font-weight:700; }
    .nav-item .icon { font-size:1.4rem; }
    
    .view { display:none; animation:fadeIn 0.3s ease; }
    .view.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    
    .card { background:var(--card); border-radius:var(--radius); padding:1.25rem; box-shadow:var(--shadow); margin-bottom:1rem; }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; }
    
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:0.8rem; margin-bottom:1rem; }
    .stat-card { background:var(--card); border-radius:var(--radius); padding:1rem; box-shadow:var(--shadow); text-align:center; }
    .stat-value { font-size:1.5rem; font-weight:800; }
    .stat-label { font-size:0.65rem; text-transform:uppercase; color:var(--sub); }
    
    .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:0.6rem; }
    .product { background:#f9fbf8; border-radius:12px; padding:0.7rem; text-align:center; cursor:pointer; border:1px solid var(--border); transition:0.2s; }
    .product:hover { box-shadow:0 10px 20px rgba(0,0,0,0.06); transform:translateY(-2px); }
    .product:active { transform:scale(0.97); }
    .product img { width:70px; height:70px; object-fit:cover; border-radius:8px; background:#eee; }
    .product .name { font-weight:700; font-size:0.75rem; margin:0.3rem 0; }
    .product .price { font-weight:600; color:var(--green); font-size:0.8rem; }
    
    .btn { padding:0.5rem 1.2rem; border-radius:24px; border:none; font-weight:600; cursor:pointer; font-size:0.8rem; transition:0.2s; }
    .btn-primary { background:var(--green); color:white; }
    .btn-outline { background:white; border:1.5px solid var(--green); color:var(--green); }
    .btn-sm { padding:0.3rem 0.8rem; font-size:0.7rem; }
    .btn-danger { background:var(--red); color:white; }
    .btn-block { width:100%; justify-content:center; }
    
    table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    th { background:#f9fafb; padding:0.6rem 0.5rem; text-align:left; font-weight:700; border-bottom:2px solid var(--border); }
    td { padding:0.5rem; border-bottom:1px solid #f3f4f6; }
    
    .tag { display:inline-block; padding:0.2rem 0.6rem; border-radius:12px; font-size:0.65rem; font-weight:600; }
    .tag-success { background:#e8f5e9; color:#2d5a27; }
    .tag-warning { background:#fff3e0; color:#e65100; }
    .tag-danger { background:#ffebee; color:#c62828; }
    
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100; }
    .modal.active { display:flex; }
    .modal-content { background:white; border-radius:20px; padding:1.5rem; width:90%; max-width:500px; max-height:85vh; overflow-y:auto; }
    
    .form-group { margin:0.5rem 0; }
    .form-group label { display:block; font-size:0.7rem; font-weight:600; color:var(--sub); margin-bottom:0.2rem; text-transform:uppercase; }
    input, select, textarea { width:100%; padding:0.65rem; border:1.5px solid var(--border); border-radius:10px; font-size:0.85rem; font-family:inherit; background:#fafbfa; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(45,90,39,0.1); }
    
    .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--text); color:white; padding:0.7rem 1.8rem; border-radius:30px; z-index:200; opacity:0; transition:opacity 0.3s; font-weight:600; }
    .toast.show { opacity:1; }
    
    .pos-layout { display:grid; grid-template-columns:1fr 340px; gap:1rem; }
    @media (max-width:900px) { .pos-layout { grid-template-columns:1fr; } }
    
    .cart-item { display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0; border-bottom:1px solid #f3f4f6; gap:0.5rem; }
    .cart-item .info { flex:1; }
    .controls { display:flex; gap:0.3rem; align-items:center; }
    .price-type-toggle { display:flex; gap:0.5rem; margin:0.5rem 0; }
    .price-type-btn { padding:0.3rem 1rem; border-radius:20px; border:1px solid var(--border); background:white; cursor:pointer; font-weight:600; font-size:0.75rem; }
    .price-type-btn.active { background:var(--green); color:white; border-color:var(--green); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">🪴 ပန်းအိုးဆိုင် POS Pro</div>
    <div style="display:flex;align-items:center;gap:0.5rem;">
      <span class="connection" id="connStatus">ချိတ်ဆက်နေသည်...</span>
      <button class="btn btn-primary btn-sm" onclick="switchView('pos')">+ အရောင်း</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="viewDashboard" class="view active">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="dTodayTotal">0</div><div class="stat-label">ယနေ့စုစုပေါင်း</div></div>
      <div class="stat-card"><div class="stat-value" id="dTodayRetail">0</div><div class="stat-label">လက်လီ</div></div>
      <div class="stat-card"><div class="stat-value" id="dTodayWholesale">0</div><div class="stat-label">လက်ကား</div></div>
      <div class="stat-card"><div class="stat-value" id="dProfit">0</div><div class="stat-label">အမြတ်</div></div>
      <div class="stat-card"><div class="stat-value" id="dStockValue">0</div><div class="stat-label">စတော့တန်ဖိုး</div></div>
      <div class="stat-card"><div class="stat-value" id="dLowStock">0</div><div class="stat-label">စတော့နည်း</div></div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
      <div class="card"><div class="card-header"><h3>လစဉ်အမြတ်</h3></div><canvas id="profitChart"></canvas></div>
      <div class="card"><div class="card-header"><h3>စတော့နည်းနေ</h3></div><div id="lowStockList"></div></div>
    </div>
  </div>

  <!-- POS -->
  <div id="viewPOS" class="view">
    <div class="pos-layout">
      <div class="card">
        <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
          <input type="text" id="posSearch" placeholder="ရှာရန်..." oninput="renderProducts()" style="flex:1;">
          <select id="catFilter" onchange="renderProducts()" style="max-width:130px;"><option value="">အားလုံး</option></select>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
      <div>
        <div class="card">
          <div class="card-header"><h3>ဈေးခြင်း</h3></div>
          <!-- Price Type Toggle -->
          <div class="price-type-toggle">
            <button class="price-type-btn active" id="retailBtn" onclick="setPriceType('retail')">လက်လီ</button>
            <button class="price-type-btn" id="wholesaleBtn" onclick="setPriceType('wholesale')">လက်ကား</button>
          </div>
          <div id="cartItems">ပစ္စည်းမထည့်ရသေး</div>
          <div style="margin:0.8rem 0;">
            <input type="number" id="discountPercent" placeholder="လျှော့စျေး %" style="width:80px; display:inline;" value="0"> %
          </div>
          <div style="display:flex;justify-content:space-between;font-weight:bold;">
            <span>စုစုပေါင်း:</span><span id="cartTotal">0</span>
          </div>
          <div style="margin:0.5rem 0;">
            <label style="font-size:0.7rem;">ဝယ်သူရွေးပါ</label>
            <select id="posCustomer"><option value="">Walk-in</option></select>
            <button class="btn btn-sm btn-outline" style="margin-top:0.3rem;" onclick="openCustomerModal()">+ အသစ်</button>
          </div>
          <button class="btn btn-primary btn-block" onclick="checkout()">💰 ရောင်းမယ်</button>
        </div>
        <div id="receiptArea" style="display:none;margin-top:1rem;"></div>
      </div>
    </div>
  </div>

  <!-- Inventory -->
  <div id="viewInventory" class="view">
    <div class="card">
      <div class="card-header"><h3>ပစ္စည်းစာရင်း</h3><button class="btn btn-primary btn-sm" onclick="openItemModal()">+ အသစ်</button></div>
      <div id="invTable"></div>
    </div>
  </div>

  <!-- Purchases -->
  <div id="viewPurchases" class="view">
    <div class="card">
      <h3>အဝယ်ထည့်ရန်</h3>
      <select id="purchItemId"></select>
      <input type="number" id="purchQty" placeholder="အရေအတွက်" value="1">
      <input type="text" id="purchSupplier" placeholder="ပေးသွင်းသူ">
      <button class="btn btn-primary btn-block" onclick="recordPurchase()">ဝယ်ယူမယ်</button>
    </div>
  </div>

  <!-- Reports -->
  <div id="viewReports" class="view">
    <div class="card">
      <div class="card-header"><h3>အစီရင်ခံစာ</h3></div>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
        <input type="date" id="reportFrom">
        <input type="date" id="reportTo">
        <button class="btn btn-primary btn-sm" onclick="loadReport()">ကြည့်မယ်</button>
      </div>
      <div id="reportData" style="margin-top:1rem;"></div>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchView('dashboard')"><span class="icon">📊</span>Dashboard</div>
  <div class="nav-item" onclick="switchView('pos')"><span class="icon">💰</span>POS</div>
  <div class="nav-item" onclick="switchView('inventory')"><span class="icon">📦</span>စာရင်း</div>
  <div class="nav-item" onclick="switchView('purchases')"><span class="icon">📥</span>အဝယ်</div>
  <div class="nav-item" onclick="switchView('reports')"><span class="icon">📈</span>မှတ်တမ်း</div>
</div>

<!-- Item Modal -->
<div class="modal" id="itemModal">
  <div class="modal-content">
    <h3 id="itemModalTitle">ပစ္စည်းအသစ်</h3>
    <div class="form-group"><label>အမည် *</label><input type="text" id="invName"></div>
    <div class="form-group"><label>အမျိုးအစား</label><input type="text" id="invCategory"></div>
    <div class="form-group"><label>ဝယ်စျေး (Cost)</label><input type="number" id="invCost"></div>
    <div class="form-group"><label>လက်လီစျေး (Retail) *</label><input type="number" id="invRetail"></div>
    <div class="form-group"><label>လက်ကားစျေး (Wholesale)</label><input type="number" id="invWholesale"></div>
    <div class="form-group"><label>လက်ကျန်</label><input type="number" id="invQty" value="0"></div>
    <div class="form-group"><label>အနည်းဆုံး</label><input type="number" id="invMin" value="5"></div>
    <div class="form-group"><label>ပုံ URL</label><input type="text" id="invImg"></div>
    <textarea id="invDesc" placeholder="ဖော်ပြချက်"></textarea>
    <input type="hidden" id="invEditId">
    <div style="margin-top:1rem;display:flex;gap:0.5rem;">
      <button class="btn btn-primary" onclick="saveItem()" style="flex:1;">သိမ်း</button>
      <button class="btn btn-outline" onclick="closeModal('itemModal')" style="flex:1;">မလုပ်တော့</button>
    </div>
  </div>
</div>

<!-- Customer Modal -->
<div class="modal" id="customerModal">
  <div class="modal-content">
    <h3>ဝယ်သူအသစ်</h3>
    <input type="text" id="newCustName" placeholder="အမည်">
    <input type="text" id="newCustPhone" placeholder="ဖုန်း">
    <button class="btn btn-primary btn-block" onclick="addCustomer()">သိမ်းမယ်</button>
    <button class="btn btn-outline btn-block" onclick="closeModal('customerModal')">မလုပ်တော့</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, set, push, get, update, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  const firebaseConfig = {
    databaseURL: "https://pospot-01-default-rtdb.firebaseio.com/"
  };
  const app = initializeApp(firebaseConfig);
  window.db = getDatabase(app);
  window.ref = ref;
  window.set = set;
  window.push = push;
  window.get = get;
  window.update = update;
  window.remove = remove;
  window.onValue = onValue;

  window.firebaseReady = true;
  document.dispatchEvent(new Event('firebaseReady'));
</script>

<script>
  let inventory = [], cart = [], customers = [], allSales = [];
  let currentPriceType = 'retail'; // 'retail' or 'wholesale'
  let profitChart;

  function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
  function formatMoney(n){ return (n||0).toLocaleString('en-US')+' ကျပ်'; }

  // Firebase helpers
  async function fbGet(path){ const snap = await get(ref(db,path)); if(!snap.exists()) return []; return Object.entries(snap.val()).map(([k,v])=>({_key:k,...v})); }
  async function fbAdd(path,data){ const r = push(ref(db,path)); await set(r,data); return r.key; }
  async function fbUpdate(path,data){ await update(ref(db,path),data); }
  async function fbDelete(path){ await remove(ref(db,path)); }

  async function loadAll(){
    [inventory, allSales, customers] = await Promise.all([
      fbGet('inventory'), fbGet('sales'), fbGet('customers')
    ]);
    renderProducts(); renderInvTable(); updateSelects(); updateCustomerSelect();
    await loadDashboard();
  }

  // Dashboard
  async function loadDashboard(){
    const today = new Date().toISOString().split('T')[0];
    const todaySales = allSales.filter(s=>s.date===today);
    const totalRevenue = todaySales.reduce((s,r)=>s+(r.totalRevenue||0),0);
    const retailRevenue = todaySales.filter(s=>s.priceType==='retail').reduce((s,r)=>s+(r.totalRevenue||0),0);
    const wholesaleRevenue = todaySales.filter(s=>s.priceType==='wholesale').reduce((s,r)=>s+(r.totalRevenue||0),0);
    const profit = todaySales.reduce((s,r)=>s+(r.profit||0),0);
    const stockValue = inventory.reduce((s,i)=>s+(i.quantity||0)*(i.costPrice||0),0);
    const lowStock = inventory.filter(i=>(i.quantity||0)<=(i.minStock||5));
    document.getElementById('dTodayTotal').textContent = formatMoney(totalRevenue);
    document.getElementById('dTodayRetail').textContent = formatMoney(retailRevenue);
    document.getElementById('dTodayWholesale').textContent = formatMoney(wholesaleRevenue);
    document.getElementById('dProfit').textContent = formatMoney(profit);
    document.getElementById('dStockValue').textContent = formatMoney(stockValue);
    document.getElementById('dLowStock').textContent = lowStock.length+' ခု';
    document.getElementById('lowStockList').innerHTML = lowStock.length ? lowStock.map(i=>`<p>${i.name} (${i.quantity})</p>`).join('') : 'မရှိပါ';
    // Chart
    const profits = []; const year = new Date().getFullYear();
    for(let m=1;m<=12;m++){
      const start = `${year}-${String(m).padStart(2,'0')}-01`;
      const end = new Date(year,m,0).toISOString().split('T')[0];
      const ms = allSales.filter(s=>s.date>=start && s.date<=end);
      profits.push(ms.reduce((s,r)=>s+(r.profit||0),0));
    }
    if(profitChart) profitChart.destroy();
    profitChart = new Chart(document.getElementById('profitChart'),{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],datasets:[{label:'အမြတ်',data:profits,backgroundColor:'#2d5a27'}]}});
  }

  // POS
  function setPriceType(type){
    currentPriceType=type;
    document.getElementById('retailBtn').classList.toggle('active',type==='retail');
    document.getElementById('wholesaleBtn').classList.toggle('active',type==='wholesale');
    renderCart(); // re-render prices
  }

  function getPrice(item){
    return currentPriceType==='wholesale' ? (item.wholesalePrice||item.retailPrice||0) : (item.retailPrice||0);
  }

  function renderProducts(){
    const search = (document.getElementById('posSearch')?.value||'').toLowerCase();
    const cat = document.getElementById('catFilter')?.value||'';
    const filtered = inventory.filter(i=>{
      const ms = (i.name||'').toLowerCase().includes(search);
      const mc = !cat || i.category===cat;
      return ms && mc;
    });
    document.getElementById('catFilter').innerHTML = '<option value="">အားလုံး</option>'+[...new Set(inventory.map(i=>i.category).filter(Boolean))].map(c=>`<option value="${c}">${c}</option>`).join('');
    document.getElementById('productGrid').innerHTML = filtered.length ? filtered.map(i=>{
      const price = getPrice(i);
      return `<div class="product" onclick="addToCart('${i._key}')">
        <img src="${i.imageUrl||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22%3E%3Crect width=%2270%22 height=%2270%22 fill=%22%23ddd%22/%3E%3Ctext x=%2235%22 y=%2245%22 text-anchor=%22middle%22 fill=%22%23999%22%3EN/A%3C/text%3E%3C/svg%3E'}">
        <div class="name">${i.name}</div>
        <div class="price">${formatMoney(price)}</div>
        <small>${i.quantity||0} ခု</small>
      </div>`;
    }).join('') : '<p style="grid-column:1/-1;text-align:center;">မရှိပါ</p>';
  }

  function addToCart(key){
    const item = inventory.find(i=>i._key===key);
    if(!item || (item.quantity||0)<1) return toast('စတော့မရှိပါ');
    const exist = cart.find(c=>c._key===key);
    if(exist){
      if(exist.qty >= item.quantity) return toast('စတော့မလုံလောက်');
      exist.qty++;
    } else cart.push({...item, qty:1});
    renderCart();
  }
  function removeFromCart(key){ cart=cart.filter(c=>c._key!==key); renderCart(); }
  function changeCartQty(key,delta){
    const c = cart.find(c=>c._key===key); if(!c) return;
    const item = inventory.find(i=>i._key===key);
    const n = c.qty+delta;
    if(n<1) return removeFromCart(key);
    if(n > (item?.quantity||0)) return toast('စတော့မလုံလောက်');
    c.qty=n; renderCart();
  }
  function renderCart(){
    const disc = +(document.getElementById('discountPercent').value||0);
    let subtotal = cart.reduce((s,c)=> s + c.qty * getPrice(c), 0);
    let total = subtotal * (1 - disc/100);
    document.getElementById('cartItems').innerHTML = cart.length ? cart.map(c=>{
      const price = getPrice(c);
      return `<div class="cart-item">
        <div class="info"><strong>${c.name}</strong><br><small>${c.qty} × ${formatMoney(price)}</small></div>
        <div class="controls">
          <button class="btn btn-sm" onclick="changeCartQty('${c._key}',-1)">−</button>
          <span>${c.qty}</span>
          <button class="btn btn-sm" onclick="changeCartQty('${c._key}',1)">+</button>
          <button class="btn btn-sm btn-danger" onclick="removeFromCart('${c._key}')">✕</button>
        </div>
      </div>`;
    }).join('') : '<p style="text-align:center;padding:2rem;">ပစ္စည်းမထည့်ရသေး</p>';
    document.getElementById('cartTotal').textContent = formatMoney(total);
  }

  async function checkout(){
    if(!cart.length) return toast('ပစ္စည်းထည့်ပါ');
    const disc = +(document.getElementById('discountPercent').value||0);
    const customer = document.getElementById('posCustomer').value;
    const date = new Date().toISOString().split('T')[0];
    for(const c of cart){
      const price = getPrice(c);
      const unitPrice = price * (1 - disc/100);
      const profit = (unitPrice - (c.costPrice||0)) * c.qty;
      await fbAdd('sales',{
        date, itemId:c._key, itemName:c.name, quantity:c.qty,
        unitPrice, totalRevenue:unitPrice*c.qty, profit, customer,
        priceType:currentPriceType
      });
      await fbUpdate(`inventory/${c._key}`,{quantity:Math.max(0,(c.quantity||0)-c.qty)});
    }
    showReceipt(customer,date);
    cart=[]; renderCart(); document.getElementById('discountPercent').value=0;
    await loadAll(); toast('ရောင်းပြီး');
  }

  function showReceipt(customer,date){
    const disc = +(document.getElementById('discountPercent').value||0);
    const total = cart.reduce((s,c)=> s + c.qty * getPrice(c) * (1-disc/100), 0);
    document.getElementById('receiptArea').style.display='block';
    document.getElementById('receiptArea').innerHTML = `
      <div class="card" id="receiptCard">
        <h3 style="text-align:center;">ပန်းအိုးဆိုင်</h3>
        <p>${date} | ${customer||'Walk-in'} | ${currentPriceType==='wholesale'?'လက်ကား':'လက်လီ'}</p>
        <table><tr><th>ပစ္စည်း</th><th>အရေအတွက်</th><th>စျေး</th><th>စုစုပေါင်း</th></tr>
        ${cart.map(c=>`<tr><td>${c.name}</td><td>${c.qty}</td><td>${formatMoney(getPrice(c))}</td><td>${formatMoney(c.qty*getPrice(c))}</td></tr>`).join('')}</table>
        <p style="text-align:right;">စုစုပေါင်း: <strong>${formatMoney(total)}</strong></p>
      </div>
      <button class="btn btn-primary btn-block" onclick="printReceipt()">ပရင့်ထုတ်မယ်</button>`;
  }
  async function printReceipt(){
    const card = document.getElementById('receiptCard');
    if(card){
      const canvas = await html2canvas(card);
      const w = window.open('','_blank');
      w.document.write(`<img src="${canvas.toDataURL()}" onload="window.print();window.close();">`);
    }
  }

  // Inventory
  function renderInvTable(){
    document.getElementById('invTable').innerHTML = inventory.length ? `<table><tr><th>ပုံ</th><th>အမည်</th><th>ဝယ်စျေး</th><th>လက်လီ</th><th>လက်ကား</th><th>လက်ကျန်</th><th></th></tr>
    ${inventory.map(i=>`<tr>
      <td><img src="${i.imageUrl||''}" style="width:35px;height:35px;border-radius:6px;" onerror="this.style.display='none'"></td>
      <td>${i.name}</td><td>${formatMoney(i.costPrice)}</td><td>${formatMoney(i.retailPrice)}</td><td>${formatMoney(i.wholesalePrice)}</td>
      <td><span class="tag ${(i.quantity||0)<=(i.minStock||5)?'tag-danger':'tag-success'}">${i.quantity}</span></td>
      <td><button class="btn btn-sm btn-outline" onclick="editItem('${i._key}')">ပြင်</button> <button class="btn btn-sm btn-danger" onclick="deleteItem('${i._key}')">ဖျက်</button></td>
    </tr>`).join('')}</table>` : '<p>မရှိသေး</p>';
  }
  function openItemModal(){
    document.getElementById('itemModalTitle').textContent='ပစ္စည်းအသစ်';
    document.getElementById('invEditId').value='';
    ['invName','invCategory','invCost','invRetail','invWholesale','invQty','invMin','invImg','invDesc'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('invMin').value=5;
    document.getElementById('itemModal').classList.add('active');
  }
  function editItem(key){
    const item = inventory.find(i=>i._key===key); if(!item) return;
    document.getElementById('invEditId').value=key;
    document.getElementById('itemModalTitle').textContent='ပြင်ဆင်ရန်';
    document.getElementById('invName').value=item.name||'';
    document.getElementById('invCategory').value=item.category||'';
    document.getElementById('invCost').value=item.costPrice||'';
    document.getElementById('invRetail').value=item.retailPrice||'';
    document.getElementById('invWholesale').value=item.wholesalePrice||'';
    document.getElementById('invQty').value=item.quantity||0;
    document.getElementById('invMin').value=item.minStock||5;
    document.getElementById('invImg').value=item.imageUrl||'';
    document.getElementById('invDesc').value=item.description||'';
    document.getElementById('itemModal').classList.add('active');
  }
  async function saveItem(){
    const key = document.getElementById('invEditId').value;
    const item = {
      name: document.getElementById('invName').value.trim(),
      category: document.getElementById('invCategory').value.trim(),
      costPrice: +document.getElementById('invCost').value,
      retailPrice: +document.getElementById('invRetail').value,
      wholesalePrice: +document.getElementById('invWholesale').value,
      quantity: +document.getElementById('invQty').value,
      minStock: +document.getElementById('invMin').value,
      imageUrl: document.getElementById('invImg').value.trim(),
      description: document.getElementById('invDesc').value.trim()
    };
    if(!item.name) return toast('အမည်ထည့်ပါ');
    if(key) await fbUpdate(`inventory/${key}`,item);
    else await fbAdd('inventory',item);
    closeModal('itemModal'); await loadAll(); toast('သိမ်းပြီး');
  }
  async function deleteItem(key){
    if(confirm('ဖျက်မှာလား')){ await fbDelete(`inventory/${key}`); await loadAll(); }
  }
  function closeModal(id){ document.getElementById(id).classList.remove('active'); }

  // Purchases
  function updateSelects(){
    document.getElementById('purchItemId').innerHTML = inventory.map(i=>`<option value="${i._key}">${i.name} (${i.quantity})</option>`).join('');
  }
  async function recordPurchase(){
    const key = document.getElementById('purchItemId').value;
    const qty = +document.getElementById('purchQty').value;
    if(!qty) return toast('အရေအတွက်ထည့်ပါ');
    const item = inventory.find(i=>i._key===key); if(!item) return;
    await fbAdd('purchases',{ date: new Date().toISOString().split('T')[0], itemId:key, itemName:item.name, quantity:qty, unitCost:item.costPrice, totalCost:qty*item.costPrice, supplier:document.getElementById('purchSupplier').value });
    await fbUpdate(`inventory/${key}`,{quantity:(item.quantity||0)+qty});
    document.getElementById('purchQty').value=1; document.getElementById('purchSupplier').value='';
    await loadAll(); toast('ဝယ်ယူပြီး');
  }

  // Customers
  function updateCustomerSelect(){
    document.getElementById('posCustomer').innerHTML = '<option value="">Walk-in</option>'+customers.map(c=>`<option value="${c.name}">${c.name} (${c.phone||''})</option>`).join('');
  }
  function openCustomerModal(){ document.getElementById('customerModal').classList.add('active'); }
  async function addCustomer(){
    const name = document.getElementById('newCustName').value.trim();
    if(!name) return toast('အမည်ထည့်ပါ');
    await fbAdd('customers',{name, phone:document.getElementById('newCustPhone').value.trim()});
    closeModal('customerModal');
    document.getElementById('newCustName').value=''; document.getElementById('newCustPhone').value='';
    await loadAll();
  }

  // Reports
  async function loadReport(){
    const from = document.getElementById('reportFrom').value;
    const to = document.getElementById('reportTo').value;
    let filtered = allSales;
    if(from) filtered = filtered.filter(s=>s.date>=from);
    if(to) filtered = filtered.filter(s=>s.date<=to);
    const total = filtered.reduce((s,r)=>s+(r.totalRevenue||0),0);
    const retail = filtered.filter(s=>s.priceType==='retail').reduce((s,r)=>s+(r.totalRevenue||0),0);
    const wholesale = filtered.filter(s=>s.priceType==='wholesale').reduce((s,r)=>s+(r.totalRevenue||0),0);
    const profit = filtered.reduce((s,r)=>s+(r.profit||0),0);
    document.getElementById('reportData').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value">${formatMoney(total)}</div><div class="stat-label">စုစုပေါင်း</div></div>
        <div class="stat-card"><div class="stat-value">${formatMoney(retail)}</div><div class="stat-label">လက်လီ</div></div>
        <div class="stat-card"><div class="stat-value">${formatMoney(wholesale)}</div><div class="stat-label">လက်ကား</div></div>
        <div class="stat-card"><div class="stat-value">${formatMoney(profit)}</div><div class="stat-label">အမြတ်</div></div>
      </div>
      <table><tr><th>ရက်</th><th>ပစ္စည်း</th><th>အမျိုးအစား</th><th>အရေအတွက်</th><th>စုစုပေါင်း</th><th>အမြတ်</th></tr>
      ${filtered.slice(-50).reverse().map(s=>`<tr><td>${s.date}</td><td>${s.itemName}</td><td>${s.priceType==='wholesale'?'လက်ကား':'လက်လီ'}</td><td>${s.quantity}</td><td>${formatMoney(s.totalRevenue)}</td><td>${formatMoney(s.profit)}</td></tr>`).join('')}</table>`;
  }

  function switchView(view){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view'+view.charAt(0).toUpperCase()+view.slice(1)).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelector(`.nav-item[onclick="switchView('${view}')"]`).classList.add('active');
    if(view==='dashboard') loadDashboard();
    else if(view==='pos') renderProducts();
    else if(view==='inventory') renderInvTable();
    else if(view==='purchases') updateSelects();
    else if(view==='reports') { document.getElementById('reportFrom').value = new Date(new Date().setDate(1)).toISOString().split('T')[0]; document.getElementById('reportTo').value = new Date().toISOString().split('T')[0]; loadReport(); }
  }

  async function init(){
    try{
      document.getElementById('connStatus').textContent='ချိတ်ဆက်နေသည်...';
      await loadAll();
      document.getElementById('connStatus').textContent='✅ ချိတ်ဆက်ပြီး';
      document.getElementById('connStatus').className='connection online';
      renderProducts(); renderInvTable(); updateSelects(); updateCustomerSelect(); loadDashboard();
    } catch(e){
      document.getElementById('connStatus').textContent='❌ ချိတ်ဆက်မှုမအောင်မြင်';
      document.getElementById('connStatus').className='connection offline';
    }
  }

  document.addEventListener('firebaseReady', init);
  document.getElementById('discountPercent').addEventListener('input', renderCart);
</script>
</body>
</html>
