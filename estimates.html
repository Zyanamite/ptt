<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ပန်းသတင်း Landscaping | Estimate & Catalog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* ── Reset & Variables ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a3b2e;
            --primary-light: #2d6a4f;
            --accent: #74c69d;
            --accent-glow: #52b788;
            --bg-light: #f8faf8;
            --bg-glass: rgba(255, 255, 255, 0.75);
            --text-dark: #1e2a23;
            --text-soft: #3a4d41;
            --white: #ffffff;
            --gold: #c78d20;
            --gold-light: #fffdf5;
            --shadow-sm: 0 10px 30px -10px rgba(0, 20, 10, 0.1);
            --shadow-md: 0 20px 40px -15px rgba(0, 30, 10, 0.15);
            --shadow-glow: 0 0 20px rgba(82, 183, 136, 0.3);
            --border-radius-card: 28px;
            --border-radius-btn: 60px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 70% 30%, rgba(116, 198, 157, 0.15), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            left: -5%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle at 20% 80%, rgba(45, 106, 79, 0.1), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.02em; }
        .section-title { text-align: center; margin-bottom: 50px; }
        .subhead { opacity: 0.75; font-size: 0.95rem; font-weight: 500; margin-top: 6px; }

        /* ── Buttons ── */
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 12px 28px;
            border-radius: var(--border-radius-btn);
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md), var(--shadow-glow);
        }

        /* ── Header ── */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 0;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo a { text-decoration: none; color: inherit; }
        .logo h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); line-height: 1.2; }
        .logo span { font-size: 0.75rem; opacity: 0.75; font-weight: 500; letter-spacing: 1px; color: var(--text-soft); }
        .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .home-btn, .cart-btn-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            font-family: inherit;
        }
        .home-btn {
            color: var(--primary);
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(0,0,0,0.08);
        }
        .home-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .cart-btn-header {
            color: #3d2a00;
            background: var(--gold);
            border: none;
            box-shadow: 0 2px 10px rgba(199, 141, 32, 0.25);
        }
        .cart-btn-header:hover { background: #e8b830; transform: translateY(-2px); }
        .cart-count-header {
            background: var(--primary);
            color: white;
            min-width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.68rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* ── Language Switcher ── */
        .lang-switcher {
            display: flex;
            background: rgba(0,0,0,0.05);
            border-radius: 40px;
            padding: 3px;
        }
        .lang-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            background: transparent;
            color: var(--text-soft);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        .lang-btn.active {
            background: var(--primary);
            color: white;
        }
        .lang-btn:hover:not(.active) { background: rgba(0,0,0,0.05); }

        /* ── Catalog Tabs ── */
        .catalog-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .catalog-tab {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1.5px solid rgba(0,0,0,0.06);
            background: white;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            color: var(--text-soft);
        }
        .catalog-tab:hover { border-color: var(--accent); background: #f0faf4; }
        .catalog-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ── Plant Card ── */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .plant-card {
            background: white;
            border-radius: var(--border-radius-card);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
        }
        .plant-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
        }
        .plant-card-img-wrap {
            position: relative;
            overflow: hidden;
            background: #f5f7f5;
        }
        .plant-card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }
        .plant-card:hover .plant-card-img { transform: scale(1.03); }
        .plant-card-badges {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .badge-pop {
            background: rgba(255, 200, 0, 0.92);
            color: #5c3d0a;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            backdrop-filter: blur(4px);
        }
        .badge-stock {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }
        .badge-stock.soldout { background: rgba(200, 50, 50, 0.85); color: white; }
        .badge-stock.preorder { background: rgba(255, 165, 0, 0.85); color: white; }
        .badge-stock.instock { background: rgba(46, 125, 50, 0.85); color: white; }

        .plant-card-body {
            padding: 16px 16px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .plant-card-body h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }
        .plant-card-body .plant-mm {
            font-weight: 600;
            color: var(--primary-light);
            font-size: 0.76rem;
            margin-bottom: 4px;
        }
        .plant-sci {
            font-size: 0.7rem;
            color: var(--text-soft);
            font-style: italic;
            opacity: 0.6;
            margin-bottom: 4px;
        }
        .plant-desc {
            font-size: 0.78rem;
            color: var(--text-soft);
            opacity: 0.75;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .plant-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }
        .plant-tags span {
            background: var(--bg-light);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-soft);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .plant-card-price {
            font-weight: 700;
            color: #9e5e00;
            background: var(--gold-light);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-top: auto;
            margin-bottom: 8px;
            align-self: flex-start;
        }
        .plant-qty-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .plant-qty-row button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid var(--accent);
            background: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--primary);
            line-height: 1;
        }
        .plant-qty-row button:hover { background: #f0faf4; }
        .plant-qty-row span { font-weight: 600; min-width: 24px; text-align: center; font-size: 0.85rem; }
        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 0;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            width: 100%;
            transition: var(--transition);
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-add:hover { background: var(--primary-light); }
        .btn-add.added { background: var(--gold); color: #3d2a00; }

        /* ── Sold Out Overlay ── */
        .plant-card.soldout .plant-card-img { opacity: 0.4; }
        .plant-card.soldout .soldout-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* ── Services Grid ── */
        .services-catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .svc-card {
            background: white;
            border: 1.5px solid rgba(0,0,0,0.06);
            border-radius: 18px;
            padding: 20px 14px;
            text-align: center;
            transition: var(--transition);
        }
        .svc-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-sm); }
        .svc-card .s-icon { font-size: 2rem; margin-bottom: 6px; }
        .svc-card h4 { font-size: 0.9rem; color: var(--primary); }
        .svc-card .s-price { font-weight: 700; color: #9e5e00; font-size: 0.85rem; margin: 6px 0; }
        .svc-card .s-features { font-size: 0.75rem; color: var(--text-soft); opacity: 0.7; margin-bottom: 10px; }
        .svc-card .btn-add { margin-top: 4px; }

        /* ── Estimator Section ── */
        .estimator-section { padding: 60px 0 80px; background: var(--bg-light); }
        .estimator-card {
            background: white;
            border-radius: var(--border-radius-card);
            box-shadow: var(--shadow-sm);
            padding: 32px 36px;
            max-width: 720px;
            margin: 0 auto;
            border: 1px solid rgba(0,0,0,0.04);
            position: relative;
        }
        .empty-cart { text-align: center; padding: 30px 0; }
        .empty-cart .empty-icon { font-size: 3rem; margin-bottom: 12px; }

        .estimate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .estimate-item:last-child { border-bottom: none; }
        .estimate-item .ei-name { font-weight: 600; font-size: 0.9rem; }
        .estimate-item .ei-qty { color: var(--text-soft); font-size: 0.85rem; }
        .estimate-item .ei-price { font-weight: 700; color: #9e5e00; }
        .estimate-item .ei-remove {
            background: none;
            border: none;
            color: #cc5555;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 6px;
            transition: var(--transition);
        }
        .estimate-item .ei-remove:hover { transform: scale(1.2); }

        /* ── Delivery Selector ── */
        .delivery-selector {
            margin: 16px 0;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 16px;
            border: 1.5px solid rgba(0,0,0,0.06);
        }
        .delivery-selector label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .delivery-selector select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(0,0,0,0.08);
            font-family: inherit;
            font-size: 0.9rem;
            background: white;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
        }
        .delivery-selector select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(116, 198, 157, 0.2);
        }
        .delivery-selector .delivery-fee-display {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-soft);
        }
        .delivery-selector .delivery-fee-display strong {
            color: #9e5e00;
        }

        .summary-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.9rem; color: var(--text-soft); }
        .summary-line.grand {
            font-size: 1.25rem;
            font-weight: 800;
            border-top: 2px solid var(--accent);
            padding-top: 14px;
            margin-top: 10px;
            color: var(--primary);
        }
        .save-hint {
            background: var(--gold-light);
            border: 1.5px dashed var(--gold);
            border-radius: 16px;
            padding: 12px 16px;
            margin: 16px 0;
            font-size: 0.82rem;
            color: #5c3d0a;
            text-align: center;
            font-weight: 500;
        }
        .action-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 16px 0;
        }
        .btn-act {
            padding: 12px 16px;
            border-radius: 50px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            font-size: 0.82rem;
            border: none;
            font-family: inherit;
            transition: var(--transition);
            flex: 1;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-act.gold { background: var(--gold); color: #3d2a00; }
        .btn-act.gold:hover { background: #e8b830; transform: translateY(-2px); }
        .btn-act.green { background: var(--primary); color: white; }
        .btn-act.green:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-act.outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-act.outline:hover { background: var(--primary); color: white; }

        .contact-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .contact-card {
            flex: 1;
            min-width: 70px;
            background: white;
            border: 1.5px solid rgba(0,0,0,0.06);
            border-radius: 18px;
            padding: 14px 10px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            cursor: pointer;
        }
        .contact-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); transform: translateY(-2px); }
        .contact-card .cc-icon { font-size: 1.5rem; margin-bottom: 5px; }
        .contact-card strong { display: block; font-size: 0.75rem; color: var(--primary); }

        /* ── Voucher Modal ── */
        .voucher-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .voucher-overlay.active { display: flex; }
        .voucher-container {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .voucher-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 30px 24px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }
        .voucher-header h2 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        .voucher-header .voucher-subtitle {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .voucher-body {
            padding: 24px;
        }
        .voucher-items {
            margin-bottom: 20px;
        }
        .voucher-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .voucher-item-img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .voucher-item-details {
            flex: 1;
        }
        .voucher-item-name {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .voucher-item-qty {
            font-size: 0.8rem;
            color: var(--text-soft);
        }
        .voucher-item-price {
            font-weight: 700;
            color: #9e5e00;
            text-align: right;
            min-width: 80px;
        }
        .voucher-summary {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 16px;
        }
        .voucher-summary .voucher-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9rem;
        }
        .voucher-summary .voucher-total {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            border-top: 2px solid var(--accent);
            padding-top: 10px;
            margin-top: 10px;
        }
        .voucher-footer {
            text-align: center;
            padding: 20px 24px;
            border-top: 1px solid #eee;
        }
        .voucher-footer .btn-close-voucher {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
            margin: 0 6px;
        }
        .voucher-footer .btn-download-voucher {
            background: var(--gold);
            color: #3d2a00;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
            margin: 0 6px;
        }
        .voucher-footer button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* ── Back to Top ── */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-to-top:hover { background: var(--primary-light); transform: translateY(-3px); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* ── Mobile Responsive ── */
        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .logo h1 { font-size: 1.3rem; }
            .logo span { font-size: 0.6rem; }
            .header-content { flex-direction: column; align-items: stretch; gap: 8px; }
            .header-right { justify-content: center; gap: 8px; }
            .home-btn, .cart-btn-header { padding: 8px 14px; font-size: 0.78rem; }
            .catalog-tabs { gap: 6px; }

    function t(key) {
        return (translations[currentLang] || translations.en)[key] || key;

    }

    var PLANTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR22WF-9wb_hxPWqloOoUYxRgbcWi46lbDIw65JtHLMtMMETMzChz1pcRieoJR_nBHb210NxJzmOqDT/pub?gid=616508581&single=true&output=csv';
    var SERVICES_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR22WF-9wb_hxPWqloOoUYxRgbcWi46lbDIw65JtHLMtMMETMzChz1pcRieoJR_nBHb210NxJzmOqDT/pub?gid=237556812&single=true&output=csv';

    var SOCIAL = {
        facebook: 'https://facebook.com/yourpage',
        messenger: 'https://m.me/yourpage',
        tiktok: 'https://tiktok.com/@yourhandle',
        email: 'pttlandscapeservices@gmail.com'
    };

    function parseCSV(t) {
        var r = [], c = '', q = false;
        for (var i = 0; i < t.length; i++) {
            var ch = t.charAt(i);
            if (ch === '"') q = !q;
            else if (ch === ',' && !q) { r.push(c.trim()); c = ''; }
            else c += ch;
        }
        r.push(c.trim());
        return r;
    }

    function fetchCSV(url) {
        return fetch(url)
            .then(function(r) {
                if (!r.ok) throw new Error('Failed to fetch CSV');
                return r.text();
            })
            .then(function(t) { return t.trim().split('\n').map(parseCSV); });
    }

    function updateHeaderTranslations() {
        document.getElementById('headerSubtitle').textContent = t('headerSubtitle');
        document.getElementById('homeText').textContent = t('homeText');
        document.getElementById('cartText').textContent = t('cartText');
    }

    function updateSectionTitles() {
        document.getElementById('catalogTitle').textContent = t('catalogTitle');
        document.getElementById('catalogSubhead').textContent = t('catalogSubhead');
        document.getElementById('estimateTitle').textContent = t('estimateTitle');
        document.getElementById('estimateSubhead').textContent = t('estimateSubhead');
        
        document.querySelectorAll('.catalog-tab').forEach(function(tab) {
            var label = tab.querySelector('.tab-label');
            if (label) label.textContent = tTab(tab.dataset.cat);
        });
    }

    function loadAllData() {
        return Promise.all([fetchCSV(PLANTS_CSV_URL), fetchCSV(SERVICES_CSV_URL)])
            .then(function(results) {
                var plantRows = results[0];
                var serviceRows = results[1];

                plantCatalogData = [];
                for (var i = 1; i < plantRows.length; i++) {
                    var r = plantRows[i];
                    if (r.length < 2) continue;
                    plantCatalogData.push({
                        type: r[0] || 'Plant',
                        file: r[1],
                        nameEN: r[2] || '',
                        nameMM: r[3] || r[2] || '',
                        catEN: r[4] || '',
                        catMM: r[5] || r[4] || '',
                        priceLow: parseInt((r[6] || '0').replace(/,/g, '')) || 0,
                        priceHigh: parseInt((r[7] || '0').replace(/,/g, '')) || 0,
                        status: (r[8] || 'instock').toLowerCase(),
                        badge: r[9] || '',
                        badgeClass: r[10] || '',
                        sci: r[11] || '',
                        descEN: r[12] || '',
                        descMM: r[13] || '',
                        tags: (r[14] || '').split('|').map(function(t) { return t.trim(); }).filter(Boolean)
                    });
                }

                serviceCatalogData = [];
                for (var j = 1; j < serviceRows.length; j++) {
                    var sr = serviceRows[j];
                    if (sr.length < 5) continue;
                    serviceCatalogData.push({
                        cat: sr[0] || '',
                        nameEN: sr[1] || '',
                        nameMM: sr[2] || sr[1] || '',
                        priceLow: parseInt((sr[3] || '0').replace(/,/g, '')) || 0,
                        priceHigh: parseInt((sr[4] || '0').replace(/,/g, '')) || 0,
                        features: (sr[5] || '').split('|').map(function(f) { return f.trim(); }).filter(Boolean)
                    });
                }

                renderCatalog();
                renderEstimate();
            })
            .catch(function(err) {
                console.error('Error loading data:', err);
                document.getElementById('catalogContent').innerHTML = 
                    '<p style="text-align:center;color:#cc5555;padding:40px 0;">' + t('errorLoading') + '</p>';
            });
    }

    function getPopular() {
        return plantCatalogData.filter(function(p) {
            return p.badge && /popular|bestseller|trending|premium/i.test(p.badge);
        });
    }

    function getByCat(tab) {
        var m = { fruits: 'fruit', orchids: 'orchid', shrubs: 'shrub', trees: 'tree', indoor: 'indoor' };
        if (tab === 'pots') return plantCatalogData.filter(function(p) { return p.type === 'Pot' || /pot/i.test(p.catEN); });
        var k = m[tab];
        return k ? plantCatalogData.filter(function(p) { return new RegExp(k, 'i').test(p.catEN); }) : plantCatalogData;
    }

    function renderPlantCard(p) {
        var name = currentLang === 'mm' ? p.nameMM : p.nameEN;
        var price = p.priceLow === p.priceHigh ?
            p.priceLow.toLocaleString() + ' Ks' :
            p.priceLow.toLocaleString() + ' – ' + p.priceHigh.toLocaleString() + ' Ks';
        var isSold = p.status === 'soldout';
        var desc = currentLang === 'mm' ? p.descMM : p.descEN;
        var sciName = p.sci || '';

        var h = '<div class="plant-card' + (isSold ? ' soldout' : '') + '">';
        h += '<div class="plant-card-img-wrap">';
        h += '<img class="plant-card-img" src="images/' + p.file + '" alt="' + name + '" loading="lazy" onerror="this.style.display=\'none\'">';
        h += '<div class="plant-card-badges">';
        if (p.badge && /popular|bestseller/i.test(p.badge)) {
            h += '<span class="badge-pop">🔥 ' + p.badge + '</span>';
        }
        if (isSold) {
            h += '<span class="badge-stock soldout">SOLD OUT</span>';
        } else if (p.status === 'preorder') {
            h += '<span class="badge-stock preorder">Pre-Order</span>';
        }
        h += '</div>';
        if (isSold) {
            h += '<div class="soldout-badge">SOLD OUT</div>';
        }
        h += '</div>';
        h += '<div class="plant-card-body">';
        h += '<h4>' + name + '</h4>';
        if (p.nameMM !== p.nameEN) {
            h += '<div class="plant-mm">' + p.nameMM + '</div>';
        }
        if (sciName) {
            h += '<div class="plant-sci">' + sciName + '</div>';
        }
        if (desc) {
            h += '<div class="plant-desc">' + desc + '</div>';
        }
        if (p.tags && p.tags.length) {
            h += '<div class="plant-tags">' + p.tags.map(function(t) { return '<span>' + t + '</span>'; }).join('') + '</div>';
        }
        h += '<span class="plant-card-price">' + price + '</span>';
        if (!isSold) {
            h += '<div class="plant-qty-row">';
            h += '<button class="qty-minus">−</button>';
            h += '<span class="qty-num">1</span>';
            h += '<button class="qty-plus">+</button>';
            h += '</div>';
            h += '<button class="btn-add" data-file="' + p.file + '" data-en="' + p.nameEN + '" data-mm="' + p.nameMM + '" data-lo="' + p.priceLow + '" data-hi="' + p.priceHigh + '">';
            h += '🛒 ' + t('addToCart');
            h += '</button>';
        } else {
            h += '<button class="btn-add" style="background:#ccc;color:#666;cursor:not-allowed;" disabled>' + t('soldOut') + '</button>';
        }
        h += '</div></div>';
        return h;
    }

    function renderServices() {
        var g = {};
        serviceCatalogData.forEach(function(s) {
            var c = s.cat || 'Other';
            if (!g[c]) g[c] = [];
            g[c].push(s);
        });
        var h = '<h2 class="section-title">🛠️ ' + (currentLang === 'mm' ? 'ဝန်ဆောင်မှုများ' : 'Services') + '</h2>';
        for (var c in g) {
            h += '<h3 style="margin:24px 0 12px;color:var(--primary);font-weight:700;font-size:1.05rem;">' + c + '</h3>';
            h += '<div class="services-catalog-grid">';
            g[c].forEach(function(s) {
                var n = currentLang === 'mm' ? s.nameMM : s.nameEN;
                var p = s.priceLow === s.priceHigh ?
                    s.priceLow.toLocaleString() + ' Ks' :
                    s.priceLow.toLocaleString() + ' – ' + s.priceHigh.toLocaleString() + ' Ks';
                h += '<div class="svc-card">';
                h += '<div class="s-icon">🛠️</div>';
                h += '<h4>' + n + '</h4>';
                h += '<div class="s-price">' + p + '</div>';
                if (s.features && s.features.length) {
                    h += '<div class="s-features">' + s.features.map(function(f) { return '🌿 ' + f; }).join('<br>') + '</div>';
                }
                h += '<button class="btn-add" data-svc="' + s.nameEN + '" data-mm="' + s.nameMM + '" data-price="' + Math.round((s.priceLow + s.priceHigh) / 2) + '">';
                h += '+' + t('addToCart');
                h += '</button>';
                h += '</div>';
            });
            h += '</div>';
        }
        return h;
    }

    function renderCatalog() {
        var container = document.getElementById('catalogContent');
        var html = '';
        if (currentCatalogTab === 'services') {
            html = renderServices();
        } else {
            var items = currentCatalogTab === 'popular' ? getPopular() :
                        currentCatalogTab === 'all' ? plantCatalogData :
                        getByCat(currentCatalogTab);
            if (currentCatalogTab === 'all' || currentCatalogTab === 'popular') {
                html = '<div class="catalog-grid">' + items.map(renderPlantCard).join('') + '</div>';
            } else {
                var groups = {};
                items.forEach(function(p) {
                    var cat = currentLang === 'mm' ? p.catMM : p.catEN;
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(p);
                });
                for (var cat in groups) {
                    html += '<h2 class="section-title" style="font-size:1.3rem;margin:30px 0 16px;">' + cat + '</h2>';
                    html += '<div class="catalog-grid">' + groups[cat].map(renderPlantCard).join('') + '</div>';
                }
            }
        }
        container.innerHTML = html || '<p style="text-align:center;color:var(--text-soft);padding:40px 0;">' + t('noItems') + '</p>';
        bindButtons();
    }

    function getDeliveryFee() {
        var found = townships.find(function(t) { return t.nameEN === selectedTownship; });
        return found ? found.fee : 0;
    }

    function getTownshipDisplay() {
        var found = townships.find(function(t) { return t.nameEN === selectedTownship; });
        if (!found) return selectedTownship;
        return currentLang === 'mm' ? found.nameMM : found.nameEN;
    }

    // ─── Show Voucher Modal ─────────────────────────────────
    function showVoucher() {
        var overlay = document.getElementById('voucherOverlay');
        var container = document.getElementById('voucherContainer');
        
        var subtotal = 0;
        var itemsHtml = '';
        
        cart.forEach(function(item) {
            var name = currentLang === 'mm' ? (item.nameMM || item.nameEN) : item.nameEN;
            var price = item.unitPrice || 0;
            var itemTotal = price * (item.qty || 1);
            subtotal += itemTotal;
            
            var imgSrc = '';
            if (item.file) {
                imgSrc = 'images/' + item.file;
            } else if (item.type === 'service') {
                imgSrc = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><rect width="60" height="60" fill="#e8f5e9"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="24">🛠️</text></svg>');
            }
            
            itemsHtml += '<div class="voucher-item">';
            if (imgSrc) {
                itemsHtml += '<img class="voucher-item-img" src="' + imgSrc + '" alt="' + name + '" onerror="this.src=\'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="#f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="20">🌿</text></svg>') + '\'">';
            }
            itemsHtml += '<div class="voucher-item-details">';
            itemsHtml += '<div class="voucher-item-name">' + name + '</div>';
            itemsHtml += '<div class="voucher-item-qty">×' + (item.qty || 1) + '</div>';
            itemsHtml += '</div>';
            itemsHtml += '<div class="voucher-item-price">' + itemTotal.toLocaleString() + ' Ks</div>';
            itemsHtml += '</div>';
        });
        
        var deliveryFee = getDeliveryFee();
        var total = subtotal + deliveryFee;
        var now = new Date();
        var dateStr = now.toLocaleDateString(currentLang === 'mm' ? 'my-MM' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        var voucherId = 'PTT-' + Date.now().toString(36).toUpperCase().slice(-6);
        
        var voucherHtml = '<div id="voucherPrintArea">';
        voucherHtml += '<div class="voucher-header">';
        voucherHtml += '<h2>🌿 ' + t('voucherTitle') + '</h2>';
        voucherHtml += '<div class="voucher-subtitle">' + t('voucherSubtitle') + '</div>';
        voucherHtml += '</div>';
        voucherHtml += '<div class="voucher-body">';
        voucherHtml += '<div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:0.8rem;color:var(--text-soft);">';
        voucherHtml += '<span>' + t('voucherDate') + ': ' + dateStr + '</span>';
        voucherHtml += '<span>' + t('voucherId') + ': ' + voucherId + '</span>';
        voucherHtml += '</div>';
        voucherHtml += '<div class="voucher-items">' + itemsHtml + '</div>';
        voucherHtml += '<div class="voucher-summary">';
        voucherHtml += '<div class="voucher-row"><span>' + t('subtotal') + '</span><span>' + subtotal.toLocaleString() + ' Ks</span></div>';
        voucherHtml += '<div class="voucher-row"><span>🚚 ' + t('delivery') + ' (' + getTownshipDisplay() + ')</span><span>' + deliveryFee.toLocaleString() + ' Ks</span></div>';
        voucherHtml += '<div class="voucher-row voucher-total"><span>' + t('total') + '</span><span>' + total.toLocaleString() + ' Ks</span></div>';
        voucherHtml += '</div>';
        voucherHtml += '<p style="text-align:center;margin-top:20px;color:var(--text-soft);font-size:0.85rem;">' + t('contactUs') + '</p>';
        voucherHtml += '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">';
        voucherHtml += '<span style="font-size:0.75rem;">📘 Facebook</span>';
        voucherHtml += '<span style="font-size:0.75rem;">💬 Messenger</span>';
        voucherHtml += '<span style="font-size:0.75rem;">✉️ ' + SOCIAL.email + '</span>';
        voucherHtml += '</div>';
        voucherHtml += '</div>';
        voucherHtml += '<div style="text-align:center;padding:16px;background:var(--bg-light);border-radius:0 0 20px 20px;font-size:0.85rem;color:var(--primary);">';
        voucherHtml += t('voucherThankYou');
        voucherHtml += '</div>';
        voucherHtml += '</div>';
        
        voucherHtml += '<div class="voucher-footer">';
        voucherHtml += '<button class="btn-download-voucher" id="btnDownloadVoucher">📥 ' + t('downloadVoucher') + '</button>';
        voucherHtml += '<button class="btn-close-voucher" id="btnCloseVoucher">✕ ' + t('closeVoucher') + '</button>';
        voucherHtml += '</div>';
        
        container.innerHTML = voucherHtml;
        overlay.classList.add('active');
        
        // Close button
        document.getElementById('btnCloseVoucher').addEventListener('click', function() {
            overlay.classList.remove('active');
        });
        
        // Download button
        document.getElementById('btnDownloadVoucher').addEventListener('click', function() {
            var voucherArea = document.getElementById('voucherPrintArea');
            html2canvas(voucherArea, { 
                scale: 2, 
                useCORS: true, 
                backgroundColor: '#ffffff',
                allowTaint: true,
                logging: false
            })
            .then(function(canvas) {
                var link = document.createElement('a');
                link.download = 'estimate-voucher-' + voucherId + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('✅ Voucher downloaded!');
            })
            .catch(function() {
                showToast(t('errorSave'));
            });
        });
        
        // Close on overlay click
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        });
    }

    // ─── Render Estimate ────────────────────────────────────
    function renderEstimate() {
        var container = document.getElementById('estimatorContent');
        if (!cart.length) {
            container.innerHTML = '<div class="empty-cart"><div class="empty-icon">🛒</div><p style="font-size:1.05rem;color:var(--text-soft);">' + t('emptyCartText') + '</p><p style="color:var(--text-soft);font-size:0.85rem;">' + t('emptyCartSub') + '</p></div>';
            updateCartBadge();
            return;
        }

        var subtotal = 0;
        var html = '';

        cart.forEach(function(item, idx) {
            var name = currentLang === 'mm' ? (item.nameMM || item.nameEN) : item.nameEN;
            var price = item.unitPrice || 0;
            var itemTotal = price * (item.qty || 1);
            subtotal += itemTotal;
            html += '<div class="estimate-item">';
            html += '<div><span class="ei-name">' + name + '</span> <span class="ei-qty">×' + (item.qty || 1) + '</span></div>';
            html += '<div><span class="ei-price">' + itemTotal.toLocaleString() + ' Ks</span>';
            html += '<button class="ei-remove" data-idx="' + idx + '" title="Remove">✕</button></div>';
            html += '</div>';
        });

        html += '<div class="delivery-selector">';
        html += '<label for="townshipSelect">' + t('selectDelivery') + '</label>';
        html += '<select id="townshipSelect">';
        townships.forEach(function(t) {
            var name = currentLang === 'mm' ? t.nameMM : t.nameEN;
            var selected = t.nameEN === selectedTownship ? 'selected' : '';
            html += '<option value="' + t.nameEN + '" ' + selected + '>' + t.icon + ' ' + name + ' (' + t.fee.toLocaleString() + ' Ks)</option>';
        });
        html += '</select>';
        html += '<div class="delivery-fee-display">' + t('deliveryFee') + ': <strong id="deliveryFeeDisplay">' + getDeliveryFee().toLocaleString() + ' Ks</strong></div>';
        html += '</div>';

        var deliveryFee = getDeliveryFee();
        var total = subtotal + deliveryFee;

        html += '<div class="summary-line"><span>' + t('subtotal') + '</span><span>' + subtotal.toLocaleString() + ' Ks</span></div>';
        html += '<div class="summary-line"><span>🚚 ' + t('delivery') + ' (' + getTownshipDisplay() + ')</span><span>' + deliveryFee.toLocaleString() + ' Ks</span></div>';
        html += '<div class="summary-line grand"><span>' + t('total') + '</span><span>' + total.toLocaleString() + ' Ks</span></div>';
        html += '<div class="save-hint">' + t('saveHint') + '</div>';
        html += '<div class="action-grid">';
        html += '<button class="btn-act gold" id="btnSaveImage"><i class="fas fa-receipt"></i> ' + t('saveImage') + '</button>';
        html += '<button class="btn-act green" id="btnClearCart"><i class="fas fa-trash"></i> ' + t('clear') + '</button>';
        html += '</div>';

        html += '<div class="contact-grid">';
        html += '<a href="' + SOCIAL.facebook + '" target="_blank" class="contact-card fb-card"><div class="cc-icon">📘</div><strong>Facebook</strong></a>';
        html += '<a href="' + SOCIAL.messenger + '" target="_blank" class="contact-card"><div class="cc-icon">💬</div><strong>Messenger</strong></a>';
        html += '<a href="' + SOCIAL.tiktok + '" target="_blank" class="contact-card tiktok-card"><div class="cc-icon">🎵</div><strong>TikTok</strong></a>';
        html += '<a href="mailto:' + SOCIAL.email + '" class="contact-card email-card"><div class="cc-icon">✉️</div><strong>Email</strong></a>';
        html += '</div>';

        container.innerHTML = html;
        updateCartBadge();

        // Delivery Selector Event
        var select = document.getElementById('townshipSelect');
        if (select) {
            select.addEventListener('change', function() {
                selectedTownship = this.value;
                localStorage.setItem('ptt_township', selectedTownship);
                renderEstimate();
            });
        }

        // Save Voucher Button
        var saveBtn = document.getElementById('btnSaveImage');
        if (saveBtn) {
            saveBtn.addEventListener('click', function() {
                showVoucher();
            });
        }

        // Clear Cart Button
        var clearBtn = document.getElementById('btnClearCart');
        if (clearBtn) {
            clearBtn.addEventListener('click', function() {
                if (confirm(t('confirmClear'))) {
                    cart = [];
                    localStorage.setItem('ptt_cart', JSON.stringify(cart));
                    renderEstimate();
                    renderCatalog();
                    showToast(t('cartCleared'));
                }
            });
        }

        // Remove Item
        container.querySelectorAll('.ei-remove').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var idx = parseInt(this.dataset.idx);
                cart.splice(idx, 1);
                localStorage.setItem('ptt_cart', JSON.stringify(cart));
                renderEstimate();
                renderCatalog();
                showToast(t('itemRemoved'));
            });
        });
    }

    function bindButtons() {
        document.querySelectorAll('.qty-minus').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.preventDefault();
                var span = this.parentElement.querySelector('.qty-num');
                var v = parseInt(span.textContent) || 1;
                if (v > 1) span.textContent = v - 1;
            });
        });
        document.querySelectorAll('.qty-plus').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.preventDefault();
                var span = this.parentElement.querySelector('.qty-num');
                var v = parseInt(span.textContent) || 1;
                if (v < 99) span.textContent = v + 1;
            });
        });
        document.querySelectorAll('.btn-add[data-file]').forEach(function(b) {
            b.addEventListener('click', function() {
                var file = this.dataset.file;
                var en = this.dataset.en;
                var mm = this.dataset.mm;
                var lo = parseInt(this.dataset.lo);
                var hi = parseInt(this.dataset.hi);
                var qtySpan = this.parentElement.querySelector('.qty-num');
                var qty = qtySpan ? parseInt(qtySpan.textContent) || 1 : 1;
                var unit = Math.round((lo + hi) / 2);

                var existing = cart.find(function(c) { return c.file === file; });
                if (existing) {
                    existing.qty += qty;
                } else {
                    cart.push({ file: file, nameEN: en, nameMM: mm, unitPrice: unit, qty: qty, type: 'plant' });
                }
                localStorage.setItem('ptt_cart', JSON.stringify(cart));
                renderEstimate();
                updateCartBadge();
                showToast(t('cartAdded'));

                this.classList.add('added');
                var orig = this.innerHTML;
                this.innerHTML = '✅';
                var self = this;
                setTimeout(function() {
                    self.classList.remove('added');
                    self.innerHTML = orig;
                }, 1200);

                if (qtySpan) qtySpan.textContent = '1';
            });
        });

        document.querySelectorAll('.btn-add[data-svc]').forEach(function(b) {
            b.addEventListener('click', function() {
                var svc = this.dataset.svc;
                var mm = this.dataset.mm || svc;
                var price = parseInt(this.dataset.price);

                var existing = cart.find(function(c) { return c.service === svc; });
                if (existing) {
                    existing.qty = (existing.qty || 1) + 1;
                } else {
                    cart.push({ service: svc, nameEN: svc, nameMM: mm, unitPrice: price, qty: 1, type: 'service' });
                }
                localStorage.setItem('ptt_cart', JSON.stringify(cart));
                renderEstimate();
                updateCartBadge();
                showToast(t('cartAdded'));
            });
        });
    }

    function updateCartBadge() {
        var count = cart.reduce(function(s, i) { return s + (i.qty || 1); }, 0);
        var badge = document.getElementById('cartCountHeader');
        if (count > 0) {
            badge.style.display = 'flex';
            badge.textContent = count;
        } else {
            badge.style.display = 'none';
        }
    }

    function showToast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(function() { el.classList.remove('show'); }, 2500);
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.lang === lang);
        });
        updateHeaderTranslations();
        updateSectionTitles();
        renderCatalog();
        renderEstimate();
    }

    function setupTabs() {
        document.querySelectorAll('.catalog-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.catalog-tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                currentCatalogTab = this.dataset.cat;
                renderCatalog();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }

    document.getElementById('backToTop').addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.querySelectorAll('.lang-btn').forEach(function(b) {
        b.addEventListener('click', function() { setLanguage(this.dataset.lang); });
    });

    setupTabs();
    loadAllData().then(function() {
        updateCartBadge();
        updateHeaderTranslations();
        updateSectionTitles();
    });
})();
</script>

</body>
</html>
